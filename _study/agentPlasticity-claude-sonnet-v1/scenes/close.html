<template id="close-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #cl-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #cl-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #cl-knob1 { left: 722px; top: 724px; font-size: 32px; }
    #cl-knob2 { left: 728px; top: 984px; font-size: 32px; }
    #cl-stamp { left: 130px; top: 1150px; font-size: 80px; }
    #cl-dot { left: 190px; top: 1162px; font-size: 32px; }
    #cl-slope { left: 200px; top: 640px; font-size: 30px; }
    .cl-q { position: absolute; left: 0; width: 1080px; text-align: center; font: 400 104px/1 "Marker", sans-serif; color: var(--white); white-space: nowrap; text-shadow: 6px 6px 0 var(--shadow); }
    #cl-q1 { top: 320px; }
    #cl-q2 { top: 455px; }
    #cl-q3 { top: 590px; color: var(--amber); }
    #cl-handle { left: 0; top: 940px; width: 1080px; text-align: center; font: 400 100px/1 "Marker", sans-serif; color: var(--amber); }
    #cl-credit { left: 0; top: 1070px; width: 1080px; text-align: center; font-size: 25px; }
    #cl-hook { left: 0; top: 1190px; width: 1080px; text-align: center; font-size: 30px; color: var(--dim); }
  </style>
  <div id="root" data-composition-id="close" data-width="1080" data-height="1920">
    <div id="cl-cam">
      <svg id="cl-svg" class="ink sketch" viewBox="0 0 1080 1920">
        <g id="cl-g12">
          <path id="cl-base" class="ln dim thick" d="M150 1100 L580 1100" />
          <rect id="cl-b1" class="fl amber" x="200" y="740" width="130" height="360" />
          <rect id="cl-b2" class="fl cyan" x="400" y="1031" width="130" height="69" />
          <g id="cl-k1">
            <circle class="ln thick" cx="780" cy="640" r="70" />
            <path class="ln amber heavy" d="M780 640 L780 584" />
          </g>
          <g id="cl-k2">
            <circle class="ln thick" cx="780" cy="900" r="70" />
            <path class="ln amber heavy" d="M780 900 L780 844" />
          </g>
        </g>
        <g id="cl-g13">
          <path id="cl-ax-y" class="ln thick" d="M150 1300 L150 560 M150 560 L134 588 M150 560 L166 588" />
          <path id="cl-ax-x" class="ln thick" d="M150 1300 L930 1300 M930 1300 L902 1284 M930 1300 L902 1316" />
          <path id="cl-sl" class="ln amber heavy" d="M330 1130 L860 640" />
          <path id="cl-arrowhead" class="fl amber" d="M0 -20 L40 0 L0 20 Z" />
          <circle id="cl-pt" class="fl" cx="330" cy="1130" r="18" />
        </g>
      </svg>
      <div id="cl-knob1" class="lbl cyan" data-bind="l12.setup"></div>
      <div id="cl-knob2" class="lbl cyan" data-bind="l12.price"></div>
      <div id="cl-stamp" class="stamp" data-bind="l12.stamp"></div>
      <div id="cl-dot" class="tag cyan" data-bind="l13.dot"></div>
      <div id="cl-slope" class="tag" data-bind="l13.slope"></div>
      <div id="cl-q1" class="cl-q" data-bind="l14.q1"></div>
      <div id="cl-q2" class="cl-q" data-bind="l14.q2"></div>
      <div id="cl-q3" class="cl-q" data-bind="l14.q3"></div>
      <div id="cl-handle" class="abs" data-bind="l14.handle"></div>
      <div id="cl-credit" class="lbl white" data-bind="l14.credit"></div>
      <div id="cl-hook" class="lbl" data-bind="l14.hook"></div>
    </div>
    <div id="cl-flash" style="position:absolute;left:0;top:0;width:1080px;height:1920px;background:#ffe2b0;opacity:0"></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l12', w, n), b = (w, n) => KIT.cue('l13', w, n), q = (w, n) => KIT.cue('l14', w, n), D = KIT.sceneDur('close');
      KIT.bind('#cl-cam');
      const tl = gsap.timeline({ paused: true });
      // bar heights follow the storyboard values (298 and 57), as in the twist scene
      const v1 = parseFloat(KIT.data('l07').v1), v2 = parseFloat(KIT.data('l07').v2), HMAX = 360, BASE = 1100;
      const h1 = HMAX * v1 / Math.max(v1, v2), h2 = HMAX * v2 / Math.max(v1, v2);
      const r1 = document.querySelector('#cl-b1'), r2 = document.querySelector('#cl-b2');
      r1.setAttribute('y', BASE - h1); r1.setAttribute('height', h1); r2.setAttribute('y', BASE - h2); r2.setAttribute('height', h2);

      // l12: the two bars move when the setup or the price changes, so the numbers are not a ranking
      KIT.draw(tl, '#cl-base', 0.1, 0.4);
      tl.fromTo('#cl-b1', { scaleY: 0, svgOrigin: `265 ${BASE}` }, { scaleY: 1, svgOrigin: `265 ${BASE}`, duration: 0.5, ease: 'power3.out' }, a('These'));
      tl.fromTo('#cl-b2', { scaleY: 0, svgOrigin: `465 ${BASE}` }, { scaleY: 1, svgOrigin: `465 ${BASE}`, duration: 0.5, ease: 'power3.out' }, a('These') + 0.1);
      KIT.pop(tl, '#cl-k1', a('depend'), { from: 0.2 });
      KIT.pop(tl, '#cl-k2', a('depend') + 0.1, { from: 0.2 });
      KIT.rise(tl, '#cl-knob1', a('depend') + 0.2, { y: 16 });
      KIT.rise(tl, '#cl-knob2', a('depend') + 0.3, { y: 16 });
      tl.to('#cl-k1', { rotation: 110, svgOrigin: '780 640', duration: 0.5, ease: 'power2.inOut' }, a('setup'));
      tl.to('#cl-b1', { scaleY: 0.82, svgOrigin: `265 ${BASE}`, duration: 0.5, ease: 'power2.inOut' }, a('setup'));
      tl.to('#cl-b2', { scaleY: 1.5, svgOrigin: `465 ${BASE}`, duration: 0.5, ease: 'power2.inOut' }, a('setup'));
      tl.to('#cl-k2', { rotation: -120, svgOrigin: '780 900', duration: 0.5, ease: 'power2.inOut' }, a('prices'));
      tl.to('#cl-b1', { scaleY: 1.12, svgOrigin: `265 ${BASE}`, duration: 0.5, ease: 'power2.inOut' }, a('prices'));
      tl.to('#cl-b2', { scaleY: 0.7, svgOrigin: `465 ${BASE}`, duration: 0.5, ease: 'power2.inOut' }, a('prices'));
      KIT.slam(tl, '#cl-stamp', a('rank') - 0.05, { from: 2.4, shake: false });
      tl.to('#cl-stamp', { rotation: -8, duration: 0.2 }, a('rank') + 0.15);
      KIT.shake(tl, '#cl-cam', a('rank') + 0.12, { amp: 14, dur: 0.3 });

      // l13: a score is one dot; plasticity is the slope leaving it
      tl.to(['#cl-g12', '#cl-knob1', '#cl-knob2', '#cl-stamp'], { opacity: 0, duration: 0.3 }, b('A') - 0.05);
      KIT.draw(tl, '#cl-ax-y', b('A'), 0.5); KIT.draw(tl, '#cl-ax-x', b('A') + 0.1, 0.5);
      tl.fromTo('#cl-pt', { scale: 0, svgOrigin: '330 1130' }, { scale: 1, svgOrigin: '330 1130', duration: 0.3, ease: 'back.out(3)' }, b('score'));
      KIT.pop(tl, '#cl-dot', b('can'));
      tl.to('#cl-pt', { scale: 1.6, svgOrigin: '330 1130', duration: 0.18, yoyo: true, repeat: 1 }, b('today'));
      KIT.draw(tl, '#cl-sl', b('Plasticity'), 0.9, { ease: 'power1.inOut' });
      KIT.pop(tl, '#cl-slope', b('how'));
      tl.fromTo('#cl-arrowhead', { opacity: 0, x: 330, y: 1130, rotation: -43 }, { opacity: 1, x: 330, y: 1130, rotation: -43, duration: 0.05 }, b('efficiently') - 0.05);
      tl.to('#cl-arrowhead', { x: 860, y: 640, duration: 0.55, ease: 'power2.in' }, b('efficiently'));
      KIT.sparks(tl, '#cl-cam', 860, 640, b('efficiently') + 0.5, { n: 10, r: 130 });

      // l14: the question, then the end card (the hook words return as a quiet answer)
      tl.to(['#cl-g13', '#cl-dot', '#cl-slope'], { opacity: 0, duration: 0.25 }, q('What') - 0.1);
      KIT.slam(tl, '#cl-q1', q('What'), { from: 1.3, shake: false });
      KIT.slam(tl, '#cl-q2', q('agent') - 0.05, { from: 1.3, shake: false });
      KIT.slam(tl, '#cl-q3', q('fails') - 0.05, { from: 1.3, shake: false });
      KIT.shake(tl, '#cl-cam', q('fails') + 0.15, { amp: 12, dur: 0.3 });
      tl.to(['#cl-q1', '#cl-q2', '#cl-q3'], { opacity: 0.18, duration: 0.3 }, q('fails') + 0.35);
      KIT.rise(tl, '#cl-handle', q('fails') + 0.4, { y: 50 });
      KIT.rise(tl, '#cl-credit', q('fails') + 0.6, { y: 0 });
      tl.fromTo('#cl-hook', { opacity: 0 }, { opacity: 0.8, duration: 0.5 }, q('fails') + 0.7);
      tl.fromTo('#cl-cam', { scale: 1 }, { scale: 1.03, duration: D, ease: 'sine.inOut', immediateRender: false }, 0);

      // soft light pulses on emphasis words (line drawings alone change too few pixels to count as motion)
      [a('setup'), a('prices'), a('Do'), b('what'), b('today'), b('Plasticity'), b('efficiently')].forEach((t) => tl.fromTo('#cl-flash', { opacity: 0.2 }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t));

      window.__timelines["close"] = tl;
    })();
  </script>
</template>
