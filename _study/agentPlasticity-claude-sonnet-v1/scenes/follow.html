<template id="follow-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #fol-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #fol-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #fol-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #fol-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #fol-note { left: 170px; top: 400px; width: 520px; padding: 26px 30px; box-sizing: border-box; background: var(--amber); color: var(--deep); font: 400 46px/1.1 "Marker", sans-serif; border: 4px solid var(--ink); transform-origin: 50% 50%; }
    #fol-files { left: 170px; top: 700px; width: 700px; height: 470px; padding: 28px 40px; box-sizing: border-box; }
    #fol-files .head { font-size: 38px; border-bottom: 3px solid var(--deep); padding-bottom: 12px; }
    .fol-row { position: absolute; left: 40px; font-size: 40px; opacity: 0; }
    #fol-cur { position: absolute; left: 0; top: 0; width: 0; height: 0; border-left: 26px solid var(--coral); border-top: 15px solid transparent; border-bottom: 15px solid transparent; opacity: 0; }
  </style>
  <div id="root" data-composition-id="follow" data-width="1080" data-height="1920">
    <div id="fol-cam">
      <svg id="fol-svg" class="ink sketch" viewBox="0 0 1080 1920">
        <path id="fol-mon" class="ln thick" d="M150 330 H930 V1260 H150 Z" />
        <path id="fol-mon2" class="ln dim thin" d="M150 1190 H930" />
        <path id="fol-arrow" class="ln amber thick" d="M700 500 H744 M744 500 L730 488 M744 500 L730 512" />
        <g id="fol-prog">
          <rect class="fl panel" x="770" y="430" width="130" height="130" rx="16" />
          <rect class="ln cyan thick" x="770" y="430" width="130" height="130" rx="16" />
          <path class="ln cyan thick" d="M815 470 L795 495 L815 520 M855 470 L875 495 L855 520" />
        </g>
      </svg>
      <div id="fol-note" class="abs" data-bind="l11.note"></div>
      <div id="fol-files" class="plate">
        <div class="head" data-bind="l11.head"></div>
        <div id="fol-r1" class="fol-row" style="top:90px" data-bind="l11.f1"></div>
        <div id="fol-r2" class="fol-row" style="top:160px" data-bind="l11.f2"></div>
        <div id="fol-r3" class="fol-row" style="top:230px" data-bind="l11.f3"></div>
        <div id="fol-r4" class="fol-row" style="top:300px" data-bind="l11.f4"></div>
      </div>
      <div id="fol-cur"></div>
      <div id="fol-stage"></div>
    </div>
    <div id="fol-hud"></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l10', w, n), b = (w, n) => KIT.cue('l11', w, n);
      KIT.bind('#fol-cam');
      const tl = gsap.timeline({ paused: true });

      // receipt 2 (page 9): "Writing down an instruction is not the same as following it", the last word circled
      const tR = Math.max(0.1, a('Writing') - 0.45), endR = a('it') + 0.55;
      const R = KIT.read(tl, { cam: '#fol-cam', parent: '#fol-stage', hud: '#fol-hud', tagY: 260, id: 'instruction', t: tR, label: KIT.data('l10').receipt,
        x: 40, y: 860, width: 1000, zoom: 3.4, fx: 90, fy: 860, follow: 0,
        marks: [[a('Writing'), a('not') - 0.05], [a('not'), a('it') + 0.4]],
        circles: [{ word: 'following', t: a('following') + 0.1 }] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      tl.to([R.el, '#fol-stage-instruction-tag'], { opacity: 0, duration: 0.3 }, endR);
      tl.to('#fol-cam', { scale: 1, x: 0, y: 0, duration: 0.35, ease: 'power2.inOut' }, endR - 0.05);

      // l11: the monitor draws on, the note slaps on ("told"), the program icon is what it points at
      KIT.draw(tl, '#fol-mon', endR, 0.5, { ease: 'power2.inOut' });
      KIT.draw(tl, '#fol-mon2', endR + 0.2, 0.3);
      KIT.slam(tl, '#fol-note', b('told') - 0.05, { from: 2.2, shake: false });
      tl.to('#fol-note', { rotation: -3, duration: 0.2 }, b('told') + 0.2);
      KIT.shake(tl, '#fol-cam', b('told') + 0.12, { amp: 12, dur: 0.3 });
      KIT.draw(tl, '#fol-arrow', b('load'), 0.35, { ease: 'power2.out' });
      KIT.pop(tl, '#fol-prog', b('program') - 0.05, { from: 0.3 });
      KIT.sparks(tl, '#fol-cam', 835, 495, b('program'), { n: 8, r: 110 });

      // "listed files instead": the file list slides in, a pointer runs down it, the note is ignored
      tl.fromTo('#fol-files', { x: 900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: 'power3.out' }, b('listed') - 0.1);
      ['#fol-r1', '#fol-r2', '#fol-r3', '#fol-r4'].forEach((id, k) => tl.fromTo(id, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.18 }, b('listed') + 0.2 + k * 0.08));
      tl.fromTo('#fol-cur', { opacity: 0, x: 190, y: 800 }, { opacity: 1, x: 190, y: 800, duration: 0.1 }, b('files') - 0.05);
      tl.to('#fol-cur', { y: 1010, duration: 0.5, ease: 'power1.inOut' }, b('files'));
      tl.to('#fol-note', { rotation: 4, duration: 0.1, yoyo: true, repeat: 5, ease: 'sine.inOut' }, b('instead'));
      tl.to(['#fol-prog', '#fol-arrow'], { opacity: 0.25, duration: 0.3 }, b('instead'));
      tl.to('#fol-cur', { opacity: 0, duration: 0.2 }, b('instead') + 0.5);
      tl.fromTo('#fol-cam', { scale: 1 }, { scale: 1.05, duration: 2.2, ease: 'sine.inOut', immediateRender: false }, b('listed'));

      window.__timelines["follow"] = tl;
    })();
  </script>
</template>
