<template id="plot-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #plot-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #plot-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #plot-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #plot-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #plot-yl { left: 176px; top: 476px; font-size: 32px; }
    #plot-xl { left: 700px; top: 1434px; font-size: 32px; }
    #plot-vault { left: 176px; top: 392px; font-size: 26px; }
    #plot-lr { left: 790px; top: 850px; font-size: 32px; }
    #plot-lrun { left: 470px; top: 1044px; font-size: 32px; }
    #plot-k1 { left: 560px; top: 640px; font-size: 30px; }
    #plot-k2 { left: 640px; top: 1150px; font-size: 30px; }
    #plot-k3 { left: 640px; top: 1372px; font-size: 30px; }
  </style>
  <div id="root" data-composition-id="plot" data-width="1080" data-height="1920">
    <div id="plot-cam">
      <svg id="plot-svg" class="ink sketch" viewBox="0 0 1080 1920">
        <path id="plot-ax-y" class="ln thick" d="M150 1420 L150 520 M150 520 L134 548 M150 520 L166 548" />
        <path id="plot-ax-x" class="ln thick" d="M150 1420 L960 1420 M960 1420 L932 1404 M960 1420 L932 1436" />
        <path id="plot-line" class="ln amber heavy" d="M150 1250 L880 640" />
        <path id="plot-run" class="ln cyan thick" d="M420 1024 L760 1024" />
        <path id="plot-rise" class="ln amber thick" d="M760 1024 L760 740" />
        <circle id="plot-coin" class="fl amber" cx="420" cy="1024" r="18" />
        <path id="plot-u1" class="ln amber heavy" d="M150 1250 C 300 1000 520 760 940 600" />
        <path id="plot-u2" class="ln amber thick" d="M150 1250 C 320 1120 600 880 940 800" />
        <path id="plot-f1" class="ln cyan thick" d="M150 1250 C 400 1244 700 1230 940 1226" />
        <path id="plot-f2" class="ln cyan thick" d="M150 1250 C 400 1262 700 1256 940 1262" />
        <path id="plot-d1" class="ln dim heavy" d="M150 1250 C 400 1290 700 1340 940 1390" />
        <circle id="plot-dot" class="fl" cx="150" cy="1250" r="14" />
      </svg>
      <div id="plot-yl" class="lbl cyan" data-bind="l03.y"></div>
      <div id="plot-xl" class="lbl cyan" data-bind="l03.x"></div>
      <div id="plot-vault" class="tag cyan" data-bind="l03.vault"></div>
      <div id="plot-lr" class="lbl amber" data-bind="l04.rise"></div>
      <div id="plot-lrun" class="lbl cyan" data-bind="l04.run"></div>
      <div id="plot-k1" class="tag" data-bind="l05.k1"></div>
      <div id="plot-k2" class="tag cyan" data-bind="l05.k2"></div>
      <div id="plot-k3" class="tag coral" data-bind="l05.k3"></div>
      <div id="plot-stage"></div>
    </div>
    <div id="plot-hud"></div>
    <div id="plot-flash" style="position:absolute;left:0;top:0;width:1080px;height:1920px;background:#ffe2b0;opacity:0"></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l03', w, n), b = (w, n) => KIT.cue('l04', w, n), e = (w, n) => KIT.cue('l05', w, n), D = KIT.sceneDur('plot');
      KIT.bind('#plot-cam');
      const tl = gsap.timeline({ paused: true });

      // the axes draw on, the start dot lands
      KIT.draw(tl, '#plot-ax-y', 0.05, 0.6);
      KIT.draw(tl, '#plot-ax-x', 0.2, 0.6);
      tl.fromTo('#plot-dot', { scale: 0, svgOrigin: '150 1250' }, { scale: 1, svgOrigin: '150 1250', duration: 0.25, ease: 'back.out(3)' }, 0.55);
      KIT.rise(tl, '#plot-yl', a('Plasticity'), { y: 20 });
      KIT.rise(tl, '#plot-xl', a('Plasticity') + 0.1, { y: 20 });
      KIT.pop(tl, '#plot-vault', a('means') - 0.05);

      // receipt 0 (page 4): the definition, read in two highlights while the line is spoken
      const tR = Math.max(0.1, a('means') - 0.1), endR = a('cost') + 0.55;
      const R = KIT.read(tl, { cam: '#plot-cam', parent: '#plot-stage', hud: '#plot-hud', tagY: 260, id: 'definition', t: tR, label: KIT.data('l03').receipt,
        x: 40, y: 860, width: 1000, zoom: 3.4, fx: 90, fy: 860, follow: 0,
        marks: [[a('held-out'), a('per') - 0.05], [a('per'), a('cost') + 0.4]] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      tl.to([R.el, '#plot-stage-definition-tag'], { opacity: 0, duration: 0.3 }, endR);
      tl.to('#plot-cam', { scale: 1, x: 0, y: 0, duration: 0.35, ease: 'power2.inOut' }, endR - 0.05);

      // l04: "score gained per dollar" is the slope: a line climbs, a rise-over-run triangle marks it
      KIT.draw(tl, '#plot-line', b('plain'), 1.3, { ease: 'power1.inOut' });
      KIT.draw(tl, '#plot-rise', b('score'), 0.35, { ease: 'power2.out' });
      KIT.rise(tl, '#plot-lr', b('score') + 0.05, { y: 0, x: 24 });
      KIT.draw(tl, '#plot-run', b('per') - 0.05, 0.3, { ease: 'power2.out' });
      tl.fromTo('#plot-coin', { scale: 0, svgOrigin: '420 1024' }, { scale: 1, svgOrigin: '420 1024', duration: 0.3, ease: 'back.out(3)' }, b('dollar') - 0.05);
      KIT.rise(tl, '#plot-lrun', b('dollar'), { y: 20 });
      KIT.sparks(tl, '#plot-cam', 420, 1024, b('dollar'), { n: 8, r: 110 });
      KIT.shake(tl, '#plot-cam', b('dollar') + 0.05, { amp: 8, dur: 0.22 });

      // l05: the same axes now carry five more curves from the same start. Two climb, two stay level, one sags
      tl.to(['#plot-line', '#plot-run', '#plot-rise', '#plot-coin', '#plot-lr', '#plot-lrun'], { opacity: 0, duration: 0.25 }, e('Some') - 0.1);
      KIT.draw(tl, '#plot-u1', e('improved') - 0.1, 0.8, { ease: 'power2.out' });
      KIT.draw(tl, '#plot-u2', e('improved'), 0.7, { ease: 'power2.out' });
      KIT.pop(tl, '#plot-k1', e('improved') + 0.7);
      KIT.draw(tl, '#plot-f1', e('flat') - 0.1, 0.55, { ease: 'power2.out' });
      KIT.draw(tl, '#plot-f2', e('flat'), 0.55, { ease: 'power2.out' });
      KIT.pop(tl, '#plot-k2', e('flat') + 0.1);
      KIT.draw(tl, '#plot-d1', e('worse') - 0.2, 0.6, { ease: 'power2.in' });
      KIT.pop(tl, '#plot-k3', e('worse') + 0.2);
      KIT.shake(tl, '#plot-cam', e('worse') + 0.3, { amp: 10, dur: 0.25 });
      tl.fromTo('#plot-cam', { scale: 1 }, { scale: 1.04, duration: D - e('Some'), ease: 'sine.inOut', immediateRender: false }, e('Some'));

      // soft light pulses on the spoken emphasis words: line drawings alone change too few pixels to count as motion
      [a('cost'), b('score'), b('dollar'), e('improved'), e('flat'), e('worse')].forEach((t) => tl.fromTo('#plot-flash', { opacity: 0.22 }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t));

      window.__timelines["plot"] = tl;
    })();
  </script>
</template>
