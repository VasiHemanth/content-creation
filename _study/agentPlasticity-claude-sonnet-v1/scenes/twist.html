<template id="twist-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #tw-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #tw-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #tw-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #tw-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #tw-n1 { left: 600px; top: 500px; font-size: 30px; }
    #tw-n2 { left: 560px; top: 690px; font-size: 30px; }
    #tw-higher { left: 660px; top: 446px; font-size: 30px; }
    #tw-faster { left: 330px; top: 944px; font-size: 30px; }
    #tw-sketch { left: 480px; top: 1436px; font-size: 26px; color: var(--dim); }
    #tw-est { left: 150px; top: 408px; font-size: 28px; }
    #tw-unit { left: 380px; top: 408px; font-size: 28px; }
    #tw-v1 { left: 230px; top: 520px; width: 200px; text-align: center; font: 400 120px/1 "Marker", sans-serif; color: var(--amber); }
    #tw-v2 { left: 620px; top: 1090px; width: 200px; text-align: center; font: 400 110px/1 "Marker", sans-serif; color: var(--cyan); }
    #tw-bn1 { left: 600px; top: 1384px; font-size: 28px; }
    #tw-bn2 { left: 210px; top: 1384px; font-size: 28px; }
    #tw-top { left: 600px; top: 1034px; font-size: 28px; }
  </style>
  <div id="root" data-composition-id="twist" data-width="1080" data-height="1920">
    <div id="tw-cam">
      <svg id="tw-svg" class="ink sketch" viewBox="0 0 1080 1920">
        <g id="tw-chart">
          <path id="tw-ax-y" class="ln thick" d="M150 1420 L150 520 M150 520 L134 548 M150 520 L166 548" />
          <path id="tw-ax-x" class="ln thick" d="M150 1420 L960 1420 M960 1420 L932 1404 M960 1420 L932 1436" />
          <path id="tw-fable" class="ln amber heavy" d="M150 1250 C 450 1235 700 930 940 560" />
          <path id="tw-sol" class="ln cyan heavy" d="M150 1250 C 190 880 330 760 520 748 C 680 738 820 744 940 748" />
          <circle id="tw-dot" class="fl" cx="150" cy="1250" r="14" />
          <path id="tw-arrow" class="ln amber thick" d="M326 962 L268 912 M268 912 L292 914 M268 912 L276 936" />
        </g>
        <path id="tw-base" class="ln dim thick" d="M180 1360 L880 1360" />
        <rect id="tw-bar1" class="fl amber" x="230" y="660" width="200" height="700" />
        <rect id="tw-ghost" x="620" y="1226" width="200" height="134" rx="6" fill="none" stroke="#6aa9d0" stroke-width="4" stroke-dasharray="12 10" />
        <rect id="tw-bar2" class="fl cyan" x="620" y="1226" width="200" height="134" />
      </svg>
      <div id="tw-n1" class="tag" data-bind="l06.n1"></div>
      <div id="tw-n2" class="tag cyan" data-bind="l06.n2"></div>
      <div id="tw-higher" class="lbl amber" data-bind="l06.higher"></div>
      <div id="tw-faster" class="lbl cyan" data-bind="l06.faster"></div>
      <div id="tw-sketch" class="lbl" data-bind="l06.sketch"></div>
      <div id="tw-est" class="tag" data-bind="l07.est"></div>
      <div id="tw-unit" class="tag cyan" data-bind="l07.unit"></div>
      <div id="tw-v1" class="abs" data-bind="l07.v1"></div>
      <div id="tw-v2" class="abs" data-bind="l07.v2"></div>
      <div id="tw-bn2" class="tag cyan" data-bind="l06.n2"></div>
      <div id="tw-bn1" class="tag" data-bind="l06.n1"></div>
      <div id="tw-top" class="tag" data-bind="l07.top"></div>
      <div id="tw-stage"></div>
    </div>
    <div id="tw-flash" style="position:absolute;left:0;top:0;width:1080px;height:1920px;background:#ffe2b0;opacity:0"></div>
    <div id="tw-hud"></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l06', w, n), b = (w, n) => KIT.cue('l07', w, n);
      KIT.bind('#tw-cam');
      const tl = gsap.timeline({ paused: true });
      // bar heights come from the storyboard values (298 and 57), never from literals
      const v1 = parseFloat(KIT.data('l07').v1), v2 = parseFloat(KIT.data('l07').v2), HMAX = 700, BASE = 1360;
      const h1 = HMAX * v1 / Math.max(v1, v2), h2 = HMAX * v2 / Math.max(v1, v2);
      document.querySelector('#tw-bar1').setAttribute('y', BASE - h1); document.querySelector('#tw-bar1').setAttribute('height', h1);
      document.querySelector('#tw-bar2').setAttribute('y', BASE - h2); document.querySelector('#tw-bar2').setAttribute('height', h2);
      document.querySelector('#tw-ghost').setAttribute('y', BASE - h2); document.querySelector('#tw-ghost').setAttribute('height', h2);
      document.querySelector('#tw-v1').style.top = `${BASE - h1 - 150}px`;
      document.querySelector('#tw-v2').style.top = `${BASE - h2 - 130}px`;
      document.querySelector('#tw-top').style.top = `${BASE - h2 - 250}px`;

      // l06: two curves from one start. The slow one ends higher; the steep one stops lower
      KIT.draw(tl, '#tw-ax-y', 0.05, 0.5); KIT.draw(tl, '#tw-ax-x', 0.15, 0.5);
      tl.fromTo('#tw-dot', { scale: 0, svgOrigin: '150 1250' }, { scale: 1, svgOrigin: '150 1250', duration: 0.25, ease: 'back.out(3)' }, 0.4);
      KIT.draw(tl, '#tw-sol', a('agent'), 0.65, { ease: 'power2.out' });
      KIT.pop(tl, '#tw-n2', a('agent') + 0.6);
      KIT.draw(tl, '#tw-fable', a('ultimately'), 1.2, { ease: 'power1.inOut' });
      KIT.pop(tl, '#tw-n1', a('best') - 0.1);
      KIT.rise(tl, '#tw-higher', a('best'), { y: 20 });
      KIT.rise(tl, '#tw-sketch', 0.6, { y: 10 });

      // receipt 1 (page 1): "need not be the one that improves most efficiently", about 2 s
      const tR = Math.max(0.1, a('need') - 0.35), endR = a('efficiently') + 0.6;
      const CH = ['#tw-chart', '#tw-n1', '#tw-n2', '#tw-higher', '#tw-sketch'];
      tl.to(CH, { opacity: 0.08, duration: 0.25 }, tR);
      const R = KIT.read(tl, { cam: '#tw-cam', parent: '#tw-stage', hud: '#tw-hud', tagY: 260, id: 'endpoint', t: tR, label: KIT.data('l06').receipt,
        x: 40, y: 860, width: 1000, zoom: 3.4, fx: 90, fy: 860, follow: 0,
        marks: [[a('need'), a('that', 1)], [a('that', 1), a('efficiently') + 0.45]],
        circles: [{ word: 'efficiently', t: a('efficiently') + 0.05 }] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      tl.to([R.el, '#tw-stage-endpoint-tag'], { opacity: 0, duration: 0.3 }, endR);
      tl.to('#tw-cam', { scale: 1, x: 0, y: 0, duration: 0.35, ease: 'power2.inOut' }, endR - 0.05);
      tl.to(CH, { opacity: 1, duration: 0.3 }, endR);
      // back on the curves: the steep part gets an arrow
      KIT.draw(tl, '#tw-arrow', endR + 0.05, 0.3, { ease: 'power2.out' });
      KIT.rise(tl, '#tw-faster', endR + 0.1, { y: 20 });

      // l07: the curves fold into two bars
      KIT.pop(tl, '#tw-est', b('estimates') + 0.05);
      tl.to([...CH, '#tw-faster'], { opacity: 0, duration: 0.3 }, b('gets') - 0.1);
      KIT.draw(tl, '#tw-base', b('one'), 0.5, { ease: 'power2.out' });
      tl.fromTo('#tw-bar1', { scaleY: 0, svgOrigin: `330 ${BASE}` }, { scaleY: 1, svgOrigin: `330 ${BASE}`, duration: 0.9, ease: 'power3.out' }, b('two') - 0.05);
      tl.fromTo('#tw-v1', { opacity: 0 }, { opacity: 1, duration: 0.2 }, b('two') - 0.05);
      KIT.count(tl, '#tw-v1', b('two') - 0.05, 0.9);
      KIT.pop(tl, '#tw-bn2', b('two') + 0.3);
      KIT.pop(tl, '#tw-unit', b('for') - 0.1);
      KIT.shake(tl, '#tw-cam', b('eight') + 0.05, { amp: 10, dur: 0.25 });
      KIT.shake(tl, '#tw-cam', b('dollars') + 0.1, { amp: 6, dur: 0.2 });
      tl.fromTo('#tw-ghost', { opacity: 0 }, { opacity: 1, duration: 0.3 }, b('The', 1));
      KIT.pop(tl, '#tw-top', b('top'));
      tl.fromTo('#tw-bar2', { scaleY: 0, svgOrigin: `720 ${BASE}` }, { scaleY: 1, svgOrigin: `720 ${BASE}`, duration: 0.55, ease: 'power3.out' }, b('fifty') - 0.05);
      tl.to('#tw-ghost', { opacity: 0, duration: 0.2 }, b('fifty') + 0.3);
      tl.fromTo('#tw-v2', { opacity: 0 }, { opacity: 1, duration: 0.2 }, b('fifty') - 0.05);
      KIT.count(tl, '#tw-v2', b('fifty') - 0.05, 0.5);
      KIT.pop(tl, '#tw-bn1', b('fifty') + 0.1);
      KIT.shake(tl, '#tw-cam', b('seven') + 0.05, { amp: 10, dur: 0.25 });

      // soft light pulses on emphasis words (line drawings alone change too few pixels to count as motion)
      [b('eight'), b('dollars'), b('top'), b('seven')].forEach((t) => tl.fromTo('#tw-flash', { opacity: 0.2 }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t));

      window.__timelines["twist"] = tl;
    })();
  </script>
</template>
