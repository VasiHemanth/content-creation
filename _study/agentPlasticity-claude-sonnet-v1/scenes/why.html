<template id="why-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #why-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #why-val { left: 0; top: 300px; width: 1080px; text-align: center; font: 400 190px/1 "Marker", sans-serif; color: var(--amber); text-shadow: 6px 6px 0 var(--shadow); }
    #why-lab { left: 106px; top: 528px; font-size: 30px; }
    #why-grid { position: absolute; left: 106px; top: 596px; width: 868px; height: 428px; }
    .tile { position: absolute; width: 76px; height: 76px; box-sizing: border-box; border: 4px solid #a8dcf2; border-radius: 10px; background: rgba(7, 29, 53, 0); }
    .xm { position: absolute; left: 0; top: 0; width: 68px; height: 68px; opacity: 0; }
    .xm::before, .xm::after { content: ""; position: absolute; left: 4px; top: 30px; width: 60px; height: 8px; border-radius: 4px; background: var(--coral); }
    .xm::before { transform: rotate(45deg); }
    .xm::after { transform: rotate(-45deg); }
    #why-nb { position: absolute; left: 106px; top: 1120px; width: 300px; height: 200px; border-radius: 14px; border: 5px solid var(--ink); background: #8b6a3a; box-shadow: 8px 8px 0 var(--shadow); }
    #why-nb .sp { position: absolute; left: 12px; top: 10px; bottom: 10px; width: 30px; background: radial-gradient(circle at 15px 14px, var(--ink) 6px, transparent 7px) repeat-y; background-size: 30px 36px; }
    #why-nb .cv { position: absolute; left: 58px; top: 72px; font: 400 44px/1 "Marker", sans-serif; color: var(--deep); white-space: nowrap; }
    .dust { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #b9a98a; opacity: 0; }
    #why-k1 { left: 470px; top: 1150px; font-size: 28px; }
    #why-k2 { left: 470px; top: 1216px; font-size: 28px; }
  </style>
  <div id="root" data-composition-id="why" data-width="1080" data-height="1920">
    <div id="why-cam">
      <div id="why-val" class="abs" data-bind="l08.value"></div>
      <div id="why-lab" class="tag cyan" data-bind="l08.lab"></div>
      <div id="why-grid"></div>
      <div id="why-nb"><div class="sp"></div><div class="cv" data-bind="l02.cover"></div></div>
      <div id="why-dust"></div>
      <div id="why-k1" class="tag" data-bind="l09.k1"></div>
      <div id="why-k2" class="tag coral" data-bind="l09.k2"></div>
    </div>
    <div id="why-flash" style="position:absolute;left:0;top:0;width:1080px;height:1920px;background:#ffe2b0;opacity:0"></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l08', w, n), b = (w, n) => KIT.cue('l09', w, n), D = KIT.sceneDur('why');
      KIT.bind('#why-cam');
      const tl = gsap.timeline({ paused: true });

      // a 10 x 5 grid of decisions where an artifact is relevant (a schematic: the tile counts follow the storyboard shares)
      const grid = document.getElementById('why-grid'), tiles = [];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
        const d = document.createElement('div'); d.className = 'tile'; d.style.left = `${c * 88}px`; d.style.top = `${r * 88}px`; grid.appendChild(d); tiles.push(d);
      }
      const N = tiles.length, pct8 = KIT.data('l08')._pct, pct9 = KIT.data('l09')._pct;
      const OPEN8 = 23, DARK9 = [9, 40];
      const closed8 = tiles.filter((_, i) => i !== OPEN8).slice(0, Math.round(N * pct8 / 100));
      const lit9 = tiles.filter((_, i) => !DARK9.includes(i) && i !== OPEN8).slice(0, Math.round(N * pct9 / 100) - 1);
      // failure marks: mostly on tiles that were used (the counts come from _fail and _inuse)
      const nFail = KIT.data('l09')._fail, nUsed = KIT.data('l09')._inuse;
      const markIdx = [4, 13, 22, 31, 47, 40].slice(0, nFail).map((i, k) => (k < nUsed ? i : DARK9[1]));
      const marks = markIdx.map((i) => { const m = document.createElement('div'); m.className = 'xm'; tiles[i].appendChild(m); return m; });
      const dust = Array.from({ length: 7 }, (_, k) => { const d = document.createElement('div'); d.className = 'dust'; d.style.left = `${150 + k * 38}px`; d.style.top = '1110px'; document.getElementById('why-dust').appendChild(d); return d; });
      const rnd = KIT.rng(5);

      // l08: the grid fills in, the notebook is shut, almost every tile goes dark
      tl.fromTo(tiles, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.22, stagger: 0.011, ease: 'back.out(2)' }, a('One') - 0.05);
      KIT.pop(tl, '#why-nb', a('agent'));
      tl.to(closed8, { backgroundColor: '#071d35', borderColor: '#3d78a6', duration: 0.18, stagger: 0.009 }, a('not'));
      tl.to(tiles[OPEN8], { backgroundColor: '#ffb454', borderColor: '#ffb454', duration: 0.2 }, a('not') + 0.35);
      dust.forEach((d, k) => {
        tl.fromTo(d, { y: 0, x: 0, opacity: 0, scale: 0.4 }, { y: -70 - rnd() * 40, x: (rnd() - 0.5) * 50, opacity: 0.8, scale: 1.4, duration: 0.5, ease: 'power2.out' }, a('not') + k * 0.04);
        tl.to(d, { opacity: 0, duration: 0.4 }, a('not') + 0.5 + k * 0.04);
      });
      tl.to('#why-nb', { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, transformOrigin: '50% 50%' }, a('artifacts'));
      tl.to(tiles[OPEN8], { scale: 1.4, duration: 0.18, yoyo: true, repeat: 1, transformOrigin: '50% 50%' }, a('about'));
      KIT.slam(tl, '#why-val', a('ninety') - 0.05, { from: 2.2, shake: false });
      KIT.shake(tl, '#why-cam', a('ninety') + 0.15, { amp: 12, dur: 0.3 });
      KIT.pop(tl, '#why-lab', a('relevant') - 0.05);

      // l09: the strong agents use their artifacts nearly everywhere, and still fail while they use them
      tl.to(['#why-val', '#why-lab'], { opacity: 0, duration: 0.25 }, b('Strong') - 0.1);
      tl.to(lit9, { backgroundColor: '#ffb454', borderColor: '#ffb454', duration: 0.15, stagger: 0.02 }, b('use'));
      tl.to('#why-nb', { boxShadow: '0 0 60px rgba(255,180,84,0.85)', duration: 0.3 }, b('use'));
      KIT.pop(tl, '#why-k1', b('every'));
      marks.forEach((m, k) => tl.fromTo(m, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'power4.in' }, b('failures') + k * 0.14));
      KIT.pop(tl, '#why-k2', b('failures'));
      KIT.shake(tl, '#why-cam', b('failures') + 0.1, { amp: 10, dur: 0.3 });
      tl.to(marks.slice(0, nUsed).map((m) => m.parentNode), { scale: 1.22, duration: 0.16, yoyo: true, repeat: 1, transformOrigin: '50% 50%', stagger: 0.05 }, b('use', 1));
      tl.fromTo('#why-cam', { scale: 1 }, { scale: 1.04, duration: D, ease: 'sine.inOut', immediateRender: false }, 0);

      // soft light pulses on emphasis words (line drawings alone change too few pixels to count as motion)
      [a('relevant'), b('almost')].forEach((t) => tl.fromTo('#why-flash', { opacity: 0.2 }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t));

      window.__timelines["why"] = tl;
    })();
  </script>
</template>
