<template id="breakdown-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #brk-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #brk-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #brk-mon { left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
    #brk-note { left: 250px; top: 430px; width: 580px; padding: 26px 30px; text-align: center; font-size: 46px; background: var(--amber); color: var(--deep); transform-origin: 50% 50%; }
    #brk-files { left: 220px; top: 780px; width: 640px; height: 520px; padding: 30px 40px; box-sizing: border-box; }
    #brk-files .head { font-size: 36px; border-bottom: 3px solid var(--deep); padding-bottom: 14px; }
    .brk-row { position: absolute; left: 40px; font-size: 40px; opacity: 0; }
    #brk-cursor { position: absolute; left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="breakdown" data-width="1080" data-height="1920">
    <div id="brk-cam">
      <div id="brk-stage"></div>
      <svg id="brk-mon" class="ink" viewBox="0 0 1080 1920">
        <rect class="ln thick" x="120" y="300" width="840" height="1000" rx="22" />
        <path class="ln dim thin" d="M120 1220 L960 1220" />
      </svg>
      <div id="brk-note" class="plate" data-bind="l12.note"></div>
      <div id="brk-files" class="plate">
        <div class="head" data-bind="l13.files"></div>
        <div id="brk-f1" class="brk-row" style="top:120px" data-bind="l13.f1"></div>
        <div id="brk-f2" class="brk-row" style="top:200px" data-bind="l13.f2"></div>
        <div id="brk-f3" class="brk-row" style="top:280px" data-bind="l13.f3"></div>
        <div id="brk-f4" class="brk-row" style="top:360px" data-bind="l13.f4"></div>
      </div>
      <svg class="ink" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <circle id="brk-cursor" class="ln amber heavy" cx="260" cy="860" r="18" opacity="0" />
      </svg>
    </div>
    <div id="brk-hud" style="position:absolute;left:0;top:0;width:1080px;height:1920px"></div>
  </div>
  <script>
    (function () {
      const S = 'breakdown', a = (w, n) => KIT.cue('l12', w, n), b = (w, n) => KIT.cue('l13', w, n), D = KIT.sceneDur(S);
      KIT.bind('#brk-cam');
      const tl = gsap.timeline({ paused: true });

      // receipt 4 (page 9): the sentence, two highlights, the circled word lands on "following"
      const tR = Math.max(0.1, a('Writing') - 0.6), endR = a('it') + 0.35;
      const R = KIT.read(tl, { cam: '#brk-cam', parent: '#brk-stage', hud: '#brk-hud', tagY: 260, id: 'instruction', t: tR, label: KIT.data('l12').receipt,
        x: 40, y: 860, width: 1000, zoom: 3.4, fx: 90, fy: 860, follow: 0,
        marks: [[a('Writing'), a('instruction') + 0.2], [a('not'), a('it') + 0.2]],
        circles: [{ word: 'following', t: a('following') + 0.1 }] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      tl.to([R.el, '#brk-stage-instruction-tag'], { opacity: 0, duration: 0.3 }, endR);
      tl.to('#brk-cam', { scale: 1, x: 0, y: 0, duration: 0.4, ease: 'power2.inOut' }, endR);

      // the monitor: a sticky note slapped on it, the note is the instruction
      tl.to('#brk-mon', { opacity: 1, duration: 0.3 }, endR);
      KIT.slam(tl, '#brk-note', endR + 0.2, { from: 2.2, amp: 12 });

      // l13: the file list opens, the cursor walks it, the note wiggles, ignored
      tl.fromTo('#brk-files', { opacity: 0 }, { opacity: 1, duration: 0.3 }, b('opens') - 0.2);
      ['#brk-f1', '#brk-f2', '#brk-f3', '#brk-f4'].forEach((id, k) => {
        tl.fromTo(id, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2 }, b('opens') + 0.1 + k * 0.12);
      });
      tl.set('#brk-cursor', { opacity: 1, attr: { cx: 260, cy: 860 } }, b('opens'));
      tl.to('#brk-cursor', { attr: { cy: 950 }, duration: 0.25, ease: 'power2.inOut' }, b('opens') + 0.1);
      tl.to('#brk-cursor', { attr: { cy: 1030 }, duration: 0.25, ease: 'power2.inOut' }, b('file') + 0.1);
      tl.to('#brk-cursor', { attr: { cy: 1110 }, duration: 0.25, ease: 'power2.inOut' }, b('list') + 0.1);
      tl.to('#brk-cursor', { opacity: 0, duration: 0.15 }, b('anyway') - 0.1);
      tl.to('#brk-note', { rotation: 4, duration: 0.12, yoyo: true, repeat: 3, ease: 'sine.inOut' }, b('anyway'));

      window.__timelines["breakdown"] = tl;
    })();
  </script>
</template>
