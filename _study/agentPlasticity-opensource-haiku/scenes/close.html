<template id="close-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #cl-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #cl-price { left: 740px; top: 520px; font-size: 90px; }
    #cl-hook { position: absolute; left: 0; top: 340px; width: 1080px; text-align: center; font: 400 92px/1.05 "Marker", sans-serif; color: var(--white); opacity: 0; }
    #cl-handle { position: absolute; left: 0; top: 1120px; width: 1080px; text-align: center; font: 400 96px/1 "Marker", sans-serif; color: var(--amber); }
    #cl-credit { left: 0; top: 1320px; width: 1080px; text-align: center; font-size: 30px; }
    .cl-row { position: absolute; left: 180px; width: 720px; height: 150px; box-sizing: border-box; border: 4px solid var(--cyan); }
    #cl-crown { position: absolute; left: 0; top: 0; }
  </style>
  <div id="root" data-composition-id="close" data-width="1080" data-height="1920">
    <div id="cl-cam">
      <!-- l14: the two bars shrink into a lens, a price tag hangs off the rim -->
      <div id="cl-bars" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <svg class="ink" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
          <rect class="fl amber" x="260" y="600" width="240" height="820" />
          <rect class="fl cyan" x="620" y="1263" width="240" height="157" />
          <path class="ln dim thin" d="M220 1420 L900 1420" />
        </svg>
      </div>
      <svg id="cl-lens" class="ink sketch" style="left:0;top:0;width:1080px;height:1920px;opacity:0" viewBox="0 0 1080 1920">
        <circle class="ln thick" cx="540" cy="880" r="300" />
        <path class="ln thick" d="M760 1100 L900 1240" />
        <circle class="ln thin cyan" cx="540" cy="880" r="280" />
      </svg>
      <div id="cl-price" class="tag coral" data-bind="l14.price"></div>

      <!-- l15: a leaderboard, a crown on the top row, then the hook ghosts back and the handle lands -->
      <div id="cl-board">
        <div class="cl-row" style="top:520px"></div>
        <div class="cl-row" style="top:700px"></div>
        <div class="cl-row" style="top:880px"></div>
      </div>
      <svg id="cl-crown" class="ink" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <path id="cl-crownp" class="ln amber heavy" d="M430 500 L470 430 L540 470 L610 430 L650 500 Z" />
      </svg>
      <div id="cl-hook" data-bind="l15.hook"></div>
      <div id="cl-handle" data-bind="l15.handle"></div>
      <div id="cl-credit" class="lbl white" data-bind="l15.credit"></div>
    </div>
  </div>
  <script>
    (function () {
      const S = 'close', a = (w, n) => KIT.cue('l14', w, n), b = (w, n) => KIT.cue('l15', w, n), D = KIT.sceneDur(S);
      KIT.bind('#cl-cam');
      const tl = gsap.timeline({ paused: true });

      // l14: the bars fold into the lens on "lens"; the price tag swings on "prices"
      tl.to('#cl-lens', { opacity: 1, duration: 0.3 }, a('lens') - 0.25);
      tl.to('#cl-bars', { scale: 0.2, x: 0, y: 0, transformOrigin: '540px 880px', duration: 0.6, ease: 'power3.inOut' }, a('lens') - 0.25);
      // the lens pans across the chart while the narration runs (keeps the frame moving through l14)
      tl.to(['#cl-lens', '#cl-bars'], { x: 150, duration: a('ranking') - a('lens') - 0.4, ease: 'sine.inOut' }, a('lens') + 0.4);
      tl.fromTo('#cl-price', { rotation: -18, opacity: 0, scale: 3.2 }, { rotation: 14, opacity: 1, scale: 1, duration: 0.45, ease: 'power4.in' }, a('prices'));
      KIT.shake(tl, '#cl-cam', a('prices') + 0.4, { amp: 8, dur: 0.25 });
      KIT.shake(tl, '#cl-cam', a('ranking'), { amp: 10, dur: 0.3 });
      tl.fromTo('#cl-price', { rotation: 14 }, { rotation: -8, duration: 0.5, ease: 'sine.inOut' }, a('prices') + 0.45);
      // a slow push through l14 keeps the frame moving while the lens pans; it resets before the leaderboard
      tl.fromTo('#cl-cam', { scale: 1 }, { scale: 1.45, duration: a('ranking') + 0.5 - a('lens') - 0.2, ease: 'none' }, a('lens') + 0.2);
      tl.to('#cl-cam', { scale: 1, duration: 0.4, ease: 'power2.inOut' }, b('leaderboard') - 0.4);

      tl.to(['#cl-bars', '#cl-lens', '#cl-price'], { opacity: 0, duration: 0.3 }, b('leaderboard') - 0.3);
      // l15: the leaderboard rises, the crown tips on "winner", then the hook ghosts back
      const rows = Array.from(document.querySelectorAll('#cl-board .cl-row'));
      rows.forEach((r, k) => tl.fromTo(r, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, b('leaderboard') + k * 0.08));
      KIT.pop(tl, '#cl-crownp', b('crowns'), { from: 2.2 });
      tl.to('#cl-crownp', { rotation: -14, transformOrigin: '540px 500px', duration: 0.25, ease: 'back.out(2)' }, b('winner'));
      tl.to('#cl-board .cl-row, #cl-crownp', { opacity: 0, duration: 0.3 }, b('dollar') - 0.2);
      // the hook ghosts back, then dips out so the end card holds only the handle
      tl.fromTo('#cl-hook', { opacity: 0 }, { opacity: 0.85, duration: 0.5 }, b('dollar') - 0.1);
      tl.to('#cl-hook', { opacity: 0, duration: 0.3 }, b('dollar') + 0.4);
      KIT.rise(tl, '#cl-handle', b('dollar') + 0.6, { y: 40 });
      KIT.rise(tl, '#cl-credit', b('dollar') + 0.8, { y: 0 });

      window.__timelines["close"] = tl;
    })();
  </script>
</template>
