<template id="examples-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #ex-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #ex-a, #ex-b { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #ex-lab-a { left: 0; top: 330px; width: 1080px; text-align: center; font-size: 40px; }
    #ex-val-a { position: absolute; left: 0; top: 640px; width: 1080px; text-align: center; font: 400 150px/1 "Marker", sans-serif; color: var(--amber); }
    #ex-model-a { left: 70px; top: 1120px; font-size: 34px; }
    #ex-t1 { left: 70px; top: 960px; font-size: 32px; }
    #ex-t2 { left: 70px; top: 1040px; font-size: 32px; }
    #ex-lab-b { left: 0; top: 1280px; width: 1080px; text-align: center; font-size: 42px; }
    #ex-val-b { left: 0; top: 560px; width: 1080px; text-align: center; font: 400 170px/1 "Marker", sans-serif; color: var(--amber); }
    #ex-box-tag { left: 200px; top: 1360px; }
    #ex-shut { left: 620px; top: 1360px; font-size: 34px; }
  </style>
  <div id="root" data-composition-id="examples" data-width="1080" data-height="1920">
    <div id="ex-cam">
      <!-- l08: one agent's score as a bar -->
      <div id="ex-a">
        <div id="ex-lab-a" class="lbl white" data-bind="l08.lab"></div>
        <div id="ex-val-a" data-bind="l08.value"></div>
        <svg class="ink sketch" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
          <rect id="ex-bar" class="fl amber" x="380" y="770" width="320" height="630" />
          <path class="ln dim thin" d="M300 1400 L780 1400" />
          <circle class="fl cyan" cx="540" cy="745" r="14" />
        </svg>
        <div id="ex-t1" class="tag cyan" data-bind="l08.t1"></div>
        <div id="ex-t2" class="tag cyan" data-bind="l08.t2"></div>
        <div id="ex-model-a" class="tag" data-bind="l08.model"></div>
      </div>
      <!-- l09: the same kind of agent, the toolbox stays shut -->
      <div id="ex-b">
        <div id="ex-val-b" class="stamp" data-bind="l09.value"></div>
        <svg class="ink sketch" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
          <rect class="fl amber" x="330" y="880" width="420" height="260" rx="10" />
          <g id="ex-lid"><rect class="fl" x="310" y="840" width="460" height="56" rx="8" fill="#12263f" /></g>
          <path class="ln dim thin" d="M300 1400 L780 1400" />
        </svg>
        <div id="ex-lab-b" class="lbl white" data-bind="l09.lab"></div>
        <div id="ex-box-tag" class="tag" data-bind="l09.box"></div>
        <div id="ex-shut" class="tag coral" data-bind="l09.shut"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const S = 'examples', a = (w, n) => KIT.cue('l08', w, n), b = (w, n) => KIT.cue('l09', w, n), D = KIT.sceneDur(S);
      KIT.bind('#ex-cam');
      const tl = gsap.timeline({ paused: true });

      // l08: the bar grows to the storyboard value (73.3%), the number counts up with the voice
      KIT.pop(tl, '#ex-lab-a', a('One'), { from: 0.6 });
      tl.fromTo('#ex-bar', { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.9, ease: 'power3.out' }, a('averages'));
      KIT.count(tl, '#ex-val-a', a('seventy'), 1.0);
      KIT.shake(tl, '#ex-a', a('percent'), { amp: 10, dur: 0.3 });
      KIT.shake(tl, '#ex-a', a('last'), { amp: 10, dur: 0.3 });
      KIT.pop(tl, '#ex-t1', a('averages') + 0.2);
      KIT.pop(tl, '#ex-t2', a('chess') + 0.1);
      KIT.pop(tl, '#ex-model-a', a('checkpoints') - 0.2);
      tl.fromTo('#ex-cam', { scale: 1 }, { scale: 1.05, duration: b('Another') - 0.1, ease: 'sine.inOut' }, 0);

      // l09: whip pan to the toolbox at "Another"; the value slams over it on "ninety eight"
      tl.fromTo('#ex-a', { opacity: 1 }, { opacity: 0, duration: 0.12 }, b('Another') - 0.1);
      tl.fromTo('#ex-b', { x: 1080 }, { x: 0, duration: 0.3, ease: 'power4.out' }, b('Another'));
      KIT.slam(tl, '#ex-val-b', b('ninety'), { from: 2.4, amp: 16 });
      KIT.rise(tl, '#ex-lab-b', b('relevant') - 0.1, { y: 0 });
      KIT.pop(tl, '#ex-box-tag', b('use') - 0.1);
      // the lid rattles on "does not use" but stays shut
      KIT.shake(tl, '#ex-lid', b('not'), { amp: 9, dur: 0.3 });
      KIT.pop(tl, '#ex-shut', b('not') + 0.1);
      tl.fromTo('#ex-cam', { scale: 1.05 }, { scale: 1.09, duration: D - (b('Another') - 0.1), ease: 'sine.inOut' }, b('Another'));

      window.__timelines["examples"] = tl;
    })();
  </script>
</template>
