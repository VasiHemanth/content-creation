<template id="problem-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #prob-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #prob-card { left: 170px; top: 430px; width: 740px; height: 760px; padding: 40px; box-sizing: border-box; }
    #prob-card .head { font-size: 48px; border-bottom: 4px solid var(--deep); padding-bottom: 20px; }
    #prob-card .row { position: absolute; left: 40px; top: 300px; font-size: 40px; }
    #prob-card .blank { position: absolute; left: 40px; right: 40px; top: 380px; height: 40px; border-bottom: 4px dashed var(--deep); }
    #prob-final { left: 200px; top: 880px; font-size: 96px; }
    #prob-cal { left: 170px; top: 430px; width: 740px; height: 760px; padding: 40px; box-sizing: border-box; opacity: 0; }
    #prob-cal .head { font-size: 48px; border-bottom: 4px solid var(--deep); padding-bottom: 20px; }
    #prob-cal .grid { position: absolute; left: 60px; top: 150px; display: grid; grid-template-columns: repeat(7, 84px); gap: 14px; }
    #prob-cal .cell { width: 84px; height: 84px; border: 4px solid var(--deep); box-sizing: border-box; opacity: 0; background: var(--paper); }
    #prob-cal .cell.on { background: var(--deep); }
    #prob-cal .note { position: absolute; left: 40px; top: 620px; font-size: 40px; }
  </style>
  <div id="root" data-composition-id="problem" data-width="1080" data-height="1920">
    <div id="prob-cam">
      <div id="prob-card" class="plate">
        <div class="head" data-bind="l02.card"></div>
        <div class="row" data-bind="l02.row"></div>
        <div class="blank"></div>
      </div>
      <div id="prob-final" class="stamp" data-bind="l02.final"></div>
      <div id="prob-cal" class="plate">
        <div class="head" data-bind="l02.cal"></div>
        <div class="grid">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const S = 'problem', c = (w, n) => KIT.cue('l02', w, n), D = KIT.sceneDur(S);
      KIT.bind('#prob-cam');
      const tl = gsap.timeline({ paused: true });

      // one report card, one stamp: a single test at a single moment
      KIT.pop(tl, '#prob-card', c('tests'));
      tl.fromTo('#prob-card .row', { opacity: 0 }, { opacity: 1, duration: 0.2 }, c('tests') + 0.2);
      KIT.slam(tl, "#prob-final", c("moment"), { from: 1.8, amp: 12 });

      // "learn from experience": the card turns over and the calendar turns in, day by day
      tl.fromTo('#prob-card', { rotationY: 0 }, { rotationY: 90, duration: 0.3, ease: 'power2.in' }, c('learn'));
      tl.set('#prob-card', { opacity: 0 }, c('learn') + 0.3);
      tl.fromTo('#prob-cal', { rotationY: -90, opacity: 0 }, { rotationY: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, c('learn') + 0.3);
      tl.fromTo('#prob-final', { opacity: 1 }, { opacity: 0, duration: 0.2 }, c('learn') + 0.2);
      tl.fromTo('#prob-cal .cell', { opacity: 0 }, { opacity: 1, duration: 0.12, stagger: 0.05 }, c('experience') - 0.1);
      tl.to('#prob-cal .cell:nth-child(-n+9)', { backgroundColor: '#0b2a4a', duration: 0.1, stagger: 0.12 }, c('experience') + 0.1);
      tl.fromTo('#prob-cam', { rotation: 0 }, { rotation: -2.5, duration: D, ease: 'sine.inOut' }, 0);

      window.__timelines["problem"] = tl;
    })();
  </script>
</template>
