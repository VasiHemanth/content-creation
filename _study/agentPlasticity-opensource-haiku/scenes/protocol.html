<template id="protocol-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #prot-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 860px; }
    #prot-brain-tag { left: 70px; top: 300px; }
    #prot-board { left: 560px; top: 760px; width: 420px; height: 300px; }
    #prot-board .blank { position: absolute; inset: 0; background: var(--white); }
    #prot-box-tag { left: 96px; top: 1000px; }
    #prot-inherit { left: 0; top: 1190px; width: 1080px; text-align: center; font-size: 42px; }
    #prot-games { position: absolute; left: 0; top: 760px; width: 1080px; height: 360px; }
    .prot-game { position: absolute; left: 0; font-size: 62px; padding: 18px 30px; transform-origin: 50% 50%; }
    #prot-note { left: 150px; top: 1200px; width: 780px; text-align: center; font-size: 56px; padding: 28px 30px; }
  </style>
  <div id="root" data-composition-id="protocol" data-width="1080" data-height="1920">
    <div id="prot-cam">
      <!-- l03: the frozen model, a fresh board, an artifact that moves on -->
      <div id="prot-brain-tag" class="tag cyan" data-bind="l03.brain"></div>
      <svg class="ink sketch" id="prot-svg" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <circle class="ln cyan thick" cx="300" cy="760" r="170" />
        <path class="ln cyan" d="M220 700 Q300 640 380 700 Q410 780 350 840 Q300 900 230 840 Q180 780 220 700" />
        <path id="prot-frost1" class="ln cyan thick" d="M130 620 L200 700 M470 620 L400 700 M130 900 L200 830 M470 900 L400 830 M300 590 L300 650" />
        <path id="prot-arrow" class="ln amber heavy" d="M300 1000 L300 1020" />
        <g id="prot-box">
          <rect x="220" y="1100" width="160" height="110" rx="8" class="fl amber" />
          <path d="M240 1100 L240 1080 L360 1080 L360 1100" class="ln amber thick" />
        </g>
      </svg>
      <div id="prot-board" class="plate"><div class="blank"></div></div>
      <div id="prot-box-tag" class="tag" data-bind="l03.box"></div>
      <div id="prot-inherit" class="lbl amber" data-bind="l03.inherit"></div>
      <!-- l04: four games, then a note written between them -->
      <div id="prot-games">
        <div id="prot-g1" class="prot-game tag cyan" style="left:70px;top:90px" data-bind="l04.g1"></div>
        <div id="prot-g2" class="prot-game tag cyan" style="left:560px;top:90px" data-bind="l04.g2"></div>
        <div id="prot-g3" class="prot-game tag cyan" style="left:70px;top:260px" data-bind="l04.g3"></div>
        <div id="prot-g4" class="prot-game tag cyan" style="left:560px;top:260px" data-bind="l04.g4"></div>
      </div>
      <div id="prot-note" class="plate" data-bind="l04.note"></div>
    </div>
  </div>
  <script>
    (function () {
      const S = 'protocol', a = (w, n) => KIT.cue('l03', w, n), g = (w, n) => KIT.cue('l04', w, n), D = KIT.sceneDur(S);
      KIT.bind('#prot-cam');
      const tl = gsap.timeline({ paused: true });

      // l03: frost lines close over the model on "freezes"
      KIT.pop(tl, '#prot-brain-tag', a('freezes') - 0.05);
      KIT.draw(tl, '#prot-frost1', a('freezes'), 0.6, { ease: 'power2.out' });
      // the board wipes blank on "starts fresh"
      KIT.wipe(tl, '#prot-board', a('starts'), 0.45, { dir: 'left' });
      // the artifact box moves forward on "inherit": from this instance to the next one
      tl.to('#prot-box', { x: 300, duration: 0.5, ease: 'power3.inOut' }, a('inherit'));
      KIT.pop(tl, '#prot-box-tag', a('artifacts') - 0.1);
      KIT.rise(tl, '#prot-inherit', a('instances') - 0.05, { y: 0 });

      // hand over to l04: the l03 layer leaves before the games appear
      const out = g('chess') - 0.25;
      tl.to(['#prot-brain-tag', '#prot-board', '#prot-box-tag', '#prot-inherit', '#prot-svg'], { opacity: 0, duration: 0.25 }, out);
      tl.set('#prot-svg', { opacity: 0 }, out + 0.25);
      KIT.pop(tl, '#prot-g1', g('chess'));
      KIT.pop(tl, '#prot-g2', g('Go'));
      KIT.pop(tl, '#prot-g3', g('Hex'));
      KIT.pop(tl, '#prot-g4', g('NetHack'));
      tl.fromTo('#prot-note', { opacity: 0 }, { opacity: 1, duration: 0.2 }, g('reflect') - 0.2);
      KIT.typeOn(tl, '#prot-note', g('reflect'), 24);
      KIT.shake(tl, '#prot-note', g('revise') - 0.05, { amp: 6, dur: 0.22 });
      tl.fromTo('#prot-cam', { scale: 1 }, { scale: 1.05, duration: D, ease: 'sine.inOut' }, 0);

      window.__timelines["protocol"] = tl;
    })();
  </script>
</template>
