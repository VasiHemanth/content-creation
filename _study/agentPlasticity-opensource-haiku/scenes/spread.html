<template id="spread-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #spr-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #spr-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #spr-chart { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="spread" data-width="1080" data-height="1920">
    <div id="spr-cam">
      <svg id="spr-chart" class="ink sketch" viewBox="0 0 1080 1920">
        <path class="ln dim thin" d="M120 1440 L960 1440 M140 1440 L140 500" />
        <path id="spr-rise" class="ln amber heavy" d="M150 1200 C 400 1150 600 900 930 560" />
        <path id="spr-flat" class="ln cyan thick" d="M150 1200 C 400 1190 650 1180 930 1170" />
        <path id="spr-sag" class="ln dim thick" d="M150 1200 C 400 1240 650 1300 930 1360" />
        <circle class="fl" cx="150" cy="1200" r="18" />
      </svg>
      <div id="spr-stage"></div>
    </div>
    <div id="spr-hud" style="position:absolute;left:0;top:0;width:1080px;height:1920px"></div>
  </div>
  <script>
    (function () {
      const S = 'spread', b = (w, n) => KIT.cue('l07', w, n), D = KIT.sceneDur(S);
      KIT.bind('#spr-cam');
      const tl = gsap.timeline({ paused: true });

      // receipt 2 (page 6): "does not ensure it" is the point; the phrase is highlighted while the voice lands it
      const tR = Math.max(0.1, b('The') - 0.6), endR = b('it') + 0.25;
      tl.set('#spr-chart', { opacity: 0 }, 0);
      const R = KIT.read(tl, { cam: '#spr-cam', parent: '#spr-stage', hud: '#spr-hud', tagY: 260, id: 'interface', t: tR, label: KIT.data('l07').receipt,
        x: 40, y: 860, width: 1000, zoom: 3.4, fx: 90, fy: 860, follow: 0,
        marks: [[b('common'), b('interface') + 0.15], [b('therefore'), b('it') + 0.15]] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      tl.to([R.el, '#spr-stage-interface-tag'], { opacity: 0, duration: 0.3 }, endR);

      // then the chart: one shared start, three paths. Cut in on the paper's end, the rising path gets the camera
      tl.to('#spr-chart', { opacity: 1, duration: 0.2 }, endR);
      KIT.draw(tl, '#spr-flat', endR, 0.8, { ease: 'power2.inOut' });
      KIT.draw(tl, '#spr-sag', endR + 0.1, 0.8, { ease: 'power2.inOut' });
      KIT.draw(tl, '#spr-rise', endR + 0.05, 1.0, { ease: 'power2.inOut' });
      tl.fromTo('#spr-cam', { scale: 1 }, { scale: 1.06, duration: D - endR, ease: 'sine.inOut' }, endR);

      window.__timelines["spread"] = tl;
    })();
  </script>
</template>
