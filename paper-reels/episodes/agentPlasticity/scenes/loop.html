  <script>
    (function () {

      }
      function hilite(B, id, col, row, color) {

      }
      const SHAPES = {
        p: ['<circle cx="50" cy="32" r="14"/>', '<path d="M34 80 Q34 56 50 50 Q66 56 66 80 Z"/>', '<rect x="28" y="80" width="44" height="10" rx="3"/>'],
        r: ['<path d="M30 20 H40 V30 H46 V20 H54 V30 H60 V20 H70 V44 L64 52 V72 L72 82 V90 H28 V82 L36 72 V52 L30 44 Z"/>'],
        b: ['<path d="M50 14 C68 28 68 44 50 54 C32 44 32 28 50 14 Z"/>', '<path d="M38 80 Q38 62 50 56 Q62 62 62 80 Z"/>', '<rect x="28" y="80" width="44" height="10" rx="3"/>'],
        q: ['<path d="M28 38 L32 18 L42 32 L50 14 L58 32 L68 18 L72 38 Q66 50 66 60 L72 80 V90 H28 V80 L34 60 Q34 50 28 38 Z"/>'],
        k: ['<path d="M34 46 Q50 32 66 46 Q60 58 66 70 L72 80 V90 H28 V80 L34 70 Q40 58 34 46 Z"/>', '<path d="M50 8 V30 M40 18 H60" fill="none"/>'],
      };
      function piece(B, id, type, side, col, row) {
        const g = E('g', { id }), fill = side === 's' ? SOL : side === 'd' ? '#0a2340' : WHITE, stroke = side === 'd' ? WHITE : INK;
        const inner = E('g', { transform: `scale(${B.q / 100})`, fill, stroke, 'stroke-width': 5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);

      }

      const rows = [290, 670, 1050];

      // ---------- l03: three games, each with its own row of round dots ----------

      const cw = [piece(chess, 'loop-w1', 'k', 'w', 4, 7), piece(chess, 'loop-w2', 'r', 'w', 7, 7), piece(chess, 'loop-w3', 'p', 'w', 4, 6), piece(chess, 'loop-w4', 'b', 'w', 2, 7), piece(chess, 'loop-w5', 'p', 'w', 3, 6)];

      // Go: 5 x 5 points, stones appear one by one
      const go = E('g', { id: 'loop-bd1' }); E('rect', { x: 70, y: rows[1], width: 300, height: 300, fill: 'rgba(7,29,53,0.92)', stroke: WHITE, 'stroke-width': 4 }, go);
      for (let k = 0; k < 5; k++) { const o = 45 + k * 52.5; E('path', { d: `M${70 + 45} ${rows[1] + o} H${70 + 255} M${70 + o} ${rows[1] + 45} V${rows[1] + 255}`, fill: 'none', stroke: '#6aa9d0', 'stroke-width': 3 }, go); }

      const stones = stonesAt.map(([a, b], k) => E('circle', { id: `loop-st${k}`, cx: 70 + 45 + a * 52.5, cy: rows[1] + 45 + b * 52.5, r: 19, fill: k % 2 ? '#0a2340' : WHITE, stroke: k % 2 ? WHITE : INK, 'stroke-width': 3, opacity: 0 }, go));
      // Hex: 6 x 6 cells in a rhombus
      const hx = E('g', { id: 'loop-bd2' }); E('rect', { x: 70, y: rows[2], width: 300, height: 300, fill: 'rgba(7,29,53,0.92)', stroke: WHITE, 'stroke-width': 4 }, hx);

        const cx = 70 + 20 + ww * (j + i / 2), cy = rows[2] + 75 + 1.5 * rr * i, pts = [];
        for (let a = 0; a < 6; a++) { const th = (-90 + 60 * a) * Math.PI / 180; pts.push(`${(cx + rr * Math.cos(th)).toFixed(1)},${(cy + rr * Math.sin(th)).toFixed(1)}`); }

      }
      const hexFill = [14, 15, 21, 20, 27, 26, 8, 33];   // cells that take a colour as the dots fill
      // dots: each row fills on its own clock
      const dots = rows.map((y0, k) => Array.from({ length: 8 }, (_, i) => E('circle', { id: `loop-dot${k}-${i}`, cx: 440 + 68 * i, cy: y0 + 220, r: 15, fill: '#a8dcf2', 'fill-opacity': 0, stroke: '#a8dcf2', 'stroke-width': 3 })));
      const rowT = [c3('chess'), c3('Go'), c3('Hex')], step = [0.27, 0.31, 0.22], t1 = [c3('chess') + 0.25, c3('Go') + 0.25, c3('Hex') + 0.25];

      [0, 1, 2].forEach((k) => { const g = ['#loop-bd0', '#loop-bd1', '#loop-bd2'][k]; tl.fromTo(g, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 0.1 + 0.12 * k); });
      [0, 1, 2].forEach((k) => { KIT.pop(tl, `#loop-gt${k}`, rowT[k], { from: 0.4 }); KIT.rise(tl, `#loop-rl${k}`, rowT[k] + 0.15, { y: 14 }); });
      // dots fill row by row; each fill is one move on that board
      const chessMoves = [[cw[2], 4, 4], [cb[2], 4, 3], [cw[3], 5, 4], [cb[1], 7, 4], [cw[4], 3, 5], [cb[4], 3, 2], [cw[1], 4, 6], [cb[3], 1, 0]];
      dots[0].forEach((d, i) => {
        const t = t1[0] + i * step[0];
        tl.fromTo(d, { fillOpacity: 0, scale: 0.6, svgOrigin: `${440 + 68 * i} ${rows[0] + 220}` }, { fillOpacity: 1, scale: 1, svgOrigin: `${440 + 68 * i} ${rows[0] + 220}`, duration: 0.22, ease: 'back.out(3)' }, t);
        const [P, col, row] = chessMoves[i]; slide(P, col, row, t, 0.25);
      });
      dots[1].forEach((d, i) => {
        const t = t1[1] + i * step[1];
        tl.fromTo(d, { fillOpacity: 0, scale: 0.6, svgOrigin: `${440 + 68 * i} ${rows[1] + 220}` }, { fillOpacity: 1, scale: 1, svgOrigin: `${440 + 68 * i} ${rows[1] + 220}`, duration: 0.22, ease: 'back.out(3)' }, t);
        tl.fromTo(stones[i], { opacity: 0, scale: 0.3, svgOrigin: `${70 + 45 + stonesAt[i][0] * 52.5} ${rows[1] + 45 + stonesAt[i][1] * 52.5}` }, { opacity: 1, scale: 1, svgOrigin: `${70 + 45 + stonesAt[i][0] * 52.5} ${rows[1] + 45 + stonesAt[i][1] * 52.5}`, duration: 0.2, ease: 'back.out(3)' }, t);
      });
      dots[2].forEach((d, i) => {
        const t = t1[2] + i * step[2];
        tl.fromTo(d, { fillOpacity: 0, scale: 0.6, svgOrigin: `${440 + 68 * i} ${rows[2] + 220}` }, { fillOpacity: 1, scale: 1, svgOrigin: `${440 + 68 * i} ${rows[2] + 220}`, duration: 0.22, ease: 'back.out(3)' }, t);
        tl.to(hexCells[hexFill[i]], { fill: i % 2 ? 'rgba(242,248,255,0.85)' : 'rgba(168,220,242,0.85)', duration: 0.2 }, t);
      });
      KIT.pop(tl, '#loop-note', c3('after'), { from: 0.5 });
      pulse(c3('chess')); pulse(c3('Go')); pulse(c3('Hex')); pulse(c3('round', 1));

      // ---------- l04: in chess, it reviews its games and writes a program and notes ----------
      const t4 = c4('In');
      tl.to(['#loop-bd1', '#loop-bd2', '#loop-gt1', '#loop-gt2', '#loop-rl1', '#loop-rl2', '#loop-note', ...dots[1], ...dots[2], ...stones, ...hexCells.map((h) => h)], { opacity: 0, duration: 0.3 }, t4 - 0.1);
      // a stack of the round's games (HTML cards with a checker face) and a magnifier that reviews them
      const stack = document.getElementById('loop-stack'), sc = [];
      for (let k = 0; k < 4; k++) {

        stack.appendChild(d); sc.push(d);

      tl.fromTo(mag, { opacity: 0 }, { opacity: 1, duration: 0.15 }, c4('reviews'));

      tl.to(sc, { borderColor: '#ffb454', duration: 0.2, stagger: 0.12 }, c4('games'));
      tl.to(mag, { opacity: 0, duration: 0.25 }, c4('each'));
      pulse(c4('reviews'));
      // the dots of the chess row flicker once on "each round"
      tl.to(dots[0], { opacity: 0.35, duration: 0.14, yoyo: true, repeat: 1, stagger: 0.04 }, c4('round'));
      // the two cards land beside the stack: the program first, then the note with its whole heading
      KIT.pop(tl, '#loop-prog', c4('writes'), { from: 0.5, origin: '0 0' });
      const lines = [[24, 82, 330, 'var(--cyan)'], [24, 110, 250, 'var(--faint)'], [24, 138, 380, 'var(--faint)'], [24, 166, 190, 'var(--cyan)'], [24, 194, 300, 'var(--faint)'], [24, 222, 220, 'var(--faint)'], [24, 250, 340, 'var(--faint)']];
      const prog = document.getElementById('loop-prog'), codeEls = lines.map(([x, y, w, col]) => { const d = document.createElement('div'); d.className = 'loop-code'; d.style.cssText = `left:${x}px;top:${y}px;width:${w}px;background:${col}`; prog.appendChild(d); return d; });
      tl.fromTo(codeEls, { scaleX: 0 }, { scaleX: 1, duration: 0.25, stagger: 0.07, ease: 'power2.out' }, c4('program'));
      KIT.pop(tl, '#loop-note2', c4('and', 1), { from: 0.5, origin: '0 0' });

      KIT.slam(tl, '#loop-h1', c4('notes') - 0.1, { from: 1.8, shake: false, origin: '0 50%' });
      KIT.slam(tl, '#loop-h2', c4('notes') + 0.25, { from: 1.6, shake: false, origin: '0 50%' });

      const botL = KIT.robot('#loop-svg', { id: 'loopbL', x: 190, y: 392, s: 0.72, eye: '#a8dcf2' }), botR = KIT.robot('#loop-svg', { id: 'loopbR', x: 710, y: 392, s: 0.72, eye: '#a8dcf2' });
      const lock = E('g', { id: 'loop-lock', opacity: 0 }); E('path', { d: 'M292 396 V372 a27 27 0 0 1 54 0 V396', fill: 'none', stroke: '#f2f8ff', 'stroke-width': 9, 'stroke-linecap': 'round' }, lock); E('rect', { x: 278, y: 394, width: 82, height: 62, rx: 10, fill: '#ffb454' }, lock); E('circle', { cx: 319, cy: 421, r: 8, fill: '#071d35' }, lock); E('rect', { x: 316, y: 425, width: 6, height: 18, rx: 3, fill: '#071d35' }, lock);

      pulse(c5('never')); pulse(c5('but'));

      tl.fromTo('#loop-jump', { clipPath: 'inset(0 100% 0 0)', opacity: 1 }, { clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'power3.out' }, c5('each'));
