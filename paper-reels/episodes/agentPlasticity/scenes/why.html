      for (let r = 0; r < 5; r++) for (let k = 0; k < 8; k++) { const i = r * 8 + k; sq10.push(mk('why-sq ' + (i === 21 ? 'used' : 'hollow'), 128 + k * 104, 540 + r * 104, 96, g10, `why-s10-${i}`)); }

      KIT.fade(tl, '#why-jd', a('notes'), { to: 0.85 });
      KIT.fade(tl, '#why-s10', a('notes'), { to: 0.8 });
      pulse(a('Luna')); pulse(a('never')); pulse(a('notes'));
      // "Models that used them less gained less": the sketch of Fig. 1 again, now labelled by how much each model used its programs and notes

      const chart = E('g', { id: 'why-chart' }), X = (cc) => 170 + 660 * (Math.log10(cc) + 1) / 4.3, Y = (s) => 1000 - 5.2 * s;
      const sig = (z) => 1 / (1 + Math.exp(-z));
      const fable = (cc) => 43 + 40 * sig((Math.log10(cc) - 2.3) / 0.3), solf = (cc) => 18 + 38 * sig((Math.log10(cc) - 1.75) / 0.2), luna = (cc) => 7 - 3 * (Math.log10(cc) + 0.854) / 2.03;
      const path = (f, c0, c1, n = 60) => { let d = ''; for (let k = 0; k <= n; k++) { const cc = c0 * Math.pow(c1 / c0, k / n); d += `${k ? 'L' : 'M'}${X(cc).toFixed(1)} ${Y(f(cc)).toFixed(1)} `; } return d; };
      E('path', { id: 'why-ay', d: 'M170 1000 L170 470 M170 470 L154 498 M170 470 L186 498', class: 'ln thick' }, chart);
      E('path', { id: 'why-ax', d: 'M170 1000 L860 1000 M860 1000 L832 984 M860 1000 L832 1016', class: 'ln thick' }, chart);
      E('path', { id: 'why-lf', d: path(fable, 0.14, 1600), class: 'ln amber heavy', opacity: 0 }, chart);
      E('path', { id: 'why-ls', d: path(solf, 0.14, 500), class: 'ln mint heavy', opacity: 0 }, chart);
