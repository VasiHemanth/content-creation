<template id="idea-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #idea-cam, #idea-beat, #idea-world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #idea-cam { transform-origin: 540px 900px; } #idea-beat { transform-origin: 540px 900px; }
    #idea-name { left: 80px; top: 180px; font-size: 64px; padding: 10px 28px; }
    .idea-sock { position: absolute; top: 320px; width: 230px; height: 92px; border: 5px dashed var(--dim); border-radius: 14px; box-sizing: border-box; }
    .idea-word { position: absolute; top: 334px; width: 230px; text-align: center; font: 400 58px/1 "Marker", sans-serif; color: var(--amber); }
    #idea-discard { position: absolute; left: 60px; top: 1300px; width: 160px; height: 16px; border-top: 5px solid var(--faint); }
    .ac-chip { position: absolute; padding: 8px 16px 6px; font: 700 28px/1 "Mono", monospace; color: var(--white); background: #0f3a60; border: 4px solid var(--cyan);
      border-radius: 12px; white-space: nowrap; box-shadow: 5px 5px 0 var(--shadow); transform-origin: 50% 50%; }
    .ac-chip.old { color: var(--dim); border-color: var(--faint); background: #0b2a4a; }
    .ac-press { position: absolute; height: 190px; }
    .ac-rod { position: absolute; top: 0; width: 10px; height: 130px; background: var(--dim); }
    .ac-plate { position: absolute; left: 0; top: 120px; height: 62px; background: var(--deep); border: 5px solid var(--amber); box-shadow: 8px 8px 0 var(--shadow);
      font: 700 32px/52px "Mono", monospace; color: var(--amber); text-align: center; box-sizing: border-box; }
    .ac-gauge { position: absolute; width: 46px; border: 5px solid var(--white); border-radius: 10px; box-sizing: border-box; background: var(--panel); overflow: visible; }
    .ac-gfill { position: absolute; left: 4px; right: 4px; bottom: 4px; top: 4px; background: var(--cyan); transform-origin: 50% 100%; border-radius: 4px; }
    .ac-gtick { position: absolute; left: -22px; width: 80px; height: 6px; background: var(--coral); }
    .ac-card { position: absolute; background: var(--paper); color: var(--ink); border: 4px solid var(--white); box-shadow: 10px 10px 0 var(--shadow); padding: 10px 0 8px; }
    .ac-chead { font: 400 40px/1.1 "Marker", sans-serif; color: var(--ink); padding: 0 18px 6px; border-bottom: 3px solid #c9bfa8; }
    .ac-crow { font: 700 28px/1 "Mono", monospace; color: var(--ink); padding: 12px 18px 4px; white-space: nowrap; transform-origin: 0 0; }
    .ac-peg { position: absolute; width: 24px; height: 120px; }
    .ac-stake { position: absolute; left: 8px; top: 0; width: 8px; height: 120px; background: var(--amber); border-radius: 3px; }
    .ac-hand { position: absolute; width: 220px; height: 330px; }
    .ac-cuff { position: absolute; left: 34px; top: 34px; width: 150px; text-align: center; font: 700 30px/1 "Mono", monospace; color: var(--cyan); }
  </style>
  <div id="root" data-composition-id="idea" data-width="1080" data-height="1920">
    <div id="idea-cam"><div id="idea-beat"><div id="idea-world">
      <div id="idea-name" class="tag" data-bind="l04.name"></div>
      <div id="idea-s0" class="idea-sock" style="left:80px"></div><div id="idea-s1" class="idea-sock" style="left:340px"></div><div id="idea-s2" class="idea-sock" style="left:600px"></div>
      <div id="idea-w0" class="idea-word" style="left:80px" data-bind="l04.when"></div>
      <div id="idea-w1" class="idea-word" style="left:340px" data-bind="l04.what"></div>
      <div id="idea-w2" class="idea-word" style="left:600px" data-bind="l04.how"></div>
      <svg class="ink sketch" id="idea-svg" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920"></svg>
      <div id="idea-discard"></div>
    </div></div></div>
  </div>
  <script>
    (function () {
      // ---- shared drawing kit for this episode (same code in every scene, so the hook and the close match) ----
      const AC = (() => {
        const W = '#f2f8ff', PANEL = '#0a2340', AMB = '#ffb454', COR = '#ff6b6b', CY = '#a8dcf2', DIM = '#6aa9d0';
        const $ = (s) => (typeof s === 'string' ? document.querySelector(s) : s);
        const svg = (tag, attrs, parent) => KIT.svgEl(tag, attrs, parent);
        const div = (cls, id, css, parent, txt) => { const e = document.createElement('div'); if (cls) e.className = cls; e.id = id; if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; $(parent).appendChild(e); return e; };
        const ln = (d, parent, o = {}) => svg('path', { d, fill: 'none', stroke: o.c || W, 'stroke-width': o.w || 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', id: o.id, 'stroke-dasharray': o.dash }, parent);

        /** A hiker facing right. (x, y) = ground point between the feet; s = scale (1 = about 230 px tall).
         *  Animate `${id}` (x in local units = px / s), `${id}-body` (turns), `${id}-legF/-legB`, `${id}-pack`, `${id}-arm`. */
        function hiker(host, { id, x, y, s = 1, mag = false, pack = 1 }) {
          const pos = svg('g', { transform: `translate(${x} ${y}) scale(${s})` }, host);
          const g = svg('g', { id }, pos), body = svg('g', { id: `${id}-body` }, g);
          const legB = svg('g', { id: `${id}-legB` }, body); ln('M2 -86 L-8 -42 L-14 0 L-1 0', legB, { c: DIM, w: 4.2 });
          const pk = svg('g', { id: `${id}-pack` }, body);
          svg('rect', { x: -66, y: -184, width: 56, height: 100, rx: 15, fill: PANEL, stroke: W, 'stroke-width': 3.6 }, pk);
          ln('M-66 -160 L-10 -160', pk, { w: 2.6 }); ln('M-50 -132 L-26 -132', pk, { c: DIM, w: 2.6 });
          ln('M-60 -84 L-62 -76 M-16 -84 L-14 -76', pk, { w: 2.6 });
          ln('M-10 -172 L4 -148', body, { c: AMB, w: 3 });
          ln('M2 -150 L-8 -116 L-4 -94', body, { c: DIM, w: 4 });
          ln('M2 -170 L2 -86', body, { w: 5 });
          const legF = svg('g', { id: `${id}-legF` }, body); ln('M2 -86 L14 -42 L12 0 L26 0', legF, { w: 4.4 });
          svg('circle', { cx: 6, cy: -194, r: 19, fill: PANEL, stroke: W, 'stroke-width': 3.6 }, body);
          ln('M-14 -200 Q6 -228 26 -201 L36 -199', body, { w: 3.4 });
          svg('circle', { cx: 15, cy: -196, r: 2.6, fill: W }, body);
          const arm = svg('g', { id: `${id}-arm` }, body);
          if (mag) { ln('M2 -150 L30 -122 L52 -110', arm, { w: 4.2 }); svg('circle', { cx: 64, cy: -98, r: 14, fill: 'rgba(168,220,242,.18)', stroke: AMB, 'stroke-width': 3.6 }, arm); ln('M54 -108 L50 -112', arm, { c: AMB, w: 4 }); }
          else ln('M2 -150 L18 -116 L26 -94', arm, { w: 4.2 });
          gsap.set(`#${id}-pack`, { scale: pack, svgOrigin: '-38 -84' });
          return { pos, g, body, x, y, s, packTop: [x - 38 * s, y - 184 * s * pack], packBox: [x - 66 * s, y - 184 * s * pack, 56 * s, 100 * s * pack] };
        }
        /** Walk cycle: legs swing on keyframes (tl.to only, so several walks can follow each other). */
        function walk(tl, id, t0, dur, step = 0.26) {
          const n = Math.max(2, Math.round(dur / step)), kf = (sgn) => { const k = []; for (let i = 0; i < n; i++) k.push({ rotation: (i % 2 ? -1 : 1) * 20 * sgn, duration: dur / n, ease: 'sine.inOut' }); k.push({ rotation: 0, duration: 0.12 }); return k; };
          tl.to(`#${id}-legF`, { keyframes: kf(1), svgOrigin: '2 -86' }, t0);
          tl.to(`#${id}-legB`, { keyframes: kf(-1), svgOrigin: '2 -86' }, t0);
        }
        /** A trail flag on the ground line; the label sits above the cloth (right-aligned when `right`). */
        function flag(host, parent, { id, x, y, h = 210, label, right = false, color = AMB, below = false }) {
          const g = svg('g', { id }, host);
          ln(`M${x} ${y} L${x} ${y - h}`, g, { w: 5 });
          const cloth = svg('path', { d: `M${x + 2} ${y - h} L${x + 74} ${y - h + 22} L${x + 2} ${y - h + 46} Z`, fill: color, stroke: color, 'stroke-width': 2, id: `${id}-cloth` }, g);
          const lab = label != null ? div('lbl white', `${id}-lab`, `top:${below ? y + 30 : y - h - 48}px;${right ? `right:${1080 - x - 6}px` : `left:${x - 6}px`};font-size:28px`, parent, label) : null;
          return { g, cloth, lab };
        }
        /** A chip of carried context (search, tool output, ...). */
        const chip = (parent, id, txt, x, y) => div('ac-chip', id, `left:${x}px;top:${y}px`, parent, txt);
        /** The press: rods and a plate labelled compact(). Slam it with tl.to(`#${id}`, { y }). */
        function press(parent, { id, x, y, w = 200, label }) {
          const p = div('ac-press', id, `left:${x}px;top:${y - 120}px;width:${w}px`, parent);
          div('ac-rod', `${id}-r1`, `left:${w * 0.25 - 5}px`, p); div('ac-rod', `${id}-r2`, `left:${w * 0.75 - 5}px`, p);
          div('ac-plate', `${id}-plate`, `width:${w}px`, p, label);
          return p;
        }
        /** The context gauge strap: outline, fill (scaleY), red limit tick and labels. */
        function gauge(parent, { id, x, y, h = 300, lim = 0.9, limitTxt, ctxTxt, fill = 0.5 }) {
          const g = div('ac-gauge', id, `left:${x}px;top:${y}px;height:${h}px`, parent);
          const f = div('ac-gfill', `${id}-fill`, '', g);
          const tk = div('ac-gtick', `${id}-tick`, `top:${(1 - lim) * h - 3}px`, g);
          div('lbl', `${id}-lim`, `left:${x - 96}px;top:${y + (1 - lim) * h - 20}px;font-size:28px;color:#ff9d9d`, parent, limitTxt);
          div('lbl', `${id}-ctx`, `left:${x - 40}px;top:${y + h + 12}px;font-size:28px`, parent, ctxTxt);
          gsap.set(f, { scaleY: fill });
          return { g, f, tk };
        }
        /** The summary card: a header and three rows (rows hidden until shown). */
        function card(parent, { id, x, y, w = 330, head, rows }) {
          const c = div('ac-card', id, `left:${x}px;top:${y}px;width:${w}px`, parent);
          div('ac-chead', `${id}-h`, '', c, head);
          const rs = rows.map((r, i) => div('ac-crow', `${id}-r${i}`, '', c, r));
          return { c, rs };
        }
        /** A compact() peg: stake plus tag. */
        function peg(parent, { id, x, y, label }) {
          const p = div('ac-peg', id, `left:${x - 12}px;top:${y - 120}px`, parent);
          div('ac-stake', `${id}-s`, '', p); div('tag', `${id}-t`, 'left:-8px;top:-52px;font-size:26px;padding:4px 12px', p, label);
          return p;
        }
        /** The judge's hand, pointing down, with a labelled cuff. */
        function hand(parent, { id, x, y, label }) {
          const h = div('ac-hand', id, `left:${x}px;top:${y}px`, parent);
          const sv = KIT.svgEl('svg', { viewBox: '0 0 220 330', width: 220, height: 330, style: 'position:absolute;left:0;top:0;overflow:visible' }, h);
          svg('rect', { x: 34, y: 0, width: 150, height: 120, rx: 10, fill: PANEL, stroke: CY, 'stroke-width': 6 }, sv);
          svg('path', { d: 'M44 120 L44 210 C44 236 60 250 84 250 L150 250 C170 250 182 236 182 214 L182 120 Z', fill: PANEL, stroke: W, 'stroke-width': 6, 'stroke-linejoin': 'round' }, sv);
          [[52, 300], [86, 322], [120, 318], [152, 296]].forEach(([fx, fy]) => svg('path', { d: `M${fx} 236 L${fx} ${fy}`, stroke: W, 'stroke-width': 24, 'stroke-linecap': 'round' }, sv));
          [[52, 300], [86, 322], [120, 318], [152, 296]].forEach(([fx, fy]) => svg('path', { d: `M${fx} 238 L${fx} ${fy - 2}`, stroke: PANEL, 'stroke-width': 12, 'stroke-linecap': 'round' }, sv));
          svg('path', { d: 'M182 170 C214 180 220 214 206 236', fill: 'none', stroke: W, 'stroke-width': 18, 'stroke-linecap': 'round' }, sv);
          div('ac-cuff', `${id}-cuff`, '', h, label);
          return h;
        }
        /** A pair of footprints on the ground. */
        const prints = (host, id, x, y, c = DIM) => { const g = svg('g', { id }, host); svg('ellipse', { cx: x, cy: y - 7, rx: 15, ry: 5.5, fill: c }, g); svg('ellipse', { cx: x + 22, cy: y + 5, rx: 15, ry: 5.5, fill: c }, g); return g; };
        return { $, svg, div, ln, hiker, walk, flag, chip, press, gauge, card, peg, hand, prints, C: { W, PANEL, AMB, COR, CY, DIM } };
      })();
      const S = 'idea', a = (w, n) => KIT.cue('l04', w, n), D = KIT.sceneDur(S);
      KIT.bind('#idea-world');
      const d1 = KIT.data('l01'), d2 = KIT.data('l02'), d3 = KIT.data('l03'), d4 = KIT.data('l04'), tl = gsap.timeline({ paused: true });
      const SV = '#idea-svg', GY = 1260;
      AC.ln(`M40 ${GY} L1040 ${GY}`, SV, { w: 6 });
      AC.flag(SV, '#idea-world', { id: 'idea-f1', x: 380, y: GY, h: 190, label: d3.f1, below: true });
      AC.flag(SV, '#idea-world', { id: 'idea-f2', x: 660, y: GY, h: 190, label: d3.f2, below: true });
      AC.flag(SV, '#idea-world', { id: 'idea-f3', x: 850, y: GY, h: 270, label: d3.f3, right: true });
      const H = AC.hiker(SV, { id: 'idea-hk', x: -140, y: GY, s: 1.5, mag: false, pack: 0.9 });
      const PG = AC.peg('#idea-world', { id: 'idea-peg', x: 344, y: GY, label: d4.peg });
      const C = AC.card('#idea-world', { id: 'idea-card', x: 640, y: 470, w: 340, head: d2.card, rows: [d2.r1, d2.r2, d2.r3] });
      const old = [d1.search, d1.log].map((t, i) => AC.chip('#idea-world', `idea-old${i}`, t, 120 + i * 150, 950 - i * 60));
      const keep = [d1.tool, d1.code].map((t, i) => AC.chip('#idea-world', `idea-keep${i}`, t, 220 + i * 20, 840 - i * 50));
      old.forEach((c) => { c.classList.add('old'); });

      // a clean trail; the camera drifts in
      tl.fromTo('#idea-cam', { scale: 1.05 }, { scale: 1, duration: D, ease: 'sine.out' }, 0);
      // "Auto Compact": the name tag pops, three empty sockets slide in under it
      KIT.pop(tl, '#idea-name', a('Auto') - 0.1, { from: 0.4 });
      tl.fromTo(['#idea-s0', '#idea-s1', '#idea-s2'], { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.08, ease: 'power3.out' }, a('Compact'));
      // "trains the agent": the hiker steps in with a light pack and walks to the first flag
      const tW = a('trains') - 0.1, tArr = a('when') - 0.05;
      tl.to('#idea-hk', { x: (270 + 140) / 1.5, duration: tArr - tW, ease: 'power1.out' }, tW);
      AC.walk(tl, 'idea-hk', tW, tArr - tW);
      // "when to compact": the hiker plants a compact() peg at the flag; socket 1 fills
      tl.fromTo(PG, { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: 'power4.in' }, a('when') - 0.05);
      KIT.shake(tl, '#idea-beat', a('when') + 0.15, { amp: 8, dur: 0.22 });
      KIT.slam(tl, '#idea-w0', a('compact', 1) - 0.15, { from: 2.2, shake: false });
      tl.to('#idea-s0', { borderColor: '#ffb454', borderStyle: 'solid', duration: 0.1 }, a('compact', 1));
      // "what to keep": grey chips drop to the discard pile and fade, the useful ones fold into the card
      [...old, ...keep].forEach((c) => tl.fromTo(c, { opacity: 0, scale: 0.4, y: 80 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: 'back.out(2)' }, a('what') - 0.2));
      old.forEach((c, i) => { tl.to(c, { x: -170 - i * 30, y: 340 + i * 40, rotation: -30, duration: 0.35, ease: 'power2.in' }, a('what') + 0.05 + i * 0.06); tl.to(c, { opacity: 0, duration: 0.3 }, a('keep') + 0.3); });
      tl.fromTo(C.c, { opacity: 0, scale: 0.3, x: -320, y: 380 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.35, ease: 'back.out(1.6)' }, a('keep') - 0.15);
      keep.forEach((c, i) => tl.to(c, { x: 420, y: -330 + i * 40, scale: 0.3, opacity: 0, duration: 0.35, ease: 'power2.in' }, a('keep') - 0.1 + i * 0.07));
      KIT.slam(tl, '#idea-w1', a('keep') - 0.1, { from: 2.2, shake: false });
      tl.to('#idea-s1', { borderColor: '#ffb454', borderStyle: 'solid', duration: 0.1 }, a('keep') + 0.1);
      // "how to continue": the card's next-step row glows, a dotted arrow draws to the edit-file flag
      tl.to(C.rs[2], { backgroundColor: '#ffb454', duration: 0.2 }, a('how') - 0.05);
      const AR = AC.ln('M800 650 C 820 800, 720 900, 680 1050', SV, { c: AC.C.AMB, w: 6, dash: '14 12', id: 'idea-arrow' });
      AR.classList.add('dash');
      const AH = AC.ln('M658 1032 L680 1058 L700 1030', SV, { c: AC.C.AMB, w: 6, id: 'idea-ahead' });
      KIT.draw(tl, AR, a('how'), 0.35);
      KIT.fade(tl, AH, a('how') + 0.32, { dur: 0.1 });
      KIT.slam(tl, '#idea-w2', a('how') + 0.1, { from: 2.2, shake: false });
      tl.to('#idea-s2', { borderColor: '#ffb454', borderStyle: 'solid', duration: 0.1 }, a('continue'));
      // "continue": the hiker follows the arrow; the camera tracks right with it
      tl.to('#idea-hk', { x: (270 + 140) / 1.5 + 180, duration: D - a('continue'), ease: 'power1.in' }, a('continue'));
      AC.walk(tl, 'idea-hk', a('continue'), D - a('continue'));
      tl.to('#idea-beat', { x: -50, duration: D - a('continue'), ease: 'power1.in' }, a('continue'));
      tl.to('#idea-f2-cloth', { keyframes: [{ skewY: 8, duration: 0.15 }, { skewY: -6, duration: 0.15 }, { skewY: 0, duration: 0.15 }], svgOrigin: '662 1070' }, a('continue') + 0.1);

      KIT.beats(tl, '#idea-beat', [a('Auto') + 0.1, a('trains'), a('agent'), a('decide')], { amp: 0.025, shift: 16, reset: a('when') - 0.1 });
      window.__timelines["idea"] = tl;
    })();
  </script>
</template>
