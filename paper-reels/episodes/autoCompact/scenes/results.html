<template id="results-template">

    #results-higher { left: 1500px; top: 852px; }
    #results-budget { left: 1460px; top: 1250px; font-size: 28px; }

    .ac-gfill { position: absolute; left: 4px; right: 4px; bottom: 4px; top: 4px; background: var(--cyan); transform-origin: 50% 100%; border-radius: 4px; }
    .ac-gtick { position: absolute; left: -22px; width: 80px; height: 6px; background: var(--coral); }

    .ac-crow { font: 700 28px/1 "Mono", monospace; color: var(--ink); padding: 12px 18px 4px; white-space: nowrap; transform-origin: 0 0; }
    .ac-peg { position: absolute; width: 24px; height: 120px; }
    .ac-stake { position: absolute; left: 8px; top: 0; width: 8px; height: 120px; background: var(--amber); border-radius: 3px; }

  </style>
  <div id="root" data-composition-id="results" data-width="1080" data-height="1920">
    <div id="results-cam">
      <div id="results-beat"><div id="results-world">
        <div id="results-title" class="hd" data-bind="l09.title"></div>
        <div id="results-sub" class="lbl" data-bind="l09.sub"></div>
        <svg class="ink sketch" id="results-svg" style="left:0;top:0;width:2160px;height:1920px" viewBox="0 0 2160 1920"></svg>
        <div id="results-bars"></div>
        <div id="results-same" class="lbl" data-bind="l09.same"></div>
        <div id="results-forced" class="tag coral" data-bind="l10.forced"></div>
        <div id="results-limlab" class="lbl coral" data-bind="l10.limit"></div>
        <div id="results-lb" class="lbl" data-bind="l10.lb"></div>
        <div id="results-la" class="lbl" data-bind="l10.la"></div>
        <div id="results-blab" class="lbl" data-bind="l05.badge"></div>
        <div id="results-alab" class="lbl" data-bind="l09.b2"></div>
        <div id="results-higher" class="tag" data-bind="l10.higher"></div>
        <div id="results-sm" class="lbl" data-bind="l10.smallest"></div>
        <div id="results-lg" class="lbl" data-bind="l10.largest"></div>

      </div></div>
      <div id="results-scrim"></div>
      <div id="results-stage"></div>
    </div>
    <div id="results-hud"></div>
  </div>
  <script>
    (function () {
      // ---- shared drawing kit for this episode (same code in every scene, so the hook and the close match) ----
      const AC = (() => {
        const W = '#f2f8ff', PANEL = '#0a2340', AMB = '#ffb454', COR = '#ff6b6b', CY = '#a8dcf2', DIM = '#6aa9d0';
        const $ = (s) => (typeof s === 'string' ? document.querySelector(s) : s);
        const svg = (tag, attrs, parent) => KIT.svgEl(tag, attrs, parent);
        const div = (cls, id, css, parent, txt) => { const e = document.createElement('div'); if (cls) e.className = cls; e.id = id; if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; $(parent).appendChild(e); return e; };
        const ln = (d, parent, o = {}) => svg('path', { d, fill: 'none', stroke: o.c || W, 'stroke-width': o.w || 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', id: o.id, 'stroke-dasharray': o.dash }, parent);

        /** A hiker facing right. (x, y) = ground point between the feet; s = scale (1 = about 230 px tall).
         *  Animate `${id}` (x in local units = px / s), `${id}-body` (turns), `${id}-legF/-legB`, `${id}-pack`, `${id}-arm`. */
        function hiker(host, { id, x, y, s = 1, mag = false, pack = 1 }) {
          const pos = svg('g', { transform: `translate(${x} ${y}) scale(${s})` }, host);
          const g = svg('g', { id }, pos), body = svg('g', { id: `${id}-body` }, g);
          const legB = svg('g', { id: `${id}-legB` }, body); ln('M2 -86 L-8 -42 L-14 0 L-1 0', legB, { c: DIM, w: 4.2 });
          const pk = svg('g', { id: `${id}-pack` }, body);
          svg('rect', { x: -66, y: -184, width: 56, height: 100, rx: 15, fill: PANEL, stroke: W, 'stroke-width': 3.6 }, pk);
          ln('M-66 -160 L-10 -160', pk, { w: 2.6 }); ln('M-50 -132 L-26 -132', pk, { c: DIM, w: 2.6 });
          ln('M-60 -84 L-62 -76 M-16 -84 L-14 -76', pk, { w: 2.6 });
          ln('M-10 -172 L4 -148', body, { c: AMB, w: 3 });
          ln('M2 -150 L-8 -116 L-4 -94', body, { c: DIM, w: 4 });
          ln('M2 -170 L2 -86', body, { w: 5 });
          const legF = svg('g', { id: `${id}-legF` }, body); ln('M2 -86 L14 -42 L12 0 L26 0', legF, { w: 4.4 });
          svg('circle', { cx: 6, cy: -194, r: 19, fill: PANEL, stroke: W, 'stroke-width': 3.6 }, body);
          ln('M-14 -200 Q6 -228 26 -201 L36 -199', body, { w: 3.4 });
          svg('circle', { cx: 15, cy: -196, r: 2.6, fill: W }, body);
          const arm = svg('g', { id: `${id}-arm` }, body);
          if (mag) { ln('M2 -150 L30 -122 L52 -110', arm, { w: 4.2 }); svg('circle', { cx: 64, cy: -98, r: 14, fill: 'rgba(168,220,242,.18)', stroke: AMB, 'stroke-width': 3.6 }, arm); ln('M54 -108 L50 -112', arm, { c: AMB, w: 4 }); }
          else ln('M2 -150 L18 -116 L26 -94', arm, { w: 4.2 });
          gsap.set(`#${id}-pack`, { scale: pack, svgOrigin: '-38 -84' });
          return { pos, g, body, x, y, s, packTop: [x - 38 * s, y - 184 * s * pack], packBox: [x - 66 * s, y - 184 * s * pack, 56 * s, 100 * s * pack] };
        }
        /** Walk cycle: legs swing on keyframes (tl.to only, so several walks can follow each other). */
        function walk(tl, id, t0, dur, step = 0.26) {
          const n = Math.max(2, Math.round(dur / step)), kf = (sgn) => { const k = []; for (let i = 0; i < n; i++) k.push({ rotation: (i % 2 ? -1 : 1) * 20 * sgn, duration: dur / n, ease: 'sine.inOut' }); k.push({ rotation: 0, duration: 0.12 }); return k; };
          tl.to(`#${id}-legF`, { keyframes: kf(1), svgOrigin: '2 -86' }, t0);
          tl.to(`#${id}-legB`, { keyframes: kf(-1), svgOrigin: '2 -86' }, t0);
        }
        /** A trail flag on the ground line; the label sits above the cloth (right-aligned when `right`). */
        function flag(host, parent, { id, x, y, h = 210, label, right = false, color = AMB, below = false }) {
          const g = svg('g', { id }, host);
          ln(`M${x} ${y} L${x} ${y - h}`, g, { w: 5 });
          const cloth = svg('path', { d: `M${x + 2} ${y - h} L${x + 74} ${y - h + 22} L${x + 2} ${y - h + 46} Z`, fill: color, stroke: color, 'stroke-width': 2, id: `${id}-cloth` }, g);
          const lab = label != null ? div('lbl white', `${id}-lab`, `top:${below ? y + 30 : y - h - 48}px;${right ? `right:${1080 - x - 6}px` : `left:${x - 6}px`};font-size:28px`, parent, label) : null;
          return { g, cloth, lab };
        }
        /** A chip of carried context (search, tool output, ...). */
        const chip = (parent, id, txt, x, y) => div('ac-chip', id, `left:${x}px;top:${y}px`, parent, txt);
        /** The press: rods and a plate labelled compact(). Slam it with tl.to(`#${id}`, { y }). */
        function press(parent, { id, x, y, w = 200, label }) {
          const p = div('ac-press', id, `left:${x}px;top:${y - 120}px;width:${w}px`, parent);
          div('ac-rod', `${id}-r1`, `left:${w * 0.25 - 5}px`, p); div('ac-rod', `${id}-r2`, `left:${w * 0.75 - 5}px`, p);
          div('ac-plate', `${id}-plate`, `width:${w}px`, p, label);
          return p;
        }
        /** The context gauge strap: outline, fill (scaleY), red limit tick and labels. */
        function gauge(parent, { id, x, y, h = 300, lim = 0.9, limitTxt, ctxTxt, fill = 0.5 }) {
          const g = div('ac-gauge', id, `left:${x}px;top:${y}px;height:${h}px`, parent);
          const f = div('ac-gfill', `${id}-fill`, '', g);
          const tk = div('ac-gtick', `${id}-tick`, `top:${(1 - lim) * h - 3}px`, g);
          div('lbl', `${id}-lim`, `left:${x - 96}px;top:${y + (1 - lim) * h - 20}px;font-size:28px;color:#ff9d9d`, parent, limitTxt);
          div('lbl', `${id}-ctx`, `left:${x - 40}px;top:${y + h + 12}px;font-size:28px`, parent, ctxTxt);
          gsap.set(f, { scaleY: fill });
          return { g, f, tk };
        }
        /** The summary card: a header and three rows (rows hidden until shown). */
        function card(parent, { id, x, y, w = 330, head, rows }) {
          const c = div('ac-card', id, `left:${x}px;top:${y}px;width:${w}px`, parent);
          div('ac-chead', `${id}-h`, '', c, head);
          const rs = rows.map((r, i) => div('ac-crow', `${id}-r${i}`, '', c, r));
          return { c, rs };
        }
        /** A compact() peg: stake plus tag. */
        function peg(parent, { id, x, y, label }) {
          const p = div('ac-peg', id, `left:${x - 12}px;top:${y - 120}px`, parent);
          div('ac-stake', `${id}-s`, '', p); div('tag', `${id}-t`, 'left:-8px;top:-52px;font-size:26px;padding:4px 12px', p, label);
          return p;
        }
        /** The judge's hand, pointing down, with a labelled cuff. */
        function hand(parent, { id, x, y, label }) {
          const h = div('ac-hand', id, `left:${x}px;top:${y}px`, parent);
          const sv = KIT.svgEl('svg', { viewBox: '0 0 220 330', width: 220, height: 330, style: 'position:absolute;left:0;top:0;overflow:visible' }, h);
          svg('rect', { x: 34, y: 0, width: 150, height: 120, rx: 10, fill: PANEL, stroke: CY, 'stroke-width': 6 }, sv);
          svg('path', { d: 'M44 120 L44 210 C44 236 60 250 84 250 L150 250 C170 250 182 236 182 214 L182 120 Z', fill: PANEL, stroke: W, 'stroke-width': 6, 'stroke-linejoin': 'round' }, sv);
          [[52, 300], [86, 322], [120, 318], [152, 296]].forEach(([fx, fy]) => svg('path', { d: `M${fx} 236 L${fx} ${fy}`, stroke: W, 'stroke-width': 24, 'stroke-linecap': 'round' }, sv));
          [[52, 300], [86, 322], [120, 318], [152, 296]].forEach(([fx, fy]) => svg('path', { d: `M${fx} 238 L${fx} ${fy - 2}`, stroke: PANEL, 'stroke-width': 12, 'stroke-linecap': 'round' }, sv));
          svg('path', { d: 'M182 170 C214 180 220 214 206 236', fill: 'none', stroke: W, 'stroke-width': 18, 'stroke-linecap': 'round' }, sv);
          div('ac-cuff', `${id}-cuff`, '', h, label);
          return h;
        }
        /** A pair of footprints on the ground. */
        const prints = (host, id, x, y, c = DIM) => { const g = svg('g', { id }, host); svg('ellipse', { cx: x, cy: y - 7, rx: 15, ry: 5.5, fill: c }, g); svg('ellipse', { cx: x + 22, cy: y + 5, rx: 15, ry: 5.5, fill: c }, g); return g; };
        return { $, svg, div, ln, hiker, walk, flag, chip, press, gauge, card, peg, hand, prints, C: { W, PANEL, AMB, COR, CY, DIM } };
      })();
      const S = 'results', a = (w, n) => KIT.cue('l09', w, n), b = (w, n) => KIT.cue('l10', w, n), D = KIT.sceneDur(S);
      KIT.bind('#results-world');
      const d9 = KIT.data('l09'), d10 = KIT.data('l10'), d4 = KIT.data('l04'), tl = gsap.timeline({ paused: true });
      const SV = '#results-svg';

      // ---- panel 1: two bars on a scale from 0 (no break, no printed ticks; the top of the scale, 45, is not printed) ----
      const BASE = 1100, HH = 640, TOP = 45, hOf = (v) => HH * v / TOP, CX = [330, 690];
      const v = [parseFloat(d9.v1), parseFloat(d9.v2)], VAL = [d9.v1, d9.v2], LAB = [d9.b1, d9.b2], COL = ['#f2f8ff', '#a8dcf2'];
      const axis = AC.ln(`M120 ${BASE} L930 ${BASE}`, SV, { w: 6, id: 'results-axis' });
      const bars = [0, 1].map((i) => {
        const bar = AC.div('results-bar', `results-bar${i}`, `left:${CX[i] - 110}px;top:${BASE - hOf(v[i])}px;height:${hOf(v[i])}px;background:${COL[i]}`, '#results-bars');
        const val = AC.div('results-val', `results-v${i}`, `left:${CX[i] - 150}px;top:${BASE - hOf(v[i]) - 100}px`, '#results-bars', VAL[i]); val.dataset.to = VAL[i];
        const lab = AC.div('results-lab', `results-l${i}`, `left:${CX[i] - 260}px`, '#results-bars', LAB[i]);
        return { bar, val, lab };
      });
      const brk = AC.ln('M200 1180 L200 1196 L820 1196 L820 1180', SV, { c: AC.C.CY, w: 4, id: 'results-brk' });

      // "The base model": title and subtitle write on, the axis draws
      const sp = SplitText.create('#results-title', { type: 'words,chars' });
      tl.fromTo(sp.chars, { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.26, stagger: 0.02, ease: 'back.out(2)' }, 0.02);
      tl.fromTo('#results-sub', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, a('base'));
      KIT.draw(tl, axis, a('model') - 0.1, 0.4);
      // "with its full context ... thirty point four percent": the base bar grows and counts up
      tl.fromTo(bars[0].lab, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, a('with') - 0.1);
      tl.fromTo(bars[0].bar, { scaleY: 0 }, { scaleY: 1, duration: a('percent') - a('with'), ease: 'power2.out' }, a('with'));
      KIT.fade(tl, bars[0].val, a('thirty') - 0.1, { dur: 0.1 });
      KIT.count(tl, bars[0].val, a('thirty') - 0.1, a('percent') - a('thirty') + 0.1, { ease: 'power2.out' });
      KIT.shake(tl, '#results-bar0', a('percent'), { amp: 6, dur: 0.2 });
      // "Auto Compact passed thirty nine point six percent": the second bar grows and lands
      tl.fromTo(bars[1].lab, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.25 }, a('Auto') - 0.1);
      tl.fromTo(bars[1].bar, { scaleY: 0 }, { scaleY: 1, duration: a('six') - a('Auto'), ease: 'power2.in' }, a('Auto'));
      KIT.fade(tl, bars[1].val, a('passed', 1) - 0.1, { dur: 0.1 });
      KIT.count(tl, bars[1].val, a('passed', 1) - 0.1, a('six') - a('passed', 1) + 0.1, { ease: 'power2.out' });
      KIT.shake(tl, '#results-beat', a('six') + 0.02, { amp: 12, dur: 0.28 });
      KIT.sparks(tl, '#results-world', CX[1], BASE - hOf(v[1]) - 40, a('six') + 0.02, { n: 12, r: 180, color: '#a8dcf2' });
      // a bracket under both bars: same model, same scaffold
      KIT.draw(tl, brk, a('percent', 1) + 0.05, 0.3);
      tl.fromTo('#results-same', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25 }, a('percent', 1) + 0.2);
      KIT.beats(tl, '#results-beat', [a('base'), a('full'), a('percent'), a('Auto')], { amp: 0.018, shift: 12, reset: b('In') - 0.35 });

      // ---- panel 2 (x 1080..2160): a small context with a forced-compaction limit for both ----
      const GY = 620, O = 1080;
      AC.ln(`M${O + 120} ${GY} L${O + 940} ${GY}`, SV, { w: 5 });
      AC.hiker(SV, { id: 'results-hb', x: O + 300, y: GY, s: 1.1, pack: 1.1 });
      AC.hiker(SV, { id: 'results-ha', x: O + 700, y: GY, s: 1.1, pack: 0.9 });
      const limY = GY - 184 * 1.1 - 6;
      const lim = AC.ln(`M${O + 180} ${limY} L${O + 880} ${limY}`, SV, { c: AC.C.COR, w: 5, dash: '14 10', id: 'results-lim' }); lim.classList.add('dash');
      const PGa = AC.peg('#results-world', { id: 'results-peg', x: O + 790, y: GY, label: d4.peg });
      // the lead chart: the base model is the reference line; columns show how far AutoCompact sits above it (Figure 3c gaps, not printed)
      const RY = 1150, PX = 18, g = d10._g.map((x) => x / 5), XS = [0, 1, 2, 3, 4, 5].map((i) => O + 220 + i * 130);
      const ref = AC.ln(`M${O + 160} ${RY} L${O + 900} ${RY}`, SV, { w: 5, id: 'results-ref' });
      const cols = XS.map((x, i) => AC.svg('rect', { x: x - 34, y: RY - g[i] * PX, width: 68, height: g[i] * PX, fill: '#a8dcf2', id: `results-col${i}` }, SV));

      // "In a small context": the camera slides right to the second panel
      tl.to('#results-world', { x: -O, duration: 0.45, ease: 'power3.inOut' }, b('In') - 0.3);
      KIT.draw(tl, lim, b('small') - 0.05, 0.35);
      tl.fromTo('#results-limlab', { opacity: 0 }, { opacity: 1, duration: 0.2 }, b('small') + 0.2);
      KIT.pop(tl, '#results-forced', b('context') - 0.1, { from: 0.4 });
      tl.fromTo('#results-lb', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25 }, b('context') + 0.15);
      tl.fromTo('#results-la', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.25 }, b('it') - 0.05);
      tl.fromTo(PGa, { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: 'power4.in' }, b('also'));
      // "beat compaction at the limit": the lead columns rise over the reference line at every budget
      KIT.draw(tl, ref, b('beat') - 0.15, 0.3);
      tl.fromTo(['#results-blab', '#results-sm', '#results-lg', '#results-budget'], { opacity: 0 }, { opacity: 1, duration: 0.25 }, b('beat'));
      cols.forEach((col, i) => tl.fromTo(col, { scaleY: 0, svgOrigin: `${XS[i]} ${RY}` }, { scaleY: 1, svgOrigin: `${XS[i]} ${RY}`, duration: 0.25, ease: 'back.out(1.6)' }, b('compaction') - 0.1 + i * 0.12));
      tl.fromTo('#results-alab', { opacity: 0 }, { opacity: 1, duration: 0.25 }, b('compaction') + 0.3);
      KIT.pop(tl, '#results-higher', b('limit') - 0.1, { from: 0.4 });
      // both hikers walk toward the limit while the labels land; the camera beats on the voice
      AC.walk(tl, 'results-hb', b('small') - 0.1, b('beat') - b('small') + 0.1);
      AC.walk(tl, 'results-ha', b('small') + 0.05, b('beat') - b('small'));
      tl.to('#results-hb', { x: 40, duration: b('beat') - b('small'), ease: 'none' }, b('small') - 0.1);
      tl.to('#results-ha', { x: 40, duration: b('beat') - b('small'), ease: 'none' }, b('small') + 0.05);
      tl.to('#results-hb-pack', { keyframes: [{ scale: 1.25, duration: 0.12 }, { scale: 1.1, duration: 0.2 }], svgOrigin: '-38 -84' }, b('context'));
      KIT.beats(tl, '#results-beat', [b('small') + 0.1, b('context') + 0.1, b('it'), b('beat') + 0.1], { amp: 0.02, shift: 14 });
      tl.to('#results-beat', { scale: 1.04, duration: 0.4, ease: 'power2.out' }, b('limit'));

      // the paper says it: "compaction based on task progress is more effective"
      const tR = b('compaction', 1) - 0.5;
      tl.to('#results-scrim', { opacity: 0.9, duration: 0.3 }, tR);
      tl.to('#results-world', { opacity: 0, duration: 0.25 }, tR + 0.3);
      const P = KIT.read(tl, { cam: '#results-cam', parent: '#results-stage', hud: '#results-hud', tagY: 560, id: 'progress', t: tR, label: d10.receipt,
        x: 40, y: 820, width: 1000, zoom: 2.8, fx: 560, fy: 860,
        marks: [[b('compaction', 1), b('effective') + 0.15, [[b('based'), 0.22], [b('on'), 0.33], [b('task'), 0.37], [b('progress'), 0.45], [b('is'), 0.62], [b('more'), 0.66], [b('effective'), 0.76]]]],
        circles: [{ word: 'progress', t: b('progress') + 0.05 }] });
      const tB = b('effective') + 0.2;
      tl.set('#results-cam', { x: 0, y: 0, scale: 1 }, tB);
      tl.set(P.el, { opacity: 0 }, tB);
      tl.set('#results-hud', { opacity: 0 }, tB);
      tl.set('#results-scrim', { opacity: 0 }, tB);
      tl.set('#results-world', { opacity: 1 }, tB);
      tl.set('#results-beat', { scale: 1, x: 0, y: 0 }, tB);
      // back on the panel: a strip of trail, its three stage flags light in turn, each with a compact() peg
      const MY = 1420, mini = AC.ln(`M${O + 160} ${MY} L${O + 900} ${MY}`, SV, { w: 4, id: 'results-mini' });
      gsap.set(mini, { opacity: 0 });
      tl.set(mini, { opacity: 1 }, tB);
      [O + 300, O + 560, O + 820].forEach((x, i) => {
        const f = AC.svg('path', { d: `M${x} ${MY} L${x} ${MY - 100} L${x + 46} ${MY - 86} L${x} ${MY - 72}`, fill: 'none', stroke: '#6aa9d0', 'stroke-width': 4, id: `results-mf${i}` }, SV);
        const pg = AC.svg('path', { d: `M${x - 26} ${MY} L${x - 26} ${MY - 54}`, stroke: '#ffb454', 'stroke-width': 8, 'stroke-linecap': 'round', id: `results-mp${i}` }, SV);
        gsap.set([f, pg], { opacity: 0 });
        tl.set(f, { opacity: 1 }, tB);
        tl.to(f, { attr: { stroke: '#ffb454', fill: '#ffb454' }, duration: 0.1 }, tB + 0.08 + i * 0.16);
        tl.fromTo(pg, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.14, ease: 'power4.in' }, tB + 0.08 + i * 0.16);
      });

      window.__timelines["results"] = tl;
    })();
  </script>
