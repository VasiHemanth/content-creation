<template id="close-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #close-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 800px; }
    #close-l1 { left: 60px; top: 180px; width: 960px; text-align: center; white-space: normal; font-size: 104px; line-height: 1.05; }
    #close-l2 { left: 60px; top: 410px; width: 960px; text-align: center; white-space: normal; font-size: 84px; line-height: 1.05; color: var(--amber); text-shadow: 8px 8px 0 var(--shadow); }
    #close-l1 .char, #close-l1 .word, #close-l2 .char, #close-l2 .word { display: inline-block; }
    #close-handle { left: 0; top: 1300px; width: 1080px; text-align: center; }
    #close-handle span { display: inline-block; padding: 12px 32px; font: 700 50px "Mono", monospace; color: var(--amber); background: var(--deep); border: 4px solid var(--amber); box-shadow: 10px 10px 0 var(--shadow); }
    #close-credit { left: 0; top: 1410px; width: 1080px; text-align: center; font-size: 26px; }
  </style>
  <div id="root" data-composition-id="close" data-width="1080" data-height="1920">
    <div id="close-cam">
      <div id="close-l1" class="hd" data-bind="l12.line1"></div>
      <div id="close-l2" class="hd" data-bind="l12.line2"></div>
      <svg class="ink sketch" id="close-svg" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <path id="close-cloud" class="ln thick" d="M330 1060 C 230 1060 210 950 290 922 C 255 830 355 760 435 795 C 465 695 635 690 670 780 C 750 735 870 800 835 900 C 915 925 895 1055 800 1060 Z" />
        <circle id="close-b1" class="ln" cx="560" cy="1110" r="18" />
        <g id="close-tree"></g>
        <g id="close-bot"></g>
      </svg>
      <div id="close-handle" class="abs"><span data-bind="l12.handle"></span></div>
      <div id="close-credit" class="lbl" data-bind="l12.credit"></div>
    </div>
  </div>
  <script>
    (function () {
      const S = 'close', c = (w, n) => KIT.cue('l12', w, n), D = KIT.sceneDur(S);
      KIT.bind('#close-cam');
      const tl = gsap.timeline({ paused: true });

      const s1 = SplitText.create('#close-l1', { type: 'words,chars' }), s2 = SplitText.create('#close-l2', { type: 'words,chars' });
      [...s1.chars, ...s2.chars].forEach((ch) => ch.setAttribute('data-layout-allow-overlap', ''));
      tl.fromTo(s1.chars, { scale: 2.6, opacity: 0, y: -30 }, { scale: 1, opacity: 1, y: 0, duration: 0.18, stagger: 0.025, ease: 'power4.in' }, c('Old') - 0.12);
      KIT.shake(tl, '#close-cam', c('waste') + 0.1, { amp: 12, dur: 0.25 });
      tl.fromTo(s2.chars, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, stagger: 0.018, ease: 'back.out(2)' }, c('It') - 0.1);

      // the same sleeping agent as the opening, its dream full of old work
      KIT.robot('#close-bot', { id: 'close-r', x: 540, y: 1160, s: 0.95, asleep: true });
      tl.fromTo('#close-bot', { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, 0.1);
      KIT.draw(tl, '#close-b1', 0.35, 0.2);
      KIT.draw(tl, '#close-cloud', 0.45, 0.5);
      const T = KIT.tree('#close-tree', { id: 'close-t', x: 552, y: 830, w: 380, dy: 64, levels: [3, 5, 6], seed: 4, r: 9, edgeClass: 'ln cyan thin' });
      [T.root, ...T.nodes].forEach((n, k) => {
        if (n.edge) KIT.draw(tl, n.edge, 0.7 + k * 0.03, 0.15, { ease: 'none' });
        tl.fromTo(n.el, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.12 }, 0.8 + k * 0.03);
      });
      // on "practice", one path through the old tree lights up again
      const leaf = T.byLevel[3][2], chain = []; for (let n = leaf; n; n = n.parent) chain.unshift(n);
      chain.forEach((n, k) => tl.to(n.el, { fill: '#ffb454', duration: 0.1 }, c('practice') - 0.2 + k * 0.08));
      KIT.rise(tl, '#close-handle', c('practice') + 0.1, { y: 40 });
      KIT.fade(tl, '#close-credit', c('practice') + 0.4, { dur: 0.4 });
      tl.fromTo('#close-cam', { scale: 1 }, { scale: 1.04, duration: D, ease: 'sine.inOut' }, 0);
      // the last frames fade to the bare sheet, so the loop into the opening reads as one move
      tl.to('#close-cam', { opacity: 0, duration: 0.35, ease: 'power1.in' }, D - 0.38);

      window.__timelines["close"] = tl;
    })();
  </script>
</template>
