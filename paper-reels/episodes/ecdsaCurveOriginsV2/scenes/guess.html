<template id="guess-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #guess-shk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #guess-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #guess-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #guess-agent { left: 150px; top: 610px; font-size: 32px; opacity: 0; }
    #guess-term { position: absolute; left: 430px; top: 250px; width: 560px; height: 320px; box-sizing: border-box; background: #051427; border: 5px solid var(--dim); box-shadow: 12px 12px 0 var(--shadow); opacity: 0; }
    #guess-era { left: 24px; top: 22px; font-size: 26px; }
    .guess-code { position: absolute; left: 30px; font: 700 34px "Mono", monospace; color: var(--white); white-space: nowrap; }
    #guess-c1 { color: var(--mint); }
    #guess-fn { left: 0; top: 700px; width: 1080px; text-align: center; font-size: 150px; color: var(--amber); text-shadow: 9px 9px 0 var(--shadow); opacity: 0; }
    #guess-state { position: absolute; left: 380px; top: 960px; width: 320px; height: 150px; box-sizing: border-box; background: var(--deep); border: 7px solid var(--amber); box-shadow: 12px 12px 0 var(--shadow);
      display: flex; align-items: center; justify-content: center; font: 400 76px "Marker", sans-serif; color: var(--amber); opacity: 0; }
    #guess-outs { left: 380px; top: 1380px; width: 320px; text-align: center; font-size: 30px; opacity: 0; }
    .guess-o { position: absolute; top: 1270px; width: 150px; height: 84px; box-sizing: border-box; background: var(--panel); border: 5px solid var(--cyan); opacity: 0; }
  </style>
  <div id="root" data-composition-id="guess" data-width="1080" data-height="1920">
    <div id="guess-shk"><div id="guess-cam">
      <svg id="guess-svg" class="ink" viewBox="0 0 1080 1920"></svg>
      <div id="guess-agent" class="tag" data-bind="l06.agent"></div>
      <div id="guess-term">
        <div id="guess-era" class="tag cyan" data-bind="l06.era"></div>
        <div id="guess-c0" class="guess-code" style="top:130px" data-bind="l06.code.0"></div>
        <div id="guess-c1" class="guess-code" style="top:200px" data-bind="l06.code.1"></div>
      </div>
      <div id="guess-fn" class="hd" data-bind="l06.fn" data-layout-allow-overlap></div>
      <div id="guess-state" data-bind="l07.state"></div>
      <div id="guess-o0" class="guess-o" style="left:150px"></div>
      <div id="guess-o1" class="guess-o" style="left:465px"></div>
      <div id="guess-o2" class="guess-o" style="left:780px"></div>
      <div id="guess-outs" class="lbl" data-bind="l07.outs"></div>
    </div></div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l06', w, n), b = (w, n) => KIT.cue('l07', w, n), D = KIT.sceneDur('guess');
      KIT.bind('#root');
      const tl = gsap.timeline({ paused: true });
      const svg = document.getElementById('guess-svg'), E = (t, at, p) => { const e = KIT.svgEl(t, at, p || svg); if (at['stroke-width']) e.style.strokeWidth = at['stroke-width']; return e; };
      const cam = (s, px, py, sy = 860) => ({ x: 540 - s * px, y: sy - s * py, scale: s });
      const R = KIT.robot(svg, { id: 'guess-r', x: 240, y: 300, s: 1.0 });
      gsap.set(R.g, { opacity: 0 });
      const wires = [[540, 1110, 225, 1270], [540, 1110, 540, 1270], [540, 1110, 855, 1270]].map(([x1, y1, x2, y2], k) => E('path', { id: `guess-w${k}`, d: `M${x1} ${y1} L${x2} ${y2}`, class: 'ln amber', 'stroke-width': 7 }));
      gsap.set(wires, { drawSVG: '0%' });
      // a lock icon on the hidden number
      const lk = E('g', { id: 'guess-lk', opacity: 0 });
      E('path', { d: 'M668 950 v-26 a22 22 0 0 1 44 0 v26', class: 'ln amber', 'stroke-width': 7 }, lk);
      E('rect', { x: 656, y: 946, width: 68, height: 52, rx: 8, fill: '#ffb454' }, lk);

      tl.fromTo('#guess-cam', cam(1.15, 300, 500), { ...cam(1.0, 540, 760), duration: 2.2, ease: 'power2.inOut' }, 0);
      tl.fromTo(R.g, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.35, ease: 'back.out(2)', immediateRender: false }, a('Anthropic'));
      KIT.pop(tl, '#guess-agent', a('Claude'));
      tl.to(R.eyes, { attr: { fill: '#7be3b0' }, duration: 0.15 }, a('guessed'));
      KIT.rise(tl, '#guess-term', a('guessed') - 0.1, { y: 50, dur: 0.35 });
      KIT.typeOn(tl, '#guess-c0', a('code'), 30);
      KIT.typeOn(tl, '#guess-c1', a('C'), 30);
      tl.to('#guess-cam', { ...cam(1.06, 620, 420), duration: 0.45, ease: 'power3.inOut' }, a('code'));
      tl.to('#guess-cam', { ...cam(1.0, 540, 760), duration: 0.4, ease: 'power3.inOut' }, a('L') - 0.2);
      KIT.slam(tl, '#guess-fn', a('forty'), { from: 2.4, amp: 14, shakeTarget: '#guess-shk' });
      KIT.sparks(tl, '#guess-cam', 540, 770, a('forty') + 0.2, { n: 12, r: 320 });
      // l07: one hidden number decides every output
      tl.to('#guess-fn', { scale: 1.12, color: '#f2f8ff', duration: 0.12, yoyo: true, repeat: 1 }, b('L'));
      tl.to('#guess-cam', { ...cam(1.06, 540, 800), duration: 0.3, ease: 'power3.out' }, b('L'));
      tl.to('#guess-fn', { y: -40, scale: 0.7, duration: 0.4, ease: 'power3.inOut' }, b('hides'));
      tl.to('#guess-term', { opacity: 0.3, duration: 0.3 }, b('hides'));
      KIT.sparks(tl, '#guess-cam', 540, 1035, b('one') , { n: 8, r: 200 });
      tl.to('#guess-cam', { ...cam(1.0, 540, 820), duration: 0.3, ease: 'power3.out' }, b('one'));
      KIT.pop(tl, '#guess-state', b('number'));
      tl.fromTo(lk, { opacity: 0, scale: 0.4, svgOrigin: '690 970' }, { opacity: 1, scale: 1, svgOrigin: '690 970', duration: 0.35, ease: 'back.out(2.5)', immediateRender: false }, b('inside'));
      tl.to('#guess-state', { borderColor: '#f2f8ff', duration: 0.12, yoyo: true, repeat: 1 }, b('state'));
      tl.to('#guess-cam', { ...cam(1.1, 540, 1050), duration: 0.45, ease: 'power3.inOut' }, b('state'));
      KIT.draw(tl, wires, b('decides'), 0.35, { stagger: 0.08 });
      ['#guess-o0', '#guess-o1', '#guess-o2'].forEach((s, k) => KIT.pop(tl, s, b('every') + k * 0.12));
      KIT.fade(tl, '#guess-outs', b('output'));
      tl.to('#guess-cam', { ...cam(1.0, 540, 900), duration: Math.max(0.3, D - b('output')), ease: 'sine.out' }, b('output'));
      window.__timelines["guess"] = tl;
    })();
  </script>
</template>
