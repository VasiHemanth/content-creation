<template id="proof-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #proof-shk, #proof-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #proof-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #proof-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #proof-count { left: 130px; top: 210px; font-size: 36px; opacity: 0; }
    #proof-bits { left: 650px; top: 210px; font-size: 36px; opacity: 0; }
    .proof-bar { position: absolute; left: 130px; height: 46px; width: 760px; box-sizing: border-box; border: 4px solid var(--dim); background: var(--panel); }
    .proof-fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: var(--mint); transform-origin: 0 50%; transform: scaleX(0); }
    #proof-dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: rgba(4,14,28,.75); opacity: 0; }
    #proof-word { left: 0; top: 560px; width: 1080px; text-align: center; font-size: 140px; opacity: 0; }
    #proof-verdict { left: 90px; top: 820px; width: 900px; text-align: center; font-size: 96px; white-space: nowrap; opacity: 0; }
  </style>
  <div id="root" data-composition-id="proof" data-width="1080" data-height="1920">
    <div id="proof-shk"><div id="proof-cam">
      <svg id="proof-svg" class="ink" viewBox="0 0 1080 1920"></svg>
      <div id="proof-count" class="tag cyan" data-bind="l11.count"></div>
      <div id="proof-bits" class="tag" data-bind="l11.bits"></div>
      <div id="proof-bars"></div>
      <div id="proof-dim"></div>
      <div id="proof-paper"></div>
    </div></div>
    <div id="proof-hud">
      <div id="proof-word" class="hd" data-bind="l12.word"></div>
      <div id="proof-verdict" class="stamp mint" data-bind="l12.verdict"></div>
    </div>
  </div>
  <script>
    (function () {
      const a = (w, n) => KIT.cue('l11', w, n), aE = (w, n) => KIT.cueEnd('l11', w, n), b = (w, n) => KIT.cue('l12', w, n), D = KIT.sceneDur('proof');
      KIT.bind('#root');
      const tl = gsap.timeline({ paused: true });
      const svg = document.getElementById('proof-svg'), E = (t, at, p) => { const e = KIT.svgEl(t, at, p || svg); if (at['stroke-width']) e.style.strokeWidth = at['stroke-width']; return e; };
      const cam = (s, px, py, sy = 860) => ({ x: 540 - s * px, y: sy - s * py, scale: s });
      // ten seeds, each a bar of bits that fills when its rebuilt state matches
      const host = document.getElementById('proof-bars'), fills = [], ticks = [];
      for (let k = 0; k < 10; k++) { const bar = document.createElement('div'); bar.className = 'proof-bar'; bar.id = `proof-bar${k}`; bar.style.top = `${320 + k * 66}px`;
        const f = document.createElement('div'); f.className = 'proof-fill'; f.id = `proof-f${k}`; bar.appendChild(f); host.appendChild(bar); fills.push(f);
        const tk = E('path', { id: `proof-tk${k}`, d: `M912 ${343 + k * 66} l12 12 l22 -26`, fill: 'none', stroke: '#7be3b0', 'stroke-width': 8, 'stroke-linecap': 'round' }); gsap.set(tk, { drawSVG: '0%' }); ticks.push(tk); }

      tl.fromTo('#proof-cam', cam(1.06, 540, 640), { ...cam(1.0, 540, 760), duration: 1.6, ease: 'power2.out' }, 0);
      KIT.pop(tl, '#proof-count', a('Each'));
      const tF = a('gives'), tB = a('bits');
      fills.forEach((f, k) => { const t = tF + (tB - tF) * k / 10; tl.to(f, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, t); tl.to(ticks[k], { drawSVG: '100%', duration: 0.1 }, t + 0.22); });
      KIT.pop(tl, '#proof-bits', a('sixty'));
      // receipt: the post's own sentence, read on camera, then back to the bars
      const tIn = aE('bits') - 0.1, tOut = Math.min(aE('chance') + 0.25, D - 0.3);
      tl.to('#proof-dim', { opacity: 1, duration: 0.25 }, tIn);
      const r = KIT.read(tl, { cam: '#proof-cam', parent: '#proof-paper', hud: '#proof-hud', id: KIT.data('l11').id, label: KIT.data('l11').receipt, t: tIn,
        x: 40, y: 1000, width: 1000, zoom: 2.6, follow: 0, fx: 90, fy: 900,
        marks: [[a('its'), aE('seed')], [a('does'), aE('chance')]],
        circles: [{ word: '160 bits', t: a('its') + 0.1 }] });
      const l12 = b('So');
      tl.to(['#proof-dim', r.el, '#proof-hud .receipt-tag'], { opacity: 0, duration: 0.25 }, l12 - 0.2);
      tl.to('#proof-cam', { ...cam(1.0, 540, 760), duration: 0.35, ease: 'power3.inOut' }, l12 - 0.2);
      tl.to(['#proof-bars', '#proof-count', '#proof-bits', ...ticks], { opacity: 0.18, duration: 0.3 }, l12);
      KIT.rise(tl, '#proof-word', b('hidden'));
      tl.to('#proof-word', { opacity: 0.45, scale: 0.8, y: -40, duration: 0.35, ease: 'power2.inOut' }, b('much'));
      KIT.slam(tl, '#proof-verdict', b('much'), { from: 2, amp: 14, shakeTarget: '#proof-shk' });
      KIT.sparks(tl, '#proof-hud', 540, 880, b('much') + 0.2, { n: 12, r: 320, color: '#7be3b0' });
      window.__timelines["proof"] = tl;
    })();
  </script>
</template>
