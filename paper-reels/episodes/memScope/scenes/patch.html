<template id="patch-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #patch-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #patch-beat { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 800px; }
    #patch-inner { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 400px 800px; }
    #patch-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #patch-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #patch-scrim { position: absolute; left: -1500px; top: -1500px; width: 4000px; height: 5000px; background: #061a30; opacity: 0; }
    .cf { position: absolute; background: var(--panel); border: 4px solid var(--cyan); box-shadow: 12px 12px 0 var(--shadow); }
    .cf .tab { position: absolute; left: -4px; top: -54px; padding: 8px 20px; font: 700 28px "Mono", monospace; color: var(--deep); background: var(--cyan); white-space: nowrap; }
    .cf .cl { position: absolute; left: 26px; font: 600 30px/1 "Mono", monospace; color: var(--dim); white-space: pre; }
    .cf .cl.bug { color: #ff8fc4; }
    .drw { position: absolute; background: var(--deep); border: 5px solid var(--amber); box-shadow: 10px 10px 0 var(--shadow); }
    .drw .hdl { position: absolute; left: 50%; bottom: 20px; width: 70px; height: 12px; margin-left: -35px; background: var(--amber); }
    .nc { position: absolute; width: 52px; height: 70px; background: var(--amber); border: 3px solid var(--deep); }
    #patch-card { position: absolute; left: 70px; top: 214px; width: 250px; height: 110px; background: var(--deep); border: 4px solid #ff8fc4; box-shadow: 8px 8px 0 var(--shadow);
      font: 400 38px/110px "Marker", sans-serif; color: #ff8fc4; text-align: center; }
    #patch-file { left: 70px; top: 600px; width: 620px; height: 470px; }
    #patch-drw { left: 730px; top: 880px; width: 200px; height: 120px; }
    #patch-pa { left: 690px; top: 486px; font-size: 32px; color: #c3a6ff; border-color: #c3a6ff; }
    #patch-sliver { position: absolute; left: 700px; top: 560px; width: 220px; height: 56px; border: 4px solid #c3a6ff; background: rgba(195,166,255,.18);
      font: 700 28px/48px "Mono", monospace; color: #c3a6ff; text-align: center; transform-origin: 50% 50%; }
    #patch-small { left: 690px; top: 640px; font-size: 28px; color: #c3a6ff; border-color: #c3a6ff; }
    #patch-strip { position: absolute; left: 60px; top: 1120px; width: 880px; height: 220px; background: #0d1b2c; border-top: 4px solid var(--white); border-bottom: 4px solid var(--white); transform-origin: 0 50%; }
    #patch-strip .hole { position: absolute; width: 18px; height: 12px; background: var(--deep); border: 2px solid var(--dim); }
    #patch-strip .fr { position: absolute; top: 34px; width: 148px; height: 148px; border: 4px solid var(--white); background: var(--deep); box-sizing: border-box; }
    #patch-strip .fr .fl { position: absolute; left: 0; top: 14px; width: 100%; text-align: center; font: 700 22px "Mono", monospace; color: var(--white); }
    #patch-strip .fr.ghost { border: 3px dashed var(--faint); background: transparent; }
    #patch-zero { left: 260px; top: 1186px; font-size: 44px; color: #ff8fc4; border-color: #ff8fc4; }
    #patch-none { left: 560px; top: 1186px; font-size: 44px; color: #ff8fc4; border-color: #ff8fc4; }
    #patch-trace { left: 70px; top: 1360px; font-size: 40px; color: var(--white); border-color: var(--white); }
    #patch-code { left: 735px; top: 770px; font-size: 26px; color: #c3a6ff; border-color: #c3a6ff; }
    #patch-cause { left: 300px; top: 540px; font-size: 28px; color: #ff8fc4; border-color: #ff8fc4; }
    #patch-case { left: 300px; top: 490px; font-size: 24px; color: var(--dim); }
    #patch-removed { left: 300px; top: 540px; font-size: 28px; color: #c3a6ff; border-color: #c3a6ff; }
  </style>
  <div id="root" data-composition-id="patch" data-width="1080" data-height="1920">
    <div id="patch-cam">
      <div id="patch-beat"><div id="patch-inner">
        <div id="patch-card" data-bind="l05.q"></div>
        <div id="patch-file" class="cf"><div id="patch-tab" class="tab" data-bind="l01.file"></div></div>
        <div id="patch-drw" class="drw"><div class="hdl"></div></div>
        <div id="patch-cards"></div>
        <svg class="ink sketch" id="patch-svg" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
          <g id="patch-bot"></g>
          <g id="patch-pen"><path d="M700 470 L760 410" stroke="#c3a6ff" stroke-width="14" stroke-linecap="round" /><path d="M694 476 L686 492 L702 484 Z" fill="#c3a6ff" /></g>
          <path id="patch-lens" class="ln thick dash" style="stroke:#c3a6ff" d="M730 320 C 600 260 460 250 330 250" />
          <path id="patch-pt" class="ln thick" style="stroke:#c3a6ff" d="M560 1120 C 760 1080 770 960 726 905" />
          <path id="patch-brk" class="ln thick" style="stroke:#c3a6ff" d="M700 730 L722 730 L722 900 L700 900" />
          <path id="patch-exit" class="ln thick" style="stroke:#ff8fc4" d="M590 805 C 660 805 668 735 610 712" />
          <path id="patch-exith" class="ln thick" style="stroke:#ff8fc4" d="M628 700 L608 712 L628 728" />
          <path id="patch-box" class="ln" style="stroke:#ff8fc4;stroke-width:5" d="M86 784 L600 784 L600 830 L86 830 Z" />
          <path id="patch-strike" class="ln heavy" style="stroke:#c3a6ff" d="M92 808 L594 808" />
        </svg>
        <div id="patch-pa" class="tag" data-bind="l08.pa"></div>
        <div id="patch-sliver" data-bind="l08.patch"></div>
        <div id="patch-small" class="tag" data-bind="l08.small"></div>
        <div id="patch-strip"></div>
        <div id="patch-zero" class="tag" data-bind="l09.steps"></div>
        <div id="patch-none" class="tag" data-bind="l09.none"></div>
        <div id="patch-trace" class="tag" data-bind="l09.trace"></div>
        <div id="patch-code" class="tag" data-bind="l10.code"></div>
        <div id="patch-case" class="lbl" data-bind="l10.case"></div>
        <div id="patch-cause" class="tag" data-bind="l10.line"></div>
        <div id="patch-removed" class="tag" data-bind="l11.removed"></div>
      </div></div>
      <div id="patch-scrim"></div>
      <div id="patch-stage"></div>
    </div>
    <div id="patch-hud"></div>
  </div>
  <script>
    (function () {
      const S = 'patch', a = (w, n) => KIT.cue('l08', w, n), b = (w, n) => KIT.cue('l09', w, n), c = (w, n) => KIT.cue('l10', w, n), d = (w, n) => KIT.cue('l11', w, n), D = KIT.sceneDur(S);
      KIT.bind('#patch-inner');
      const tl = gsap.timeline({ paused: true });

      // the board returns: the file with its pink line, the drawer, the question card
      const d1 = KIT.data('l01'), file = document.querySelector('#patch-file'), LH = 52, TOP = 34;
      const lines = d1.code.map((s, k) => {
        const el = document.createElement('div'); el.className = 'cl' + (k === d1._bug ? ' bug' : ''); el.id = `patch-cl${k}`;
        el.textContent = s; el.style.top = `${TOP + k * LH}px`; file.appendChild(el); return el;
      });
      const bug = lines[d1._bug], others = lines.filter((e) => e !== bug);
      tl.fromTo('#patch-file', { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.4)' }, 0.02);
      tl.fromTo(['#patch-card', '#patch-drw'], { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power3.out', stagger: 0.08 }, 0.1);
      const host = document.querySelector('#patch-cards'), nc = [[748, 832], [806, 826], [864, 836]].map(([x, y], k) => {
        const el = document.createElement('div'); el.className = 'nc'; el.id = `patch-nc${k}`; el.style.left = `${x}px`; el.style.top = `${y}px`; host.appendChild(el); return el;
      });
      tl.fromTo(nc, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.05 }, 0.2);

      // l08 "Patch Agent": a violet robot drops in with a pen; its tag stamps
      KIT.robot('#patch-bot', { id: 'patch-r', x: 820, y: 230, s: 0.85, stroke: '#c3a6ff', eye: '#c3a6ff' });
      tl.fromTo(['#patch-bot', '#patch-pen'], { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'back.out(1.4)' }, a('Patch') - 0.25);
      tl.fromTo('#patch-pa', { scale: 2.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.18, ease: 'power4.in' }, a('Agent') - 0.05);
      KIT.shake(tl, '#patch-beat', a('Agent') + 0.13, { amp: 10, dur: 0.25 });
      // "patches: small code edits": a violet patch peels off the pen and shrinks to one line on the file
      tl.fromTo('#patch-sliver', { x: 0, y: -100, scale: 0.3, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' }, a('patches') - 0.1);
      tl.to('#patch-sliver', { x: -133, y: 217, scale: 0.7, duration: 0.45, ease: 'power3.inOut' }, a('small') - 0.1);
      KIT.pop(tl, '#patch-small', a('small') + 0.05);
      tl.to('#patch-pen', { rotation: -20, svgOrigin: '730 440', duration: 0.15, yoyo: true, repeat: 1 }, a('writes'));

      // l09 "reads the question's step-by-step record: the trace"
      tl.to(['#patch-sliver', '#patch-small'], { opacity: 0, duration: 0.25 }, b('It') - 0.1);
      KIT.draw(tl, '#patch-lens', b('reads') - 0.05, 0.4, { ease: 'power2.out' });
      tl.to('#patch-card', { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1 }, b('question\'s'));
      // the trace: one question frame, then no steps at all (dashed, empty frames)
      const strip = document.querySelector('#patch-strip'), frames = [];
      for (let k = 0; k < 22; k++) { ['top:10px', 'bottom:10px'].forEach((p, j) => { const h = document.createElement('div'); h.className = 'hole'; h.id = `patch-h${k}-${j}`; h.style.cssText = `left:${14 + k * 40}px;${p}`; strip.appendChild(h); }); }
      for (let k = 0; k < 5; k++) {
        const fr = document.createElement('div'); fr.className = 'fr' + (k ? ' ghost' : ''); fr.id = `patch-fr${k}`; fr.style.left = `${24 + k * 170}px`;
        if (!k) { const fl = document.createElement('div'); fl.className = 'fl'; fl.id = 'patch-fl0'; fl.textContent = KIT.data('l09').q; fr.appendChild(fl); }
        strip.appendChild(fr); frames.push(fr);
      }
      tl.fromTo('#patch-strip', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power2.out' }, b('step-by-step') - 0.1);
      tl.fromTo(frames, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, stagger: 0.12, ease: 'back.out(2.5)' }, b('step-by-step') + 0.05);
      tl.fromTo('#patch-trace', { scale: 2.4, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, rotation: -2, duration: 0.18, ease: 'power4.in' }, b('trace') - 0.05);
      KIT.shake(tl, '#patch-beat', b('trace') + 0.13, { amp: 10, dur: 0.25 });
      // "This trace shows zero steps, and no notes"
      tl.to(frames.slice(1), { borderColor: '#ff8fc4', duration: 0.15, stagger: 0.06 }, b('shows'));
      tl.fromTo('#patch-zero', { scale: 2.2, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.18, ease: 'power4.in' }, b('zero') - 0.05);
      tl.fromTo('#patch-none', { scale: 2.2, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, rotation: 3, duration: 0.18, ease: 'power4.in' }, b('no') - 0.05);
      KIT.shake(tl, '#patch-strip', b('notes'), { amp: 8, dur: 0.22 });

      // l10 "So the trace points to the search code"
      tl.to('#patch-lens', { opacity: 0, duration: 0.3 }, c('So'));
      tl.fromTo('#patch-strip', { boxShadow: '0 0 0px rgba(195,166,255,0)' }, { boxShadow: '0 0 40px rgba(195,166,255,.6)', duration: 0.3 }, c('trace') - 0.05);
      KIT.draw(tl, '#patch-pt', c('points') - 0.05, 0.45, { ease: 'power2.inOut' });
      KIT.draw(tl, '#patch-brk', c('search') - 0.05, 0.3);
      tl.fromTo(lines.slice(2, 6), { color: '#6aa9d0' }, { color: '#a8dcf2', duration: 0.2 }, c('search'));
      KIT.pop(tl, '#patch-code', c('code') - 0.05);
      // "One line may stop the search too soon"
      tl.to('#patch-trace', { opacity: 0, duration: 0.2 }, c('So') - 0.3);
      tl.to(['#patch-zero', '#patch-none'], { opacity: 0, duration: 0.25 }, c('line') - 0.4);
      KIT.draw(tl, '#patch-box', c('line') - 0.1, 0.35);
      tl.fromTo(bug, { textShadow: '0 0 0px rgba(255,143,196,0)' }, { textShadow: '0 0 22px rgba(255,143,196,.9)', duration: 0.25 }, c('line'));
      KIT.pop(tl, '#patch-cause', c('may'));
      KIT.fade(tl, '#patch-case', c('may') + 0.3, { dur: 0.3 });
      KIT.draw(tl, '#patch-exit', c('stop') - 0.1, 0.3, { ease: 'power2.out' });
      KIT.draw(tl, '#patch-exith', c('stop') + 0.18, 0.12);
      KIT.shake(tl, '#patch-beat', c('stop') + 0.1, { amp: 10, dur: 0.25 });
      tl.fromTo(nc, { y: 0 }, { y: 24, duration: 0.3, stagger: 0.05 }, c('soon') - 0.2);
      tl.to('#patch-box', { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 7, ease: 'sine.inOut' }, c('soon') + 0.2);
      // the seam into l11: the Patch Agent's pen travels to the line and taps it
      tl.to('#patch-pen', { x: -110, y: 330, duration: 0.6, ease: 'power3.inOut' }, c('soon') + 0.35);
      tl.to(bug, { scale: 1.1, transformOrigin: '0 50%', duration: 0.15, yoyo: true, repeat: 1 }, c('soon') + 0.95);
      tl.to('#patch-r-ant', { attr: { r: 16 }, duration: 0.15, yoyo: true, repeat: 3 }, d('Patch'));

      // l11 receipt R2: "make one minimal, evidence-backed patch"
      const tR = d('make') - 0.55;
      tl.to(['#patch-pt', '#patch-brk', '#patch-code'], { opacity: 0, duration: 0.25 }, tR - 0.2);
      tl.to('#patch-scrim', { opacity: 0.88, duration: 0.35 }, tR);
      tl.to('#patch-inner', { opacity: 0, duration: 0.3 }, tR + 0.3);
      const R = KIT.read(tl, { cam: '#patch-cam', parent: '#patch-stage', hud: '#patch-hud', tagY: 300, id: 'job', t: tR, label: KIT.data('l11').receipt,
        x: 40, y: 860, width: 1000, zoom: 2.5, fx: 40, fy: 860, follow: 0,
        marks: [[d('make') - 0.05, KIT.cueEnd('l11', 'patch', 1)]],
        circles: [{ word: 'minimal', t: d('minimal') + 0.15 }] });
      { const m = KIT.EP.evidence.job.circles.minimal, cx = (m.x + m.w / 2) * 1000; document.querySelector('#patch-stage-job-circle-minimal').setAttribute('transform', `translate(${cx} 0) scale(0.74 1) translate(${-cx} 0)`); }
      { const r0 = KIT.EP.evidence.job.rects[0], m = 0.3; R.el.style.boxShadow = 'none'; R.el.style.clipPath = `inset(-60px ${((1 - r0.x - r0.w) * 100 - m).toFixed(2)}% -60px ${(r0.x * 100 - m).toFixed(2)}%)`; }
      const tBack = Math.min(d('removes') - 0.25, R.end + 0.15);
      tl.to('#patch-cam', { x: 0, y: 0, scale: 1, duration: 0.35, ease: 'power3.inOut' }, tBack);
      tl.to('#patch-scrim', { opacity: 0, duration: 0.3 }, tBack);
      tl.to(R.el, { y: 500, opacity: 0, duration: 0.3, ease: 'power2.in' }, tBack);
      tl.to('#patch-stage-job-tag', { opacity: 0, duration: 0.25 }, tBack);
      tl.to('#patch-inner', { opacity: 1, duration: 0.3 }, tBack + 0.05);
      // "It removes only that line": the violet pen strikes the pink line only
      tl.to(['#patch-cause', '#patch-case', '#patch-exit', '#patch-exith'], { opacity: 0, duration: 0.2 }, d('removes') - 0.1);
      KIT.draw(tl, '#patch-strike', d('removes'), 0.3, { ease: 'power2.out' });
      tl.to(bug, { opacity: 0.45, duration: 0.25 }, d('removes') + 0.25);
      tl.fromTo(others, { color: '#6aa9d0' }, { color: '#f2f8ff', duration: 0.15, yoyo: true, repeat: 1, immediateRender: false }, d('only'));
      KIT.pop(tl, '#patch-removed', d('line'));
      tl.to(['#patch-strip'], { opacity: 0, y: 60, duration: 0.3 }, d('removes'));
      tl.to('#patch-pen', { x: -60, y: 330, duration: 0.3, ease: 'power2.inOut' }, d('removes'));

      // camera: the inner board; down to the strip for the trace, back up and in to the file for the line
      tl.fromTo('#patch-inner', { scale: 1, x: 0, y: 0 }, { scale: 1.04, x: 0, y: 0, duration: b('It'), ease: 'sine.inOut' }, 0);
      tl.to('#patch-inner', { scale: 1.06, y: -90, duration: 0.6, ease: 'power3.inOut' }, b('step-by-step') - 0.3);
      tl.to('#patch-inner', { scale: 1.08, duration: 1.6, ease: 'sine.inOut' }, b('trace', 1));
      tl.to('#patch-inner', { scale: 1.08, x: 0, y: 0, duration: 0.6, ease: 'power3.inOut' }, c('points') - 0.2);
      tl.to('#patch-inner', { scale: 1.12, x: 0, y: 40, duration: 0.5, ease: 'power3.inOut' }, c('line') - 0.2);
      tl.to('#patch-inner', { scale: 1.04, x: 0, y: 0, duration: 0.5, ease: 'power3.inOut' }, c('soon'));
      tl.to('#patch-inner', { scale: 1.1, x: 0, y: 20, duration: 0.4, ease: 'power3.out' }, d('removes') - 0.1);
      KIT.beats(tl, '#patch-beat', [a('MemScope'), a('writes'), b('reads'), b('record'), b('shows'), b('zero'), b('notes'), c('So'), c('points'), c('search', 1), d('job'), d('only')], { amp: 0.025, shift: 14 });

      window.__timelines["patch"] = tl;
    })();
  </script>
</template>
