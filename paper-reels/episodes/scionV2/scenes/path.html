<template id="path-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #path-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #path-stack { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 1440px; }
    .path-band { position: absolute; left: 60px; width: 860px; height: 220px; border: 5px solid; }
    #path-bs { top: 380px; background: rgba(255,180,84,.13); border-color: var(--amber); }
    #path-bc { top: 680px; background: rgba(168,220,242,.13); border-color: var(--cyan); }
    #path-bd { top: 980px; background: rgba(123,227,176,.13); border-color: var(--mint); }
    .path-bflash { position: absolute; inset: 0; opacity: 0; }
    .path-name { position: absolute; left: 24px; top: 28px; font: 700 64px "Mono", monospace; color: var(--white); white-space: nowrap; }
    .path-sub { position: absolute; left: 26px; top: 122px; font: 600 44px "Mono", monospace; color: var(--cyan); white-space: nowrap; }
    #path-jobs { position: absolute; left: 84px; top: 1300px; font: 700 64px "Mono", monospace; color: var(--white); }
    .path-store { position: absolute; top: 200px; padding: 8px 20px; font: 700 44px "Mono", monospace; color: var(--cyan); background: var(--deep); border: 3px dashed var(--cyan); white-space: nowrap; }
    #path-spanner { left: 110px; } #path-storage { left: 500px; }
    #path-ssvg, #path-csvg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #path-token, #path-token2 { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 26px rgba(255,180,84,.9); }
    #path-card { position: absolute; left: 596px; top: 990px; width: 312px; height: 452px; background: var(--deep); border: 5px solid var(--white); box-shadow: 12px 12px 0 var(--shadow); transform-origin: 890px 1300px; }
    .path-clab { position: absolute; left: 18px; font: 700 56px "Mono", monospace; color: var(--white); white-space: nowrap; }
    #path-ltrees { top: 8px; } #path-lblobs { top: 372px; color: var(--amber); }
    #path-rcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #path-rstage, #path-rhud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .receipt-tag { font-size: 40px !important; }
    #path-never { position: absolute; left: 600px; top: 300px; padding: 8px 20px; font: 700 48px "Mono", monospace; color: var(--deep); background: var(--coral); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="path" data-width="1080" data-height="1920">
    <div id="path-cam">
      <div id="path-stack">
        <div id="path-spanner" class="path-store" data-bind="l06.spanner"></div>
        <div id="path-storage" class="path-store" data-bind="l06.storage"></div>
        <div id="path-bs" class="path-band"><div class="path-bflash" id="path-fs" style="background:var(--amber)"></div><div class="path-name" data-bind="l06.server"></div></div>
        <div id="path-bc" class="path-band"><div class="path-bflash" id="path-fc" style="background:var(--cyan)"></div><div class="path-name" data-bind="l06.cache"></div><div class="path-sub" data-bind="l06.cacheSub"></div></div>
        <div id="path-bd" class="path-band"><div class="path-bflash" id="path-fd" style="background:var(--mint)"></div><div class="path-name" data-bind="l06.daemon"></div><div class="path-sub" data-bind="l06.daemonSub"></div></div>
        <div id="path-jobs" data-bind="l06.jobs"></div>
        <svg class="ink" id="path-ssvg" viewBox="0 0 1080 1920">
          <path id="path-tr1" class="ln amber heavy" d="M890 1300 L890 1090" />
          <path id="path-tr2" class="ln amber heavy" d="M890 1090 L890 790" />
          <path id="path-tr3" class="ln amber heavy" d="M890 790 L890 490" />
          <path id="path-cloud" class="ln cyan thick dash" d="M700 380 L700 286" />
          <g id="path-slots"></g>
          <g id="path-jobicons"></g>
        </svg>
        <div id="path-token"></div>
        <div id="path-token2"></div>
        <div id="path-never" data-bind="l07.never"></div>
      </div>
      <div id="path-card">
        <div id="path-ltrees" class="path-clab" data-bind="l06.trees"></div>
        <div id="path-lblobs" class="path-clab" data-bind="l06.blobs"></div>
      </div>
      <svg class="ink" id="path-csvg" viewBox="0 0 1080 1920"><g id="path-tree"></g></svg>
    </div>
    <div id="path-rcam"><div id="path-rstage"></div></div>
    <div id="path-rhud"></div>
  </div>
  <script>
    (function () {
      const S = 'path', c6 = (w, n) => KIT.cue('l06', w, n), c7 = (w, n) => KIT.cue('l07', w, n), D = KIT.sceneDur(S), E = KIT.svgEl;
      KIT.bind('#path-cam');
      const tl = gsap.timeline({ paused: true });
      const seal = (g, cx, cy, r, id) => { const s = E('g', { id }, g); E('circle', { cx, cy, r, fill: '#ff6b6b', stroke: '#ffd6d6', 'stroke-width': r * 0.12 }, s); E('path', { d: `M${cx - r * 0.45} ${cy} L${cx - r * 0.1} ${cy + r * 0.38} L${cx + r * 0.5} ${cy - r * 0.35}`, fill: 'none', stroke: '#fff7e6', 'stroke-width': r * 0.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s); return s; };

      // slots in the right zone of each tier: two hold sealed objects, the third is the one this checkout needs
      const sg = document.getElementById('path-slots'), slots = {};
      [['s', 490], ['c', 790], ['d', 1090]].forEach(([k, cy]) => {
        [620, 715].forEach((x, i) => { E('rect', { x, y: cy - 38, width: 76, height: 76, rx: 10, fill: '#7be3b0', id: `path-f${k}${i}` }, sg); seal(sg, x + 38, cy, 24, `path-x${k}${i}`); });
        E('rect', { x: 810, y: cy - 38, width: 76, height: 76, rx: 10, class: 'ln white thick dash', id: `path-e${k}`, opacity: 0.9 }, sg);
        const f = E('rect', { x: 810, y: cy - 38, width: 76, height: 76, rx: 10, fill: '#7be3b0', id: `path-n${k}` }, sg);
        const s = seal(sg, 848, cy, 24, `path-m${k}`);
        slots[k] = { f, s, cy };
      });
      const jg = document.getElementById('path-jobicons');
      [640, 750].forEach((x, i) => { const g = E('g', { id: `path-j${i}` }, jg); E('rect', { x: x - 40, y: 1300, width: 80, height: 80, rx: 8, fill: '#0a2340', stroke: '#a8dcf2', 'stroke-width': 6 }, g); [-18, 0, 18].forEach((d) => E('path', { d: `M${x - 22} ${1340 + d} L${x + 22} ${1340 + d}`, stroke: '#a8dcf2', 'stroke-width': 6, 'stroke-linecap': 'round' }, g)); });

      // ---- l06: the stack builds bottom up, then the checkout asks only for the trees and blobs it needs
      const t0 = Math.max(0.05, c6('checkout') - 0.35);
      tl.fromTo(['#path-jobs', '#path-j0', '#path-j1'], { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'back.out(1.8)', stagger: 0.05 }, t0);
      tl.fromTo('#path-bd', { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, t0 + 0.2);
      const t1 = c6('Scion') - 0.2;
      tl.fromTo('#path-bc', { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, t1);
      tl.fromTo('#path-bs', { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, t1 + 0.18);
      tl.fromTo(['#path-spanner', '#path-storage'], { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.1 }, t1 + 0.4);
      ['s', 'c', 'd'].forEach((k, i) => tl.fromTo([`#path-f${k}0`, `#path-x${k}0`, `#path-f${k}1`, `#path-x${k}1`, `#path-e${k}`], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.04 }, t1 + 0.3 + i * 0.1));
      Object.values(slots).forEach((q) => { tl.fromTo([q.f, q.s], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0); });
      tl.fromTo(['#path-token', '#path-token2'], { x: 866, y: 1276, opacity: 0 }, { x: 866, y: 1276, opacity: 0, duration: 0.01 }, 0);

      // the trees card: root tree, child trees, then sealed blobs; only two branches stay lit
      const tg = document.getElementById('path-tree'), N = (x, y, id) => E('circle', { cx: x, cy: y, r: 17, fill: '#f2f8ff', id }, tg);
      const L = (a, b, id) => E('path', { d: `M${a[0]} ${a[1]} L${b[0]} ${b[1]}`, class: 'ln cyan thick', id }, tg);
      const R = [752, 1110], C = [[690, 1190], [814, 1190]], LV = [[660, 1270], [722, 1270], [784, 1270], [846, 1270]];
      const edges = [L(R, C[0], 'path-e0'), L(R, C[1], 'path-e1'), L(C[0], LV[0], 'path-e2'), L(C[0], LV[1], 'path-e3'), L(C[1], LV[2], 'path-e4'), L(C[1], LV[3], 'path-e5')];
      const nodes = [N(...R, 'path-n0'), N(...C[0], 'path-n1'), N(...C[1], 'path-n2'), ...LV.map((p, i) => N(...p, `path-l${i}`))];
      const blobs = LV.map((p, i) => { const g = E('g', { id: `path-b${i}` }, tg); E('rect', { x: p[0] - 24, y: 1312, width: 48, height: 48, rx: 6, fill: '#0a2340', stroke: '#f2f8ff', 'stroke-width': 4 }, g); seal(g, p[0], 1336, 15, `path-bs${i}`); return g; });
      const tt = c6('trees') - 0.25;
      tl.fromTo('#path-cam', { x: 0, y: 0, scale: 1 }, { x: 0, y: -300, scale: 1.05, duration: 0.5, ease: 'power3.inOut' }, tt - 0.1);   // a vertical move only: the tier names stay in frame
      tl.fromTo('#path-card', { scale: 0.1, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.6)' }, tt);
      tl.fromTo(nodes[0], { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.2, ease: 'back.out(3)' }, tt + 0.2);
      KIT.draw(tl, edges.slice(0, 2), tt + 0.3, 0.2);
      tl.fromTo(nodes.slice(1, 3), { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.2, ease: 'back.out(3)' }, tt + 0.45);
      KIT.draw(tl, edges.slice(2), tt + 0.55, 0.2);
      tl.fromTo(nodes.slice(3), { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.2, ease: 'back.out(3)', stagger: 0.04 }, tt + 0.7);
      const tb = c6('blobs') - 0.2;
      tl.fromTo(blobs, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, stagger: 0.06, ease: 'back.out(2)' }, tb);
      KIT.fade(tl, '#path-lblobs', tb + 0.1);
      // "only ... it needs": two branches stay lit, the rest grey out
      const tn = c6('only') - 0.05, keep = [edges[0], edges[3], edges[1], edges[4]];
      tl.to(edges.filter((e) => !keep.includes(e)), { opacity: 0.18, duration: 0.3 }, tn);
      tl.to([nodes[5], nodes[3], blobs[0], blobs[3]], { opacity: 0.18, duration: 0.3 }, tn);
      tl.to(keep, { stroke: '#ffb454', duration: 0.3 }, tn);
      tl.to([nodes[0], nodes[1], nodes[2], nodes[4], nodes[5 + 0]].slice(0, 4), { fill: '#ffb454', duration: 0.3 }, tn);
      // pull back to the whole stack; the card folds into one amber request token
      const tp = c6('needs') - 0.2;
      tl.to('#path-cam', { x: 0, y: 0, scale: 1, duration: 0.5, ease: 'power3.inOut' }, tp);
      tl.to('#path-card', { scale: 0.05, opacity: 0, duration: 0.35, ease: 'power3.in' }, tp);
      tl.to('#path-csvg', { opacity: 0, duration: 0.3 }, tp);
      tl.to('#path-token', { opacity: 1, duration: 0.15 }, tp + 0.3);
      tl.to('#path-token', { y: 1066, duration: 0.4, ease: 'power2.out' }, tp + 0.4);
      KIT.draw(tl, '#path-tr1', tp + 0.4, 0.4);

      // ---- l07: miss at the daemon, miss at the cache, the server has it; sealed copies fill every tier on the way back
      const tm = c7('Misses') - 0.1;
      tl.fromTo('#path-ed', { scale: 1, svgOrigin: '848 1090' }, { scale: 1.25, svgOrigin: '848 1090', duration: 0.15, yoyo: true, repeat: 3 }, tm);
      tl.to('#path-token', { y: 766, duration: 0.5, ease: 'power2.inOut' }, c7('cache') - 0.25);
      KIT.draw(tl, '#path-tr2', c7('cache') - 0.25, 0.5);
      tl.to('#path-cam', { y: 60, duration: 0.6, ease: 'power2.inOut' }, c7('cache') - 0.3);
      tl.fromTo('#path-fc', { opacity: 0 }, { opacity: 0.45, duration: 0.12, yoyo: true, repeat: 1 }, c7('cache') + 0.15);
      tl.fromTo('#path-ec', { scale: 1, svgOrigin: '848 790' }, { scale: 1.25, svgOrigin: '848 790', duration: 0.15, yoyo: true, repeat: 1 }, c7('cache') + 0.2);
      const ts = c7('server') - 0.25;
      tl.to('#path-token', { y: 466, duration: 0.5, ease: 'power2.inOut' }, ts);
      KIT.draw(tl, '#path-tr3', ts, 0.5);
      tl.to('#path-cam', { y: 100, duration: 0.5, ease: 'power2.inOut' }, ts);
      tl.fromTo('#path-fs', { opacity: 0 }, { opacity: 0.55, duration: 0.15, yoyo: true, repeat: 1 }, ts + 0.45);
      KIT.draw(tl, '#path-cloud', ts + 0.3, 0.3);
      tl.to([slots.s.f, slots.s.s], { opacity: 1, duration: 0.2 }, ts + 0.6);
      // "never change": the sealed object comes back down and leaves an identical copy in each tier
      const tv = c7('never') - 0.1;
      KIT.pop(tl, '#path-never', tv - 0.1);
      tl.to('#path-cam', { y: 0, duration: 0.9, ease: 'power2.inOut' }, tv);
      tl.to('#path-token', { y: 1066, duration: 0.7, ease: 'power2.in' }, tv);
      tl.to([slots.c.f, slots.c.s], { opacity: 1, duration: 0.15 }, tv + 0.35);
      tl.fromTo([slots.c.s], { scale: 1.8, svgOrigin: '848 790' }, { scale: 1, svgOrigin: '848 790', duration: 0.3, ease: 'back.out(2)', immediateRender: false }, tv + 0.35);
      tl.to([slots.d.f, slots.d.s], { opacity: 1, duration: 0.15 }, tv + 0.7);
      tl.fromTo([slots.d.s], { scale: 1.8, svgOrigin: '848 1090' }, { scale: 1, svgOrigin: '848 1090', duration: 0.3, ease: 'back.out(2)', immediateRender: false }, tv + 0.7);
      tl.to('#path-token', { y: 1276, opacity: 0, duration: 0.3 }, tv + 0.75);
      tl.to(['#path-tr1', '#path-tr2', '#path-tr3'], { opacity: 0.25, duration: 0.3 }, tv + 0.9);

      // "So any cache can answer": the stack shrinks down, the article's phrase is read above it
      const ta = c7('any') - 0.45;
      tl.to('#path-never', { opacity: 0, duration: 0.2 }, ta);
      tl.fromTo('#path-stack', { scale: 1 }, { scale: 0.6, duration: 0.45, ease: 'power3.inOut' }, ta);
      const ev = KIT.EP.evidence.cache, Wp = 900, X = 90, Y = 400, ph = Wp * ev.h / ev.w, r0 = ev.rects[0];
      const RD = KIT.read(tl, { cam: '#path-rcam', parent: '#path-rstage', hud: '#path-rhud', tagY: 300, id: 'cache', t: ta + 0.1, label: KIT.data('l07').credit,
        x: X, y: Y, width: Wp, zoom: 1, fx: X + r0.x * Wp, fy: Y + (r0.y + r0.h / 2) * ph, follow: 0,
        marks: [[c7('any'), KIT.cueEnd('l07', 'answer'), [[c7('cache', 1), 0.2], [c7('can'), 0.5], [c7('answer'), 0.68]]]] });
      // the card drops, the stack returns, a second job's request is answered by its own daemon
      const tx = KIT.cueEnd('l07', 'answer') + 0.05;
      tl.to(RD.el, { y: 900, opacity: 0, duration: 0.3, ease: 'power3.in' }, tx);
      tl.to('#path-rhud', { opacity: 0, duration: 0.2 }, tx);
      tl.to('#path-stack', { scale: 1, duration: 0.35, ease: 'power3.out' }, tx + 0.05);
      tl.to('#path-token2', { opacity: 1, duration: 0.1 }, tx + 0.1);
      tl.to('#path-token2', { y: 1066, duration: 0.25, ease: 'power2.out' }, tx + 0.12);
      tl.fromTo('#path-fd', { opacity: 0 }, { opacity: 0.6, duration: 0.1, yoyo: true, repeat: 1 }, tx + 0.35);

      window.__timelines["path"] = tl;
    })();
  </script>
</template>
