<template id="result-template">
  <style>

    #result-fig { position: absolute; left: 330px; top: 1350px; padding: 6px 18px; font: 700 40px "Mono", monospace; color: var(--deep); background: var(--amber); white-space: nowrap; }
    #result-split { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

    .result-lab56 { position: absolute; font: 700 56px "Mono", monospace; white-space: nowrap; }
    #result-lold { left: 70px; top: 170px; color: var(--coral); }
    #result-lsc { left: 70px; top: 1160px; color: var(--mint); }
    #result-rcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #result-rstage, #result-rhud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #result-big { position: absolute; left: 0; top: 560px; width: 1080px; text-align: center; font: 400 220px/1 "Marker", sans-serif; color: var(--amber); text-shadow: 12px 12px 0 var(--shadow); white-space: nowrap; }
    #result-scope { position: absolute; left: 90px; top: 850px; width: 840px; text-align: center; font: 700 42px/1.25 "Mono", monospace; color: var(--white); background: var(--deep); border: 3px solid var(--cyan); padding: 10px 14px; }
    #result-scope div:last-child { color: var(--cyan); }

    #result-sqsc-l { position: absolute; left: 768px; top: 1020px; font: 700 52px "Mono", monospace; color: var(--mint); white-space: nowrap; }
    #result-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff7e6; opacity: 0; }
  </style>
  <div id="root" data-composition-id="result" data-width="1080" data-height="1920">
    <div id="result-beat" style="position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 860px"><div id="result-cam">
      <div id="result-tiers">
        <div id="result-b0" class="result-band"><div class="result-name" data-bind="l06.server"></div><div class="result-count" data-bind="l08.hit" data-to=""></div><div class="result-hits" data-bind="l08.label"></div></div>
        <div id="result-b1" class="result-band"><div class="result-name" data-bind="l06.cache"></div><div class="result-count" data-bind="l08.hit" data-to=""></div><div class="result-hits" data-bind="l08.label"></div></div>
        <div id="result-b2" class="result-band"><div class="result-name" data-bind="l06.daemon"></div><div class="result-count" data-bind="l08.hit" data-to=""></div><div class="result-hits" data-bind="l08.label"></div></div>
        <svg class="ink" id="result-dsvg" viewBox="0 0 1080 1920"></svg>
        <div id="result-src" data-bind="l08.src"></div>
      </div>
      <div id="result-clock">
        <svg class="ink" id="result-csvg" viewBox="0 0 1080 1920">
          <circle id="result-dial" cx="540" cy="820" r="380" fill="#071d35" stroke="#a8dcf2" stroke-width="8" />
          <g id="result-ticks"></g>
          <path id="result-wedge" fill="#ff6b6b" d="" />
          <path id="result-sliver" fill="#7be3b0" stroke="#7be3b0" stroke-width="6" stroke-linejoin="round" d="" />
          <path id="result-hand" stroke="#7be3b0" stroke-width="12" stroke-linecap="round" d="M540 820 L540 455" />
          <circle cx="540" cy="820" r="18" fill="#f2f8ff" />
        </svg>
        <div id="result-clab" data-bind="l09.label"></div>
        <div id="result-ngit" data-bind="l09.git"></div>
        <div id="result-nsc" data-bind="l09.scion"></div>

        <div id="result-fig" data-bind="l09.src"></div>
      </div>
      <div id="result-split">
        <div id="result-top"><svg class="ink" id="result-ssvg" viewBox="0 0 1080 1920"><g id="result-field"></g></svg><div id="result-lold" class="result-lab56" data-bind="l10.old"></div></div>
        <div id="result-bot"><svg class="ink" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
          <rect id="result-m0" x="70" y="1240" width="840" height="56" fill="rgba(255,180,84,.18)" stroke="#ffb454" stroke-width="5" />
          <rect id="result-m1" x="70" y="1310" width="840" height="56" fill="rgba(168,220,242,.18)" stroke="#a8dcf2" stroke-width="5" />
          <rect id="result-m2" x="70" y="1380" width="840" height="56" fill="rgba(123,227,176,.18)" stroke="#7be3b0" stroke-width="5" />
        </svg><div id="result-lsc" class="result-lab56" data-bind="l10.scion"></div></div>
      </div>
      <svg class="ink" id="result-qsvg" style="left:0;top:0;width:1080px;height:1920px" viewBox="0 0 1080 1920">
        <rect id="result-sqold" x="60" y="450" width="700" height="700" fill="#ff6b6b" />
        <rect id="result-sqsc" x="800" y="1100" width="50" height="50" fill="#7be3b0" />
      </svg>
      <div id="result-sqold-l" data-bind="l10.sqOld"></div>
      <div id="result-sqsc-l" data-bind="l10.scion"></div>
      <div id="result-big" data-bind="l10.big"></div>
      <div id="result-scope"><div data-bind="l10.scope"></div><div data-bind="l10.scope2"></div></div>
    </div></div>
    <div id="result-rcam"><div id="result-rstage"></div></div>
    <div id="result-rhud"></div>
    <div id="result-flash"></div>
  </div>
  <script>
    (function () {
      const S = 'result', c8 = (w, n) => KIT.cue('l08', w, n), c9 = (w, n) => KIT.cue('l09', w, n), c10 = (w, n) => KIT.cue('l10', w, n), E = KIT.svgEl;
      KIT.bind('#root');
      const tl = gsap.timeline({ paused: true });
      const num = (s) => parseFloat(String(s).replace(/[^\d.]/g, ''));
      const flash = (t, o = 0.22) => tl.fromTo('#result-flash', { opacity: o }, { opacity: 0, duration: 0.35, ease: 'none', immediateRender: false }, t);
      tl.fromTo(['#result-clock', '#result-split', '#result-qsvg', '#result-sqold-l', '#result-sqsc-l', '#result-big', '#result-scope'], { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // ---- l08: three tiers, a 10 x 10 grid each; the grid fills as the counter rolls to over 99%; one dot in a hundred moves on
      const hit = num(KIT.data('l08').value), ds = document.getElementById('result-dsvg'), grids = [], odd = [];
      [200, 600, 1000].forEach((by, b) => {
        const rows = [];
        for (let r = 0; r < 10; r++) { const row = []; for (let k = 0; k < 10; k++) { const idx = r * 10 + k; const last = idx >= Math.round(hit); const e = E('circle', { cx: 618 + k * 30, cy: by + 45 + r * 30, r: 11, fill: last ? '#ffb454' : '#7be3b0', id: `result-d${b}-${idx}` }, ds); (last ? odd : row).push(e); } rows.push(row); }
        grids.push(rows);
      });
      const tA = c8('Anthropic') - 0.1;
      tl.fromTo(['#result-b2', '#result-b1', '#result-b0'], { x: -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out', stagger: 0.12 }, Math.max(0.05, tA - 0.15));
      grids.forEach((rows) => rows.forEach((row) => tl.fromTo(row, { opacity: 0.12 }, { opacity: 0.12, duration: 0.01 }, 0)));
      tl.fromTo(odd, { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      const tn = c8('ninety') - 0.2, tp = c8('percent');
      document.querySelectorAll('.result-count').forEach((el) => { el.dataset.to = KIT.data('l08').hit; });
      KIT.count(tl, '.result-count', tn, Math.max(0.6, tp - tn), { ease: 'power1.inOut' });
      // the counters stay hidden until the count starts: KIT.count's text depends on seek order, and the final value must not show before it is spoken
      tl.fromTo('.result-count', { opacity: 0 }, { opacity: 1, duration: 0.12 }, tn);
      grids.forEach((rows) => rows.forEach((row, r) => tl.to(row, { opacity: 1, duration: 0.12 }, tn + (r / 10) * Math.max(0.6, tp - tn))));
      tl.fromTo('.result-count', { scale: 1 }, { scale: 1.25, duration: 0.12, yoyo: true, repeat: 1, ease: 'power2.out' }, tp + 0.05);
      flash(tp + 0.05, 0.18);
      KIT.shake(tl, '#result-tiers', tp + 0.1, { amp: 12, dur: 0.3 });
      tl.to(odd, { opacity: 1, duration: 0.1 }, tp + 0.15);
      odd.forEach((e, b) => tl.to(e, { y: -400, duration: 0.9, ease: 'power2.inOut' }, tp + 0.35));
      const tt = c8('tier') - 0.4;
      tl.fromTo('#result-cam', { y: -50, scale: 1.04 }, { y: -50, scale: 1.04, duration: 0.01 }, 0);
      tl.to('#result-cam', { y: 50, duration: 1.0, ease: 'power2.inOut' }, tt);

      // ---- l09: the clock wipe for one named operation (new agent worktree, median): about 7 min, then about 5 s
      const tk = document.getElementById('result-ticks');
      for (let i = 0; i < 60; i++) { const a = (i / 60) * 2 * Math.PI, r0 = i % 5 ? 350 : 330; E('path', { d: `M${540 + Math.sin(a) * r0} ${820 - Math.cos(a) * r0} L${540 + Math.sin(a) * 372} ${820 - Math.cos(a) * 372}`, stroke: '#3d78a6', 'stroke-width': i % 5 ? 3 : 6 }, tk); }
      const gitMin = num(KIT.data('l09').gitT), scS = num(KIT.data('l09').scionT), A = 144, sliverA = A * scS / (gitMin * 60);
      const arc = (a0, a1, r = 372) => { if (a1 - a0 < 0.01) return ''; const p = (a) => `${(540 + Math.sin(a * Math.PI / 180) * r).toFixed(1)} ${(820 - Math.cos(a * Math.PI / 180) * r).toFixed(1)}`; return `M540 820 L${p(a0)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p(a1)} Z`; };
      const wg = document.getElementById('result-wedge'), sl = document.getElementById('result-sliver'), st = { a0: 0, a1: 0 };
      const drawW = () => wg.setAttribute('d', arc(st.a0, st.a1));
      const tW = c9('worktree') - 0.45;
      tl.to('#result-tiers', { x: -1100, opacity: 0, duration: 0.4, ease: 'power3.in' }, tW - 0.2);
      tl.to('#result-cam', { y: 0, scale: 1, duration: 0.4, ease: 'power3.inOut' }, tW - 0.2);
      tl.to('#result-clock', { opacity: 1, duration: 0.01 }, tW);
      tl.fromTo('#result-dial', { scale: 0.2, svgOrigin: '540 820' }, { scale: 1, svgOrigin: '540 820', duration: 0.45, ease: 'back.out(1.6)' }, tW);
      tl.fromTo('#result-ticks', { opacity: 0 }, { opacity: 1, duration: 0.3 }, tW + 0.2);
      tl.fromTo('#result-clab', { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35 }, tW + 0.1);
      tl.fromTo('#result-ngit', { x: -200, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, tW + 0.3);
      tl.fromTo('#result-hand', { rotation: 0, svgOrigin: '540 820', opacity: 0 }, { rotation: 0, svgOrigin: '540 820', opacity: 0, duration: 0.01 }, 0);
      const t7 = c9('seven') - 0.15;
      tl.fromTo(st, { a1: 0 }, { a1: A, duration: 0.8, ease: 'power2.inOut', onUpdate: drawW }, t7);
      KIT.pop(tl, '#result-tgit', t7 + 0.5);
      const tN = c9('Now') - 0.1, wipe = Math.max(0.6, c9('five') - tN);
      tl.to('#result-hand', { opacity: 1, duration: 0.05 }, tN);
      tl.to('#result-hand', { rotation: A, duration: wipe, ease: 'power2.inOut' }, tN);
      tl.fromTo(st, { a0: 0 }, { a0: A, duration: wipe, ease: 'power2.inOut', onUpdate: drawW, immediateRender: false }, tN);
      tl.to('#result-hand', { rotation: sliverA, duration: 0.25, ease: 'power3.out' }, tN + wipe);
      tl.to('#result-hand', { opacity: 0, duration: 0.2 }, tN + wipe + 0.25);
      const t5 = c9('five');
      tl.fromTo(sl, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t5);
      sl.setAttribute('d', arc(0, Math.max(sliverA, 0.02)));
      KIT.pop(tl, '#result-tsc', t5);
      tl.fromTo('#result-nsc', { scale: 2.4, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.2, ease: 'power4.in' }, t5 + 0.1);
      KIT.fade(tl, '#result-fig', t5 + 0.3);
      tl.to('#result-cam', { scale: 1.1, duration: 0.6, ease: 'power2.out' }, c9('seconds') - 0.1);

      // ---- l10: old Git mirrors above Scion, the article's sentence between them, then the drawn 200 to 1 area comparison
      const fg = document.getElementById('result-field');
      for (let r = 0; r < 5; r++) for (let k = 0; k < 13; k++) { const x = 72 + k * 66, y = 250 + r * 62; const g = E('g', {}, fg); E('rect', { x, y, width: 50, height: 54, rx: 6, fill: '#0a2340', stroke: '#ff6b6b', 'stroke-width': 3 }, g); E('rect', { x: x + 10, y: y + 12, width: 11, height: 34, fill: '#ff6b6b' }, g); E('rect', { x: x + 29, y: y + 12, width: 11, height: 34, fill: '#ff6b6b' }, g); }
      const tS = Math.max(c10('Scion') - 0.35, tN + wipe + 0.6);
      tl.to('#result-clock', { opacity: 0, y: -200, duration: 0.3, ease: 'power2.in' }, tS);
      tl.to('#result-cam', { scale: 1, duration: 0.3 }, tS);
      tl.to('#result-split', { opacity: 1, duration: 0.01 }, tS + 0.1);
      tl.fromTo('#result-top', { y: -500 }, { y: 180, duration: 0.4, ease: 'power3.out' }, tS + 0.1);
      tl.fromTo('#result-bot', { y: 600 }, { y: -200, duration: 0.4, ease: 'power3.out' }, tS + 0.15);
      const t2 = c10('two') - 0.35;
      tl.to('#result-top', { y: -20, duration: 0.4, ease: 'power3.inOut' }, t2);
      tl.to('#result-bot', { y: 0, duration: 0.4, ease: 'power3.inOut' }, t2);
      const ev = KIT.EP.evidence.footprint, Wp = 900, X = 130, Y = 862, ph = Wp * ev.h / ev.w, r0 = ev.rects[0];
      const RD = KIT.read(tl, { cam: '#result-rcam', parent: '#result-rstage', hud: '#result-rhud', id: 'footprint', t: t2 + 0.05,
        x: X, y: Y, width: Wp, zoom: 1, fx: X + r0.x * Wp, fy: Y + (r0.y + r0.h / 2) * ph, follow: 0,
        marks: [[c10('two'), KIT.cueEnd('l10', 'smaller'), [[c10('smaller'), 0.42]]], [c10('C'), KIT.cueEnd('l10', 'memory'), [[c10('and'), 0.3], [c10('memory'), 0.57]]]] });
      const tth = c10('than') - 0.1;
      tl.to(RD.el, { scale: 0.6, opacity: 0, duration: 0.25, ease: 'power3.in' }, tth - 0.2);   // fades in place: a drop would cross the button zone
      tl.to('#result-rhud', { opacity: 0, duration: 0.2 }, tth - 0.2);
      // 200x lands on "two hundred"; the article's sentence is read under it; the scope tag takes the card's place on "than"
      const tTwo = c10('two') - 0.15;
      tl.to('#result-big', { opacity: 1, duration: 0.01 }, tTwo);
      const ti = KIT.slam(tl, '#result-big', tTwo, { amp: 16 });
      flash(ti, 0.22);
      tl.to('#result-scope', { opacity: 1, duration: 0.01 }, tth + 0.05);
      tl.fromTo('#result-scope', { y: 60 }, { y: 0, duration: 0.3, ease: 'back.out(2)' }, tth + 0.05);
      // area comparison: side ratio is the square root of the reported ratio
      const ratio = num(KIT.data('l10').value), side = 700, small = side / Math.sqrt(ratio);
      const sq = document.getElementById('result-sqsc'); sq.setAttribute('width', small.toFixed(1)); sq.setAttribute('height', small.toFixed(1)); sq.setAttribute('y', (1150 - small).toFixed(1));
      const tm = c10('mirrors') - 0.35;
      tl.to('#result-split', { opacity: 0, duration: 0.3 }, tm);
      tl.to('#result-big', { y: -410, scale: 0.85, duration: 0.45, ease: 'power3.inOut' }, tm);
      tl.to('#result-scope', { y: 370, duration: 0.45, ease: 'power3.inOut' }, tm);
      tl.to('#result-qsvg', { opacity: 1, duration: 0.01 }, tm + 0.1);
      tl.fromTo('#result-sqold', { scale: 0, svgOrigin: '60 1150' }, { scale: 1, svgOrigin: '60 1150', duration: 0.6, ease: 'power3.out' }, tm + 0.1);
      tl.fromTo('#result-sqsc', { scale: 0, svgOrigin: '800 1150' }, { scale: 1, svgOrigin: '800 1150', duration: 0.3, ease: 'back.out(3)' }, tm + 0.6);
      tl.to(['#result-sqold-l', '#result-sqsc-l'], { opacity: 1, duration: 0.3, stagger: 0.15 }, tm + 0.55);
      tl.to('#result-cam', { scale: 0.94, duration: 0.6, ease: 'power2.inOut' }, tm + 0.8);

      KIT.beats(tl, '#result-beat', [c10('hundred'), c10('smaller'), c10('C'), c10('memory')], { amp: 0.03, shift: 18, reset: c10('than') - 0.2 });
      window.__timelines["result"] = tl;
    })();
  </script>
</template>
