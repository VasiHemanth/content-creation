  <script>
    (function () {
      const S = 'board', D = KIT.sceneDur(S), E = KIT.svgEl, W = '#board-world';
      const c = (l, w, n) => KIT.cue(l, w, n), ce = (l, w, n) => KIT.cueEnd(l, w, n), st = (l) => KIT.cue(l, 0), en = (l) => KIT.cue(l, 'end');
      KIT.bind('#root');
      const tl = gsap.timeline({ paused: true });
      const out = (sel, t, d = 0.3) => tl.to(sel, { opacity: 0, duration: d, ease: 'power1.in' }, t);
      // Camera with a floor: the lowest actor on the board at time t must stay above the caption band (y 1490).
      // Screen y of world point Y is 960 + s * (Y - py), so the floor needs py >= floor - 470 / s (470 leaves room for
      // the beat wrapper). If the wanted shot sits too high for that, zoom out until the target and the floor both fit.
      const tMachine = KIT.cue('l04', 0) - 0.7;   // the camera settles on the l04 shot before the machine rises
      const floorAt = (t) => (t < tMachine ? 700 : t < KIT.cue('l20', 0) ? 1430 : 1345);
      const focus = (t, px, py, s, dur = 0.9) => {
        const fl = floorAt(t); let s2 = s;
        if (py < fl - 470 / s) s2 = Math.min(s, 980 / (fl - py));
        const py2 = Math.max(py, fl - 470 / s2);
        KIT.focus(tl, W, t, { px, py: py2, s: s2, dur });
      };
      const beatTimes = [];
      const beat = (t) => beatTimes.push(t);

      // ---- elements hidden at load (each animated in once with fromTo below) ----
      const later = ['#board-agents-tag', '#board-server', '#board-mach', '#board-ci', '#board-copy', '#board-checkout', '#board-offline', '#board-noconn', '#board-most', '#board-films',
        '#board-rate', '#board-ratetag', '#board-mult', '#board-iftag', '#board-total', '#board-totalgb', '#board-online', '#board-where', '#board-nofull', '#board-only',
        '#board-tree1', '#board-tree2', '#board-ca', '#board-same', '#board-saved', '#board-ok', '#board-sideL', '#board-sideR', '#board-shared', '#board-t1', '#board-t2', '#board-t3', '#board-tiers',
        '#board-hit', '#board-r99a', '#board-r99b', '#board-power', '#board-mem', '#board-memsub', '#board-lap', '#board-film', '#board-lock', '#board-f0', '#board-f1', '#board-f2', '#board-f3', '#board-fix'];
      gsap.set(later, { opacity: 0 });   // hidden before the timeline runs (a tl.set at 0 does not render at frame 0)
      ['#board-arrow', '#board-wire', '#board-check', '#board-w1', '#board-w2', '#board-w3', '#board-col', '#board-tlink', '#board-qlink', '#board-nosig'].forEach((p) => gsap.set(p, { drawSVG: '0%' }));

      // ---- l02: Scion named, the store draws on, folders rise, it becomes the monorepo ----
      // frame 0 of the board shows the hook's GIT box where it stood (the hook camera ends at scale 1.07)
      gsap.set('#board-store', { '--role': getComputedStyle(document.documentElement).getPropertyValue('--role-old').trim() });
      // the store sits at its final place; a transform maps it onto the GIT box (368, 467, 344 x 220) until "one store"
      const SX = 344 / 680, SY = 220 / 235;
      gsap.set(['#board-st-git', '#board-st-scion'], { scaleX: 1 / SX, scaleY: 1 / SY, transformOrigin: '50% 50%' });
      tl.fromTo('#board-store', { x: 168, y: 82, scaleX: SX, scaleY: SY, transformOrigin: '0 0' }, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 1.0, ease: 'power3.inOut' }, c('l02', 'All') - 0.05);
      tl.to('#board-st-git', { y: -8, duration: 0.15, yoyo: true, repeat: 1 }, c('l02', 'built'));
      KIT.recolor(tl, '#board-store', c('l02', 'Scion') - 0.15, 'new', { dur: 0.35 });
      KIT.swap(tl, '#board-st-git', '#board-st-scion', c('l02', 'Scion') - 0.15);
      KIT.sparks(tl, W, 540, 577, c('l02', 'Scion'), { color: '#c3a6ff', n: 12, r: 240 });
      tl.to('#board-st-scion', { opacity: 0, duration: 0.25 }, c('l02', 'All') + 0.05);
      KIT.recolor(tl, '#board-store', c('l02', 'All'), 'store', { dur: 0.6 });
      KIT.fade(tl, '#board-st-one', c('l02', 'code'));
      tl.fromTo(['#board-f0', '#board-f1', '#board-f2', '#board-f3'], { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.12, ease: 'back.out(2)' }, c('l02', 'code') + 0.1);
