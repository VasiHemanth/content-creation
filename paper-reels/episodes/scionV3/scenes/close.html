<template id="close-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #close-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 800px; }
    #close-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    .close-tag { position: absolute; padding: 8px 16px; font: 700 30px "Mono", monospace; background: var(--deep); border: 3px solid currentColor; white-space: nowrap; }
    .close-box { box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 96px; }
    #close-title { left: 60px; top: 300px; width: 960px; text-align: center; white-space: normal; font-size: 112px; line-height: 1.04; text-shadow: 8px 8px 0 var(--shadow); }
    #close-title .char, #close-title .word { display: inline-block; }
    #close-answer { left: 60px; top: 690px; width: 960px; text-align: center; white-space: normal; font-size: 92px; line-height: 1.06; color: var(--amber); text-shadow: 8px 8px 0 var(--shadow); }
    #close-answer .char, #close-answer .word { display: inline-block; }
    #close-handle { left: 0; top: 1220px; width: 1080px; text-align: center; }
    #close-handle span { display: inline-block; padding: 12px 32px; font: 700 50px "Mono", monospace; color: var(--amber); background: var(--deep); border: 4px solid var(--amber); box-shadow: 10px 10px 0 var(--shadow); }
    #close-credit { left: 0; top: 1330px; width: 1080px; text-align: center; font-size: 26px; }
    #close-rcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #close-rstage, #close-rhud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="close" data-width="1080" data-height="1920">
    <div id="close-cam">
      <div id="close-own" class="close-tag" style="left:60px; top:200px; color:var(--amber);" data-bind="l25.own"></div>
      <div id="close-cols">
        <div id="close-scion" class="actor new close-box" style="left:90px; top:620px; width:400px; height:220px;" data-bind="l25.scion"></div>
        <div id="close-largest" class="close-tag" style="left:90px; top:870px; color:var(--role-new);" data-bind="l25.largest"></div>
        <div id="close-git" class="actor old close-box" style="left:560px; top:620px; width:360px; height:220px;" data-bind="l25.git"></div>
        <div id="close-normal" class="close-tag" style="left:560px; top:870px; color:var(--role-old);" data-bind="l25.normal"></div>
        <div id="close-small" class="close-tag" style="left:560px; top:940px; color:var(--white); font-size:26px;" data-bind="l25.small"></div>
        <svg class="ink" id="close-svg" viewBox="0 0 1080 1920">
          <g id="close-mono">
            <rect x="120" y="1010" width="340" height="230" fill="rgba(195,166,255,.12)" stroke="#c3a6ff" stroke-width="5" />
            <path d="M150 1040 L430 1040 M150 1080 L430 1080 M150 1120 L430 1120 M150 1160 L430 1160 M150 1200 L430 1200" stroke="#c3a6ff" stroke-width="4" opacity=".6" />
          </g>
          <g id="close-lap">
            <rect x="640" y="1040" width="200" height="124" rx="10" fill="#0a2340" stroke="#f2f8ff" stroke-width="5" />
            <path d="M620 1178 L860 1178 L845 1194 L636 1194 Z" fill="#0a2340" stroke="#f2f8ff" stroke-width="5" stroke-linejoin="round" />
            <rect x="700" y="1080" width="70" height="40" fill="#ff6b6b" opacity="0.85" />
          </g>
          <path id="close-ok" class="ln mint heavy" d="M690 1110 L725 1145 L800 1060" />
        </svg>
      </div>
      <div id="close-title" class="hd" data-bind="l26.title"></div>
      <div id="close-answer" class="hd" data-bind="l26.answer"></div>
      <div id="close-handle" class="abs"><span data-bind="l26.handle"></span></div>
      <div id="close-credit" class="lbl" data-bind="l26.credit"></div>
    </div>
    <div id="close-rcam"><div id="close-rstage"></div></div>
    <div id="close-rhud"></div>
  </div>
  <script>
    (function () {
      const S = 'close', D = KIT.sceneDur(S), c = (l, w, n) => KIT.cue(l, w, n), ce = (l, w, n) => KIT.cueEnd(l, w, n);
      KIT.bind('#close-cam');
      const tl = gsap.timeline({ paused: true });
      gsap.set(['#close-title', '#close-answer', '#close-handle', '#close-credit', '#close-largest', '#close-normal', '#close-small', '#close-mono', '#close-lap'], { opacity: 0 });
      gsap.set('#close-ok', { drawSVG: '0%' });

      // ---- l25: Anthropic's own numbers; the receipt; Scion for the largest monorepos, Git for normal projects ----
      tl.fromTo('#close-own', { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 0.1);
      tl.fromTo(['#close-scion', '#close-git'], { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.15, ease: 'back.out(1.8)' }, 0.25);
      const rdT = c('l25', 'Scion') - 0.3, Wp = 1000, X0 = 40, Y0 = 700;
      const R = KIT.read(tl, { cam: '#close-rcam', parent: '#close-rstage', hud: '#close-rhud', tagY: 420, id: 'enormous', t: rdT, label: KIT.data('l25').src,
        x: X0, y: Y0, width: Wp, zoom: 1.75, fx: 90, fy: 820, follow: 0,
        marks: [[c('l25', 'only'), ce('l25', 'monorepos'), [[c('l25', 'largest'), 0.55]]]] });
      tl.fromTo('#close-cols', { opacity: 1 }, { opacity: 0.12, duration: 0.25 }, rdT);
      const back = ce('l25', 'monorepos') + 0.05;
      tl.to(R.el, { y: 900, opacity: 0, duration: 0.3, ease: 'power3.in' }, back);
      tl.to(`#${R.el.id}-tag`, { opacity: 0, duration: 0.2 }, back);
      tl.to('#close-rcam', { x: 0, y: 0, scale: 1, duration: 0.01 }, back + 0.35);
      tl.to('#close-cols', { opacity: 1, duration: 0.3 }, back + 0.05);
      tl.to(['#close-largest', '#close-mono'], { opacity: 1, duration: 0.3 }, back + 0.1);
      tl.to(['#close-normal', '#close-lap'], { opacity: 1, duration: 0.3 }, c('l25', 'Normal') - 0.1);
      tl.to('#close-small', { opacity: 1, duration: 0.3 }, c('l25', 'small') - 0.1);
      tl.to('#close-cam', { scale: 1.06, duration: 0.5, ease: 'power3.out' }, c('l25', 'Normal') - 0.2);
      // "Normal projects have small copies": the Scion column steps back while the Git side is described
      tl.to(['#close-scion', '#close-largest', '#close-mono'], { opacity: 0.25, duration: 0.3 }, c('l25', 'Normal') - 0.1);
      tl.to('#close-cam', { scale: 1.14, duration: 0.35, ease: 'power3.out' }, c('l25', 'copies') - 0.1);
      tl.to('#close-cam', { scale: 1.06, duration: 0.35, ease: 'power3.inOut' }, c('l25', 'right') + 0.1);
      tl.to('#close-lap', { scale: 1.25, transformOrigin: '740px 1110px', duration: 0.2, yoyo: true, repeat: 1 }, c('l25', 'small'));
      tl.to(['#close-scion', '#close-largest', '#close-mono'], { opacity: 1, duration: 0.3 }, c('l25', 'right') + 0.2);
      KIT.draw(tl, '#close-ok', c('l25', 'right') - 0.15, 0.3);
      tl.to('#close-git', { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1 }, c('l25', 'right'));

      // ---- l26: the hook title returns in the same place; the answer slams ----
      const t26 = KIT.cue('l26', 0);
      tl.to(['#close-cols', '#close-own'], { opacity: 0, y: 60, duration: 0.35, ease: 'power2.in' }, t26);
      tl.to('#close-cam', { scale: 1, duration: 0.4, ease: 'power3.inOut' }, t26);
      const st = SplitText.create('#close-title', { type: 'words,chars' });
      st.chars.forEach((ch) => ch.setAttribute('data-layout-allow-overlap', ''));
      tl.to('#close-title', { opacity: 1, duration: 0.01 }, c('l26', 'why') - 0.15);
      tl.fromTo(st.chars, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, stagger: 0.02, ease: 'back.out(2)' }, c('l26', 'why') - 0.15);
      const sa = SplitText.create('#close-answer', { type: 'words,chars' });
      sa.chars.forEach((ch) => ch.setAttribute('data-layout-allow-overlap', ''));
      tl.to('#close-answer', { opacity: 1, duration: 0.01 }, c('l26', 'machines') - 0.2);
      tl.fromTo(sa.chars, { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, stagger: 0.02, ease: 'power4.in' }, c('l26', 'machines') - 0.2);
      KIT.shake(tl, '#close-cam', c('l26', 'always') + 0.1, { amp: 12, dur: 0.25 });
      tl.to('#close-handle', { opacity: 1, duration: 0.01 }, c('l26', 'online') - 0.1);
      KIT.rise(tl, '#close-handle span', c('l26', 'online') - 0.1, { y: 40 });
      tl.to('#close-credit', { opacity: 1, duration: 0.4 }, c('l26', 'online') + 0.3);
      tl.to('#close-cam', { scale: 1.04, duration: 2, ease: 'sine.inOut' }, c('l26', 'online'));
      window.__timelines["close"] = tl;
    })();
  </script>
</template>
