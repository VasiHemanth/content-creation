<template id="result-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #re-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 760px; }
    #re-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #re-title { left: 90px; top: 392px; width: 880px; font: 700 36px/1.2 "Mono", monospace; color: var(--white); white-space: normal; }
    #re-nb { left: 130px; top: 538px; font-size: 30px; }
    #re-ns { left: 130px; top: 718px; font-size: 30px; }
    #re-x0 { left: 118px; top: 918px; font-size: 28px; }
    #re-x1 { left: 713px; top: 1030px; font-size: 28px; }
    #re-big { left: 0; top: 1130px; width: 1080px; text-align: center; font: 400 96px/1.1 "Marker", sans-serif; color: var(--amber); text-shadow: 8px 8px 0 var(--shadow); white-space: nowrap; }
    #re-chips { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #re-chip1 { left: 60px; top: 170px; font-size: 30px; }
    #re-chip2 { left: 60px; top: 236px; font-size: 28px; }
    #re-chip3 { left: 60px; top: 302px; font-size: 28px; }
    #re-src { left: 60px; top: 1392px; font-size: 26px; color: var(--dim); }
    #re-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="result" data-width="1080" data-height="1920">
    <div id="re-cam"><div id="re-shk" class="fill">
      <svg id="re-svg" class="ink" viewBox="0 0 1080 1920"></svg>
      <div id="re-title" class="abs" data-bind="l11.title"></div>
      <div id="re-nb" class="lbl" data-bind="l11.nb"></div>
      <div id="re-ns" class="lbl amber" data-bind="l11.ns"></div>
      <div id="re-x0" class="lbl" data-bind="l11.x0"></div>
      <div id="re-x1" class="tag cyan" data-bind="l11.x1"></div>
      <div id="re-big" class="abs" data-bind="l11.big"></div>
    </div></div>
    <div id="re-chips">
      <div id="re-chip1" class="tag cyan" data-bind="l11.chip1"></div>
      <div id="re-chip2" class="tag cyan" data-bind="l11.chip2"></div>
      <div id="re-chip3" class="tag cyan" data-bind="l11.chip3"></div>
      <div id="re-src" class="lbl" data-bind="l11.src"></div>
    </div>
    <div id="re-flash"></div>
  </div>
  <script>
    (function () {
      const c = (w, n) => KIT.cue('l11', w, n), D = KIT.sceneDur('result');
      KIT.bind('#root');
      const tl = gsap.timeline({ paused: true });
      const d = KIT.data('l11');
      const svg = document.getElementById('re-svg'), E = (tag, at, p) => KIT.svgEl(tag, at, p || svg);
      const pulse = (t, o = 0.18) => tl.fromTo('#re-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);

      // tokens axis: 0 at x 130, the 1B budget at x 900; bar lengths come from the storyboard token counts
      const X0 = 130, X1 = 900, xOf = (v) => X0 + (X1 - X0) * v / d._axis, xb = xOf(d._base), xs = xOf(d._sla);
      E('path', { id: 're-axis', d: `M${X0} 900 H${X1}`, class: 'ln dim thick' });
      E('path', { id: 're-tick', d: `M${X0} 884 V916 M${X1} 884 V916`, class: 'ln dim thick' });
      E('rect', { id: 're-trackb', x: X0, y: 590, width: X1 - X0, height: 80, fill: '#0a2340' });
      E('rect', { id: 're-tracks', x: X0, y: 770, width: X1 - X0, height: 80, fill: '#0a2340' });
      const barB = E('rect', { id: 're-barb', x: X0, y: 590, width: xb - X0, height: 80, fill: '#a8dcf2' });
      const barS = E('rect', { id: 're-bars', x: X0, y: 770, width: xs - X0, height: 80, fill: '#ffb454' });
      const dotB = E('circle', { id: 're-dotb', cx: xb, cy: 630, r: 20, fill: '#f2f8ff', stroke: '#071d35', 'stroke-width': 5 });
      const dotS = E('circle', { id: 're-dots', cx: xs, cy: 810, r: 20, fill: '#f2f8ff', stroke: '#071d35', 'stroke-width': 5 });
      const vB = E('path', { id: 're-vb', d: `M${xb} 670 V1000`, class: 'ln white thick dash' });
      const vS = E('path', { id: 're-vs', d: `M${xs} 850 V1000`, class: 'ln white thick dash' });
      const brk = E('rect', { id: 're-brk', x: xs, y: 992, width: xb - xs, height: 18, rx: 9, fill: '#ffb454' });

      tl.fromTo('#re-cam', { scale: 1.06 }, { scale: 1, duration: 1, ease: 'power3.out' }, 0);
      KIT.draw(tl, ['#re-axis', '#re-tick'], 0.05, 0.4);
      tl.fromTo(['#re-trackb', '#re-tracks'], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.05);
      KIT.rise(tl, '#re-title', 0.08, { y: 24 });
      KIT.fade(tl, ['#re-x0', '#re-x1'], 0.3);
      pulse(0.05, 0.12);
      // "one kernel task": scope chips
      KIT.rise(tl, '#re-chip1', c('kernel') - 0.1, { x: -40, y: 0 });
      KIT.rise(tl, '#re-chip2', c('task'), { x: -40, y: 0 });
      pulse(c('kernel'), 0.12);
      KIT.pop(tl, '#re-ns', c('method') - 0.05, { from: 0.4 });
      // "the strongest baseline's final result": its bar runs out to the tokens it needed
      KIT.fade(tl, '#re-nb', c('strongest') - 0.1);
      tl.fromTo(barB, { scaleX: 0, svgOrigin: `${X0} 630` }, { scaleX: 1, svgOrigin: `${X0} 630`, duration: 1.0, ease: 'power2.inOut' }, c('strongest'));
      tl.to('#re-cam', { scale: 1.07, x: 0, y: 70, duration: 0.6, ease: 'power3.out' }, c('strongest'));
      tl.fromTo(dotB, { scale: 0, svgOrigin: `${xb} 630` }, { scale: 1, svgOrigin: `${xb} 630`, duration: 0.25, ease: 'back.out(3)' }, c('final') - 0.1);
      KIT.draw(tl, vB, c('final'), 0.35);
      pulse(c('strongest'), 0.12); pulse(c('final'), 0.12);
      // "result": SLA reaches the same result much sooner
      tl.fromTo(barS, { scaleX: 0, svgOrigin: `${X0} 810` }, { scaleX: 1, svgOrigin: `${X0} 810`, duration: 0.35, ease: 'power3.out' }, c('result') - 0.25);
      tl.fromTo(dotS, { scale: 0, svgOrigin: `${xs} 810` }, { scale: 1, svgOrigin: `${xs} 810`, duration: 0.25, ease: 'back.out(3)' }, c('result') + 0.1);
      KIT.draw(tl, vS, c('result') + 0.1, 0.3);
      pulse(c('result'));
      // "It used over eighty four percent fewer tokens": the gap between the two, then the number
      tl.to('#re-cam', { scale: 1, x: 0, y: 0, duration: 0.45, ease: 'power3.inOut' }, c('used') - 0.2);
      tl.fromTo(brk, { scaleX: 0, svgOrigin: `${xb} 1001` }, { scaleX: 1, svgOrigin: `${xb} 1001`, duration: 0.5, ease: 'power2.out' }, c('used'));
      KIT.rise(tl, '#re-chip3', c('over') - 0.1, { x: -40, y: 0 });
      pulse(c('over'), 0.12);
      KIT.slam(tl, '#re-big', c('eighty') - 0.1, { from: 2.4, shakeTarget: '#re-shk', amp: 14 });
      pulse(c('eighty'));
      KIT.fade(tl, '#re-src', c('tokens') - 0.2, { to: 0.9 });
      tl.to('#re-cam', { scale: 1.04, duration: D - c('tokens'), ease: 'sine.out' }, c('tokens'));
      window.__timelines["result"] = tl;
    })();
  </script>
</template>
