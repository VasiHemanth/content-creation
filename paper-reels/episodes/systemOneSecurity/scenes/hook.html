<template id="hook-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #hook-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 900px; }
    #hook-bigs { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; transform-origin: 540px 360px; }
    .hook-big { position: absolute; left: 0; width: 1080px; text-align: center; font: 400 104px/1 "Marker", sans-serif; color: var(--white); white-space: nowrap; text-shadow: 8px 8px 0 var(--shadow); }
    #hook-b1 { top: 210px; }
    #hook-b2 { top: 340px; color: var(--amber); }
    #hook-b3 { top: 462px; color: var(--amber); }
    #hook-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #hook-card { position: absolute; left: 150px; top: 1010px; width: 280px; height: 190px; background: var(--panel); border: 5px solid var(--white); border-radius: 12px; box-shadow: 10px 10px 0 var(--shadow); overflow: hidden; }
    .hook-bar { position: absolute; left: 26px; height: 16px; border-radius: 8px; background: var(--dim); }
    #hook-hookmark { position: absolute; left: 200px; top: 96px; width: 60px; height: 82px; opacity: 0; }
    #hook-xray { position: absolute; left: -90px; top: 0; width: 80px; height: 190px; background: linear-gradient(90deg, rgba(168,220,242,0), rgba(168,220,242,.75), rgba(168,220,242,0)); opacity: 0; }
    #hook-inp { left: 150px; top: 948px; font-size: 28px; }
    #hook-judge { left: 470px; top: 700px; font-size: 30px; }
    #hook-agent { left: 700px; top: 1300px; font-size: 28px; }
    #hook-stamp { left: 130px; top: 980px; font-size: 64px; padding: 0 22px; border-width: 7px; outline-width: 3px; outline-offset: -16px; color: var(--cyan); border-color: var(--cyan); outline-color: var(--cyan); opacity: 0; }
    #hook-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-cam">
      <div id="hook-bigs">
        <div id="hook-b1" class="hook-big" data-bind="l01.b1"></div>
        <div id="hook-b2" class="hook-big" data-bind="l01.b2"></div>
        <div id="hook-b3" class="hook-big" data-bind="l01.b3" data-layout-allow-overlap></div>
      </div>
      <svg id="hook-svg" class="ink sketch" viewBox="0 0 1080 1920">
        <path class="ln dim thick" d="M70 1236 L930 1236" />
        <circle class="ln faint" cx="120" cy="1262" r="20" /><circle class="ln faint" cx="300" cy="1262" r="20" />
        <circle class="ln faint" cx="480" cy="1262" r="20" /><circle class="ln faint" cx="660" cy="1262" r="20" />
        <g id="hook-gate"><rect class="fl panel" x="560" y="1010" width="20" height="226" /><rect class="ln cyan thick" x="560" y="1010" width="20" height="226" /></g>
        <g id="hook-arm"><rect class="fl panel" x="262" y="620" width="56" height="300" /><rect class="ln thick" x="262" y="620" width="56" height="300" /><rect class="fl cyan" x="226" y="906" width="128" height="36" rx="6" /></g>
      </svg>
      <div id="hook-card">
        <div class="hook-bar" style="top:34px;width:200px"></div>
        <div class="hook-bar" style="top:70px;width:150px"></div>
        <div class="hook-bar" style="top:106px;width:180px"></div>
        <div class="hook-bar" style="top:142px;width:120px"></div>
        <svg id="hook-hookmark" viewBox="0 0 70 96"><path d="M44 6 L44 62 C44 84 12 84 12 62 L12 52" fill="none" stroke="#ffb454" stroke-width="10" stroke-linecap="round" /><path d="M12 52 L2 64 M12 52 L22 62" fill="none" stroke="#ffb454" stroke-width="8" stroke-linecap="round" /></svg>
        <div id="hook-xray"></div>
      </div>
      <div id="hook-stamp" class="stamp" data-bind="l01.stamp"></div>
      <div id="hook-inp" class="tag cyan" data-bind="l01.inp"></div>
      <div id="hook-judge" class="tag" data-bind="l01.judge"></div>
      <div id="hook-agent" class="tag cyan" data-bind="l01.agent"></div>
    </div>
    <div id="hook-flash"></div>
  </div>
  <script>
    (function () {
      const c = (w, n) => KIT.cue('l01', w, n), D = KIT.sceneDur('hook');
      KIT.bind('#hook-cam');
      const tl = gsap.timeline({ paused: true });
      const pulse = (t, o = 0.2) => tl.fromTo('#hook-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);
      const R = KIT.robot('#hook-svg', { id: 'hkbot', x: 800, y: 1010, s: 0.78, eye: '#a8dcf2' });

      // 0.0 s: the question in big type is already on screen at full opacity; it only settles in scale
      tl.fromTo('#hook-bigs', { scale: 1.12 }, { scale: 1, duration: 0.25, ease: 'power2.out' }, 0);
      pulse(0.04, 0.16);
      tl.fromTo('#hook-card', { x: -60 }, { x: 0, duration: 0.6, ease: 'power3.out' }, 0.05);
      // "judge": the stamp arm comes down on the card, "safe": SAFE lands
      tl.fromTo('#hook-arm', { y: 0 }, { y: 120, duration: 0.25, ease: 'power3.in' }, c('judge') - 0.05);
      tl.to('#hook-arm', { y: 0, duration: 0.35, ease: 'power2.out' }, c('safe') + 0.1);
      KIT.slam(tl, '#hook-stamp', c('safe') - 0.12, { from: 2.2, shakeTarget: '#hook-cam', amp: 10 });
      pulse(c('safe'));
      // the stamped card glides through the open gate toward the agent
      tl.to('#hook-gate', { y: -240, duration: 0.3, ease: 'power2.out' }, c('safe') + 0.2);
      tl.to(['#hook-card', '#hook-stamp'], { x: 250, duration: 0.7, ease: 'power2.inOut' }, c('safe') + 0.3);
      // "trust": an x-ray sweep crosses the card and an amber hook glows inside it
      tl.fromTo('#hook-xray', { x: 0, opacity: 0 }, { x: 420, opacity: 1, duration: 0.45, ease: 'none', immediateRender: false }, c('trust') - 0.05);
      tl.fromTo('#hook-hookmark', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.5)' }, c('trust') + 0.15);
      tl.to(R.eyes, { fill: '#ffb454', duration: 0.2 }, c('trust') + 0.2);
      pulse(c('trust'), 0.24);
      // the question mark line wiggles
      tl.to('#hook-b3', { rotation: -4, duration: 0.08, yoyo: true, repeat: 3, ease: 'sine.inOut', transformOrigin: '50% 60%' }, c('it') + 0.1);
      tl.fromTo('#hook-cam', { scale: 1 }, { scale: 1.04, duration: D, ease: 'sine.inOut', immediateRender: false }, 0.25);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
