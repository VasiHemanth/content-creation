<template id="close-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #cl-shk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #cl-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #cl-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #cl-ghost { position: absolute; left: 0; top: 0; width: 1080px; height: 640px; opacity: 0; }
    .cl-big { position: absolute; left: 0; width: 1080px; text-align: center; font: 400 90px/1 "Marker", sans-serif; color: var(--white); white-space: nowrap; }
    #cl-g1 { top: 150px; } #cl-g2 { top: 272px; }
    #cl-g3 { top: 400px; color: var(--amber); font-size: 94px; } #cl-g4 { top: 524px; color: var(--amber); font-size: 94px; }
    #cl-ctl { left: 620px; top: 470px; font-size: 32px; }
    #cl-end { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #cl-plate { position: absolute; left: 110px; top: 1250px; width: 810px; height: 200px; background: var(--deep); border: 4px solid var(--amber); box-shadow: 10px 10px 0 var(--shadow); }
    #cl-handle { left: 110px; top: 1282px; width: 810px; text-align: center; font: 400 84px/1 "Marker", sans-serif; color: var(--amber); white-space: nowrap; }
    #cl-credit { left: 110px; top: 1392px; width: 810px; text-align: center; font: 600 28px "Mono", monospace; color: var(--cyan); white-space: nowrap; }
    #cl-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="close" data-width="1080" data-height="1920">
    <div id="cl-shk"><div id="cl-cam">
      <div id="cl-ghost">
        <div id="cl-g1" class="cl-big" data-bind="l15.g1"></div>
        <div id="cl-g2" class="cl-big" data-bind="l15.g2"></div>
        <div id="cl-g3" class="cl-big" data-bind="l15.g3"></div>
        <div id="cl-g4" class="cl-big" data-bind="l15.g4"></div>
      </div>
      <svg id="cl-svg" class="ink" viewBox="0 0 1080 1920"></svg>
      <div id="cl-ctl" class="tag cyan" data-bind="l15.ctl"></div>
    </div></div>
    <div id="cl-end">
      <div id="cl-plate"></div>
      <div id="cl-handle" class="abs" data-bind="l15.handle"></div>
      <div id="cl-credit" class="abs" data-bind="l15.credit"></div>
    </div>
    <div id="cl-flash"></div>
  </div>
  <script>
    (function () {
      // railway drawings shared by every scene of this episode (inlined per scene; the first scene to load defines it)
      window.RAIL = window.RAIL || (function () {
        const S = KIT.svgEl, INK = '#f2f8ff', DEEP = '#0a2340', CY = '#a8dcf2';
        const wrap = (parent, id, x, y, s) => { const g = S('g', { id }, parent); const ig = S('g', { transform: `translate(${x} ${y}) scale(${s})` }, g); return { g, ig }; };
        // side view, facing right; (x, y) = rail level under the cab; about 310 x 165 at s = 1
        function loco(parent, { id, x, y, s = 1, col = INK, body = DEEP, acc = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s), w = [];
          S('rect', { x: -6, y: -44, width: 300, height: 16, fill: col }, ig);
          S('rect', { x: 0, y: -150, width: 92, height: 108, rx: 8, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 16, y: -134, width: 46, height: 40, rx: 4, fill: acc, opacity: 0.85, id: `${id}-win` }, ig);
          S('path', { d: 'M-10 -152 H102', stroke: col, 'stroke-width': 9, 'stroke-linecap': 'round' }, ig);
          S('rect', { x: 92, y: -112, width: 190, height: 70, rx: 30, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('rect', { x: 150, y: -134, width: 36, height: 26, rx: 10, fill: body, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 226, y: -152, width: 30, height: 44, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M282 -42 L314 -6 L282 -6 Z', fill: col }, ig);
          [[44, 27], [148, 31], [228, 31]].forEach(([cx, r], k) => {
            const wg = S('g', { id: `${id}-w${k}` }, ig);
            S('circle', { cx, cy: -r, r, fill: body, stroke: col, 'stroke-width': 6 }, wg);
            S('path', { d: `M${cx - r + 5} ${-r} H${cx + r - 5} M${cx} ${-2 * r + 5} V${-5}`, stroke: acc, 'stroke-width': 5 }, wg);
            w.push(wg);
          });
          S('path', { d: 'M44 -27 H228', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, ig);
          return { g, ig, w, win };
        }
        // a wagon with a blank plate; (x, y) = rail level under its left end; 150 wide plus a coupler
        function wagon(parent, { id, x, y, s = 1, col = INK, fill = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: -12, y: -48, width: 174, height: 10, fill: col }, ig);
          S('rect', { x: 0, y: -108, width: 150, height: 64, rx: 6, fill, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 46, y: -92, width: 58, height: 30, rx: 3, fill: DEEP, opacity: 0.55 }, ig);
          [36, 114].forEach((cx) => S('circle', { cx, cy: -20, r: 19, fill: DEEP, stroke: col, 'stroke-width': 5 }, ig));
          return { g, ig };
        }
        // a straight rail with sleepers, side view
        function track(parent, { id, x0, x1, y, col = '#6aa9d0' }) {
          const g = S('g', { id }, parent);
          for (let x = x0 + 8; x < x1 - 10; x += 36) S('rect', { x, y: y + 4, width: 14, height: 16, fill: '#3d78a6' }, g);
          S('path', { d: `M${x0} ${y} H${x1}`, stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
          return g;
        }
        // signal box, side view; (x, y) = ground under its left wall; 280 x 300 at s = 1
        function box(parent, { id, x, y, s = 1, col = INK }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: 0, y: -120, width: 220, height: 120, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M0 -80 H220 M0 -40 H220 M70 -120 V-80 M150 -80 V-40 M70 -40 V0', stroke: '#3d78a6', 'stroke-width': 4 }, ig);
          S('rect', { x: -12, y: -232, width: 244, height: 112, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 6, y: -216, width: 208, height: 72, fill: CY, opacity: 0.3, id: `${id}-win` }, ig);
          S('path', { d: 'M75 -216 V-144 M145 -216 V-144', stroke: col, 'stroke-width': 4 }, ig);
          S('path', { d: 'M-34 -232 L110 -304 L254 -232 Z', fill: DEEP, stroke: col, 'stroke-width': 6, 'stroke-linejoin': 'round' }, ig);
          const lev = S('g', { id: `${id}-lev` }, ig);
          S('path', { d: 'M110 -150 L110 -198', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round' }, lev);
          S('circle', { cx: 110, cy: -200, r: 9, fill: '#ffb454' }, lev);
          return { g, ig, win, lev };
        }
        // steam puffs from a locomotive chimney, one burst per time
        function puffs(tl, L, times, { n = 3 } = {}) {
          times.forEach((t) => { for (let i = 0; i < n; i++) {
            const c = S('circle', { cx: 241, cy: -170, r: 15 + i * 5, fill: INK, opacity: 0 }, L.ig);
            tl.fromTo(c, { opacity: 0, scale: 0.4, x: 0, y: 0, transformOrigin: '50% 50%' }, { opacity: 0.9, scale: 0.8, duration: 0.01, immediateRender: false }, t + i * 0.13);
            tl.to(c, { opacity: 0, scale: 2.3, y: -95 - i * 22, x: -40 - i * 30, duration: 0.9, ease: 'power2.out' }, t + i * 0.13 + 0.01);
          } });
        }
        // wheels turn for a while (whole turns, so the last frame is clean)
        function roll(tl, L, t, dur, turns = 2) { tl.fromTo(L.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360 * turns, duration: dur, ease: 'none', immediateRender: false }, t); }
        return { loco, wagon, track, box, puffs, roll };
      })();
      const c = (w, n) => KIT.cue('l15', w, n), D = KIT.sceneDur('close'), S = KIT.svgEl, svg = document.getElementById('cl-svg');
      KIT.bind('#cl-shk'); KIT.bind('#cl-end');
      const tl = gsap.timeline({ paused: true });
      const pulse = (t, o = 0.2) => tl.fromTo('#cl-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);
      const cam = (t, px, py, s, dur) => tl.to('#cl-cam', { x: 540 - s * px, y: 960 - s * py, scale: s, duration: dur, ease: 'power3.inOut' }, t);

      // the hook's composition: two tracks, a gantry with the signal box, two locomotives
      RAIL.track(svg, { id: 'cl-t1', x0: 30, x1: 1050, y: 940 });
      RAIL.track(svg, { id: 'cl-t2', x0: 30, x1: 930, y: 1200 });
      S('path', { d: 'M812 700 V1214 M912 700 V1214 M790 700 H934', class: 'ln dim thick' }, svg);
      const blade = S('path', { d: 'M560 940 L700 900', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round', id: 'cl-blade' }, svg);
      const BX = RAIL.box(svg, { id: 'cl-box', x: 800, y: 700, s: 0.48 });
      const A = RAIL.loco(svg, { id: 'cl-la', x: 240, y: 940 }), B = RAIL.loco(svg, { id: 'cl-lb', x: 240, y: 1200 });

      // "does the work": a locomotive runs across the frame with steam
      tl.fromTo('#cl-cam', { x: 540 - 1.6 * 330, y: 960 - 1.6 * 1110, scale: 1.6 }, { x: 540 - 1.6 * 360, y: 960 - 1.6 * 1110, scale: 1.6, duration: 1.3, ease: 'none' }, 0);
      tl.fromTo(B.g, { x: -700 }, { x: 0, duration: 1.25, ease: 'power2.out' }, 0.05);
      tl.fromTo(B.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 1080, duration: 1.25, ease: 'power2.out' }, 0.05);
      RAIL.puffs(tl, B, [0.2, 0.6, 1.0]);
      pulse(c('work'), 0.14);
      // "control decides": the box lever throws, the window lights, the switch snaps
      cam(c('control') - 0.25, 760, 760, 1.35, 0.4);
      tl.fromTo(BX.lev, { rotation: 0, transformOrigin: '50% 100%' }, { rotation: 40, duration: 0.14, ease: 'power4.in' }, c('decides') - 0.1);
      tl.fromTo(BX.win, { opacity: 0.3 }, { opacity: 1, duration: 0.15, immediateRender: false }, c('decides'));
      tl.fromTo(blade, { rotation: 14, transformOrigin: '0% 100%' }, { rotation: 0, duration: 0.12, ease: 'power4.in' }, c('decides') + 0.04);
      KIT.pop(tl, '#cl-ctl', c('decides'), { from: 0.5 });
      KIT.shake(tl, '#cl-shk', c('decides') + 0.1, { amp: 9, dur: 0.22 });
      pulse(c('decides'), 0.2);
      // "worth it": pull back to the opening frame, the hook ghosts in, the end card rises
      cam(c('which'), 540, 960, 1.0, 0.6);
      tl.to('#cl-ctl', { opacity: 0, duration: 0.2 }, c('which'));
      tl.fromTo('#cl-ghost', { opacity: 0 }, { opacity: 0.3, duration: 0.5 }, c('worth'));
      RAIL.puffs(tl, A, [c('worth')]);
      tl.fromTo('#cl-plate', { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, c('it') + 0.1);
      KIT.slam(tl, '#cl-handle', c('it') + 0.3, { from: 1.6, shake: false });
      KIT.rise(tl, '#cl-credit', c('it') + 0.5, { y: 14 });
      pulse(c('it') + 0.3, 0.15);
      window.__timelines["close"] = tl;
    })();
  </script>
</template>
