<template id="cycle-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #cy-world { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; transform-origin: 0 0; }
    #cy-svg { left: 0; top: 0; width: 1080px; height: 2400px; }
    #cy-title { left: 60px; top: 186px; font-size: 40px; }
    .cy-lab { font-size: 36px; top: 966px; }
    #cy-state { left: 640px; top: 500px; font-size: 32px; }
    #cy-mem { left: 290px; top: 1462px; font-size: 36px; }
    #cy-art { left: 80px; top: 1400px; font-size: 32px; }
    #cy-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="cycle" data-width="1080" data-height="1920">
    <div id="cy-world">
      <svg id="cy-svg" class="ink" viewBox="0 0 1080 2400"></svg>
      <div id="cy-title" class="tag cyan" data-bind="l06.title"></div>
      <div id="cy-l1" class="tag cyan cy-lab" data-bind="l06.s1"></div>
      <div id="cy-l2" class="tag cyan cy-lab" data-bind="l06.s2"></div>
      <div id="cy-l3" class="tag cyan cy-lab" data-bind="l06.s3"></div>
      <div id="cy-l4" class="tag cyan cy-lab" data-bind="l06.s4"></div>
      <div id="cy-state" class="tag" data-bind="l07.state"></div>
      <div id="cy-art" class="tag cyan" data-bind="l07.art"></div>
      <div id="cy-mem" class="tag" data-bind="l07.mem"></div>
    </div>
    <div id="cy-flash"></div>
  </div>
  <script>
    (function () {
      // railway drawings shared by every scene of this episode (inlined per scene; the first scene to load defines it)
      window.RAIL = window.RAIL || (function () {
        const S = KIT.svgEl, INK = '#f2f8ff', DEEP = '#0a2340', CY = '#a8dcf2';
        const wrap = (parent, id, x, y, s) => { const g = S('g', { id }, parent); const ig = S('g', { transform: `translate(${x} ${y}) scale(${s})` }, g); return { g, ig }; };
        // side view, facing right; (x, y) = rail level under the cab; about 310 x 165 at s = 1
        function loco(parent, { id, x, y, s = 1, col = INK, body = DEEP, acc = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s), w = [];
          S('rect', { x: -6, y: -44, width: 300, height: 16, fill: col }, ig);
          S('rect', { x: 0, y: -150, width: 92, height: 108, rx: 8, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 16, y: -134, width: 46, height: 40, rx: 4, fill: acc, opacity: 0.85, id: `${id}-win` }, ig);
          S('path', { d: 'M-10 -152 H102', stroke: col, 'stroke-width': 9, 'stroke-linecap': 'round' }, ig);
          S('rect', { x: 92, y: -112, width: 190, height: 70, rx: 30, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('rect', { x: 150, y: -134, width: 36, height: 26, rx: 10, fill: body, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 226, y: -152, width: 30, height: 44, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M282 -42 L314 -6 L282 -6 Z', fill: col }, ig);
          [[44, 27], [148, 31], [228, 31]].forEach(([cx, r], k) => {
            const wg = S('g', { id: `${id}-w${k}` }, ig);
            S('circle', { cx, cy: -r, r, fill: body, stroke: col, 'stroke-width': 6 }, wg);
            S('path', { d: `M${cx - r + 5} ${-r} H${cx + r - 5} M${cx} ${-2 * r + 5} V${-5}`, stroke: acc, 'stroke-width': 5 }, wg);
            w.push(wg);
          });
          S('path', { d: 'M44 -27 H228', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, ig);
          return { g, ig, w, win };
        }
        // a wagon with a blank plate; (x, y) = rail level under its left end; 150 wide plus a coupler
        function wagon(parent, { id, x, y, s = 1, col = INK, fill = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: -12, y: -48, width: 174, height: 10, fill: col }, ig);
          S('rect', { x: 0, y: -108, width: 150, height: 64, rx: 6, fill, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 46, y: -92, width: 58, height: 30, rx: 3, fill: DEEP, opacity: 0.55 }, ig);
          [36, 114].forEach((cx) => S('circle', { cx, cy: -20, r: 19, fill: DEEP, stroke: col, 'stroke-width': 5 }, ig));
          return { g, ig };
        }
        // a straight rail with sleepers, side view
        function track(parent, { id, x0, x1, y, col = '#6aa9d0' }) {
          const g = S('g', { id }, parent);
          for (let x = x0 + 8; x < x1 - 10; x += 36) S('rect', { x, y: y + 4, width: 14, height: 16, fill: '#3d78a6' }, g);
          S('path', { d: `M${x0} ${y} H${x1}`, stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
          return g;
        }
        // signal box, side view; (x, y) = ground under its left wall; 280 x 300 at s = 1
        function box(parent, { id, x, y, s = 1, col = INK }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: 0, y: -120, width: 220, height: 120, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M0 -80 H220 M0 -40 H220 M70 -120 V-80 M150 -80 V-40 M70 -40 V0', stroke: '#3d78a6', 'stroke-width': 4 }, ig);
          S('rect', { x: -12, y: -232, width: 244, height: 112, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 6, y: -216, width: 208, height: 72, fill: CY, opacity: 0.3, id: `${id}-win` }, ig);
          S('path', { d: 'M75 -216 V-144 M145 -216 V-144', stroke: col, 'stroke-width': 4 }, ig);
          S('path', { d: 'M-34 -232 L110 -304 L254 -232 Z', fill: DEEP, stroke: col, 'stroke-width': 6, 'stroke-linejoin': 'round' }, ig);
          const lev = S('g', { id: `${id}-lev` }, ig);
          S('path', { d: 'M110 -150 L110 -198', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round' }, lev);
          S('circle', { cx: 110, cy: -200, r: 9, fill: '#ffb454' }, lev);
          return { g, ig, win, lev };
        }
        // steam puffs from a locomotive chimney, one burst per time
        function puffs(tl, L, times, { n = 3 } = {}) {
          times.forEach((t) => { for (let i = 0; i < n; i++) {
            const c = S('circle', { cx: 241, cy: -170, r: 15 + i * 5, fill: INK, opacity: 0 }, L.ig);
            tl.fromTo(c, { opacity: 0, scale: 0.4, x: 0, y: 0, transformOrigin: '50% 50%' }, { opacity: 0.9, scale: 0.8, duration: 0.01, immediateRender: false }, t + i * 0.13);
            tl.to(c, { opacity: 0, scale: 2.3, y: -95 - i * 22, x: -40 - i * 30, duration: 0.9, ease: 'power2.out' }, t + i * 0.13 + 0.01);
          } });
        }
        // wheels turn for a while (whole turns, so the last frame is clean)
        function roll(tl, L, t, dur, turns = 2) { tl.fromTo(L.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360 * turns, duration: dur, ease: 'none', immediateRender: false }, t); }
        return { loco, wagon, track, box, puffs, roll };
      })();
      const c = (w, n) => KIT.cue('l06', w, n), d = (w, n) => KIT.cue('l07', w, n), D = KIT.sceneDur('cycle'), S = KIT.svgEl;
      KIT.bind('#cy-world');
      const tl = gsap.timeline({ paused: true });
      const pulse = (t, o = 0.2) => tl.fromTo('#cy-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);
      const V = document.getElementById('cy-svg');
      const cam = (t, px, py, s, dur = 0.35, sy = 900) => tl.to('#cy-world', { x: 540 - s * px, y: sy - s * py, scale: s, duration: dur, ease: 'power3.inOut' }, t);

      // the lever frame inside the signal box: four big levers, one per stage
      const XS = [220, 420, 620, 820];
      const frame = S('g', { id: 'cy-frame' }, V);
      S('rect', { x: 110, y: 900, width: 860, height: 56, rx: 8, fill: '#0a2340', stroke: '#f2f8ff', 'stroke-width': 6 }, frame);
      S('path', { d: 'M150 956 V1010 M930 956 V1010', stroke: '#f2f8ff', 'stroke-width': 8 }, frame);
      const levers = XS.map((x, k) => {
        const g = S('g', { id: `cy-lv${k}` }, V);
        S('rect', { x: x - 17, y: 560, width: 34, height: 350, rx: 14, fill: '#a8dcf2', stroke: '#f2f8ff', 'stroke-width': 4, id: `cy-lvb${k}` }, g);
        S('rect', { x: x - 38, y: 540, width: 76, height: 44, rx: 12, fill: '#f2f8ff' }, g);
        return g;
      });
      ['#cy-l1', '#cy-l2', '#cy-l3', '#cy-l4'].forEach((sel, k) => { const el = document.querySelector(sel); el.style.left = `${XS[k] - 90}px`; el.style.width = '180px'; el.style.textAlign = 'center'; el.style.boxSizing = 'border-box'; el.style.paddingLeft = '0'; el.style.paddingRight = '0'; });
      const ring = S('path', { d: 'M540 450 A 490 330 0 1 1 539 450', class: 'ln amber heavy', id: 'cy-ring' }, V);
      const head = S('path', { d: 'M520 422 L580 450 L520 478 Z', fill: '#ffb454', id: 'cy-head' }, V);
      // the slate on the box wall (compact state)
      S('rect', { x: 620, y: 230, width: 380, height: 250, rx: 10, fill: '#13324f', stroke: '#c9a26b', 'stroke-width': 12, id: 'cy-slate' }, V);
      const chalk = [0, 1, 2].map((k) => S('path', { d: `M660 ${290 + k * 62} L${900 - k * 70} ${296 + k * 62}`, class: 'ln heavy', id: `cy-ch${k}` }, V));
      // the wagon shed (persistent memory): three rows of four bays
      const shed = S('g', { id: 'cy-shed' }, V);
      S('path', { d: 'M70 1990 V1560 L480 1500 L900 1560 V1990', class: 'ln thick' }, shed);
      const rows = [1680, 1790, 1900], bays = [150, 330, 510, 690], wg = [];
      rows.forEach((y, r) => { RAIL.track(shed, { id: `cy-sr${r}`, x0: 110, x1: 880, y }); bays.forEach((x, b) => wg.push(RAIL.wagon(V, { id: `cy-wg${r}${b}`, x, y, s: 0.92 }))); });
      RAIL.track(V, { id: 'cy-out', x0: 40, x1: 930, y: 2030 });
      const L = RAIL.loco(V, { id: 'cy-loco', x: 520, y: 2030, s: 0.62 });

      // l06: the frame draws, "four" brings the levers, each stage word pulls its lever; the camera steps right
      tl.fromTo('#cy-world', { x: 0, y: 0, scale: 1 }, { x: -20, y: -10, scale: 1.02, duration: 1.2, ease: 'sine.inOut' }, 0);
      tl.fromTo(frame, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, c('Each'));
      KIT.pop(tl, '#cy-title', c('cycle'));
      levers.forEach((g, k) => tl.fromTo(g, { opacity: 0, rotation: -8, transformOrigin: '50% 100%' }, { opacity: 1, rotation: -8, duration: 0.2, ease: 'power2.out' }, c('four') + k * 0.09));
      ['#cy-l1', '#cy-l2', '#cy-l3', '#cy-l4'].forEach((sel, k) => KIT.rise(tl, sel, c('stages') + k * 0.06, { y: 20 }));
      pulse(c('four'), 0.15);
      const words = ['assess', 'propose', 'evaluate', 'dispatch'];
      words.forEach((w, k) => {
        const t = c(w);
        cam(t - 0.25, XS[k], 760, 1.3);
        tl.to(levers[k], { rotation: 8, duration: 0.16, ease: 'power4.in' }, t - 0.05);
        tl.to(`#cy-lvb${k}`, { fill: '#ffb454', duration: 0.1 }, t + 0.1);
        tl.to(['#cy-l1', '#cy-l2', '#cy-l3', '#cy-l4'][k], { color: '#0b2a4a', backgroundColor: '#a8dcf2', duration: 0.1 }, t + 0.1);
        pulse(t + 0.05, 0.14);
      });
      // "dispatch": pull back, a circular arrow wraps the four and spins once
      cam(c('dispatch') + 0.3, 540, 760, 0.92, 0.45);
      KIT.draw(tl, ring, c('dispatch') + 0.35, 0.45);
      tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.05 }, c('dispatch') + 0.75);
      tl.fromTo([ring, head], { rotation: 0, svgOrigin: '540 780' }, { rotation: 360, svgOrigin: '540 780', duration: 0.9, ease: 'power2.inOut', immediateRender: false }, c('dispatch') + 0.8);

      // l07: "controller" pans to the slate; "compact state" chalks three short lines on it
      tl.to([ring, head], { opacity: 0, duration: 0.3 }, d('The'));
      tl.to([frame, ...levers, '#cy-l1', '#cy-l2', '#cy-l3', '#cy-l4', '#cy-title'], { opacity: 0.12, duration: 0.4 }, d('controller'));
      cam(d('controller'), 810, 360, 1.35, 0.5, 760);
      chalk.forEach((p, k) => KIT.draw(tl, p, d('compact') + k * 0.16, 0.18, { ease: 'none' }));
      KIT.pop(tl, '#cy-state', d('state'));
      pulse(d('compact'), 0.18);
      // "artifacts": tilt down to the shed; wagons roll in and fill the bays
      cam(d('All'), 485, 1750, 0.98, 0.5, 1080);
      KIT.rise(tl, '#cy-art', d('artifacts'), { y: 16 });
      wg.forEach((w, k) => tl.fromTo(w.g, { x: -260, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, d('artifacts') + k * 0.07));
      KIT.pop(tl, '#cy-mem', d('persistent'));
      pulse(d('persistent'), 0.15);
      // "memory": dispatch picks two artifacts; one locomotive leaves with only those two coupled
      const hi = [[330, 1790], [150, 1900]].map(([x, y], k) => S('rect', { x: x - 14, y: y - 112, width: 166, height: 110, rx: 10, fill: 'none', stroke: '#ffb454', 'stroke-width': 8, opacity: 0, id: `cy-hi${k}` }, V));
      const out = [410, 298].map((x, k) => RAIL.wagon(V, { id: `cy-ow${k}`, x, y: 2030, s: 0.62 }));
      hi.forEach((h, k) => tl.fromTo(h, { opacity: 0, scale: 1.3, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.2, ease: 'back.out(2)' }, d('memory') - 0.15 + k * 0.08));
      tl.fromTo(L.g, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.25 }, d('memory') - 0.1);
      out.forEach((w, k) => tl.fromTo(w.g, { opacity: 0, y: -140 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power3.out' }, d('memory') + 0.1 + k * 0.08));
      tl.to([L.g, out[0].g, out[1].g], { x: '+=150', duration: D - d('memory') - 0.6, ease: 'power2.in' }, d('memory') + 0.5);
      tl.fromTo(L.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360, duration: D - d('memory') - 0.6, ease: 'power2.in', immediateRender: false }, d('memory') + 0.5);
      RAIL.puffs(tl, L, [d('memory') + 0.5], { n: 3 });
      pulse(d('memory'), 0.2);
      window.__timelines["cycle"] = tl;
    })();
  </script>
</template>
