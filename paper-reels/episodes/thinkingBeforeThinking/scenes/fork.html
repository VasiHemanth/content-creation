<template id="fork-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #fork-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #fork-world { position: absolute; left: 0; top: 0; width: 1080px; height: 4400px; }
    #fork-wsvg { left: 0; top: 0; width: 1080px; height: 4400px; }
    #fork-tsvg { left: 0; top: 0; width: 1080px; height: 1920px; }
    .fork-sign { font-size: 40px; padding: 10px 24px; }
    #fork-k1 { left: 110px; top: 196px; } #fork-k2 { left: 440px; top: 150px; } #fork-k3 { left: 770px; top: 196px; }
    #fork-dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #061a30; opacity: 0; }
    #fork-rcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #fork-rstage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #fork-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #fork-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="fork" data-width="1080" data-height="1920">
    <div id="fork-cam">
      <div id="fork-world">
        <svg id="fork-wsvg" class="ink" viewBox="0 0 1080 4400"></svg>
        <div id="fork-k1" class="tag cyan fork-sign" data-bind="l02.k1"></div>
        <div id="fork-k2" class="tag cyan fork-sign" data-bind="l02.k2"></div>
        <div id="fork-k3" class="tag fork-sign" data-bind="l02.k3"></div>
      </div>
      <svg id="fork-tsvg" class="ink" viewBox="0 0 1080 1920"></svg>
    </div>
    <div id="fork-dim"></div>
    <div id="fork-rcam"><div id="fork-rstage"></div></div>
    <div id="fork-hud"></div>
    <div id="fork-flash"></div>
  </div>
  <script>
    (function () {
      // railway drawings shared by every scene of this episode (inlined per scene; the first scene to load defines it)
      window.RAIL = window.RAIL || (function () {
        const S = KIT.svgEl, INK = '#f2f8ff', DEEP = '#0a2340', CY = '#a8dcf2';
        const wrap = (parent, id, x, y, s) => { const g = S('g', { id }, parent); const ig = S('g', { transform: `translate(${x} ${y}) scale(${s})` }, g); return { g, ig }; };
        // side view, facing right; (x, y) = rail level under the cab; about 310 x 165 at s = 1
        function loco(parent, { id, x, y, s = 1, col = INK, body = DEEP, acc = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s), w = [];
          S('rect', { x: -6, y: -44, width: 300, height: 16, fill: col }, ig);
          S('rect', { x: 0, y: -150, width: 92, height: 108, rx: 8, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 16, y: -134, width: 46, height: 40, rx: 4, fill: acc, opacity: 0.85, id: `${id}-win` }, ig);
          S('path', { d: 'M-10 -152 H102', stroke: col, 'stroke-width': 9, 'stroke-linecap': 'round' }, ig);
          S('rect', { x: 92, y: -112, width: 190, height: 70, rx: 30, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('rect', { x: 150, y: -134, width: 36, height: 26, rx: 10, fill: body, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 226, y: -152, width: 30, height: 44, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M282 -42 L314 -6 L282 -6 Z', fill: col }, ig);
          [[44, 27], [148, 31], [228, 31]].forEach(([cx, r], k) => {
            const wg = S('g', { id: `${id}-w${k}` }, ig);
            S('circle', { cx, cy: -r, r, fill: body, stroke: col, 'stroke-width': 6 }, wg);
            S('path', { d: `M${cx - r + 5} ${-r} H${cx + r - 5} M${cx} ${-2 * r + 5} V${-5}`, stroke: acc, 'stroke-width': 5 }, wg);
            w.push(wg);
          });
          S('path', { d: 'M44 -27 H228', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, ig);
          return { g, ig, w, win };
        }
        // a wagon with a blank plate; (x, y) = rail level under its left end; 150 wide plus a coupler
        function wagon(parent, { id, x, y, s = 1, col = INK, fill = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: -12, y: -48, width: 174, height: 10, fill: col }, ig);
          S('rect', { x: 0, y: -108, width: 150, height: 64, rx: 6, fill, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 46, y: -92, width: 58, height: 30, rx: 3, fill: DEEP, opacity: 0.55 }, ig);
          [36, 114].forEach((cx) => S('circle', { cx, cy: -20, r: 19, fill: DEEP, stroke: col, 'stroke-width': 5 }, ig));
          return { g, ig };
        }
        // a straight rail with sleepers, side view
        function track(parent, { id, x0, x1, y, col = '#6aa9d0' }) {
          const g = S('g', { id }, parent);
          for (let x = x0 + 8; x < x1 - 10; x += 36) S('rect', { x, y: y + 4, width: 14, height: 16, fill: '#3d78a6' }, g);
          S('path', { d: `M${x0} ${y} H${x1}`, stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
          return g;
        }
        // signal box, side view; (x, y) = ground under its left wall; 280 x 300 at s = 1
        function box(parent, { id, x, y, s = 1, col = INK }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: 0, y: -120, width: 220, height: 120, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M0 -80 H220 M0 -40 H220 M70 -120 V-80 M150 -80 V-40 M70 -40 V0', stroke: '#3d78a6', 'stroke-width': 4 }, ig);
          S('rect', { x: -12, y: -232, width: 244, height: 112, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 6, y: -216, width: 208, height: 72, fill: CY, opacity: 0.3, id: `${id}-win` }, ig);
          S('path', { d: 'M75 -216 V-144 M145 -216 V-144', stroke: col, 'stroke-width': 4 }, ig);
          S('path', { d: 'M-34 -232 L110 -304 L254 -232 Z', fill: DEEP, stroke: col, 'stroke-width': 6, 'stroke-linejoin': 'round' }, ig);
          const lev = S('g', { id: `${id}-lev` }, ig);
          S('path', { d: 'M110 -150 L110 -198', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round' }, lev);
          S('circle', { cx: 110, cy: -200, r: 9, fill: '#ffb454' }, lev);
          return { g, ig, win, lev };
        }
        // steam puffs from a locomotive chimney, one burst per time
        function puffs(tl, L, times, { n = 3 } = {}) {
          times.forEach((t) => { for (let i = 0; i < n; i++) {
            const c = S('circle', { cx: 241, cy: -170, r: 15 + i * 5, fill: INK, opacity: 0 }, L.ig);
            tl.fromTo(c, { opacity: 0, scale: 0.4, x: 0, y: 0, transformOrigin: '50% 50%' }, { opacity: 0.9, scale: 0.8, duration: 0.01, immediateRender: false }, t + i * 0.13);
            tl.to(c, { opacity: 0, scale: 2.3, y: -95 - i * 22, x: -40 - i * 30, duration: 0.9, ease: 'power2.out' }, t + i * 0.13 + 0.01);
          } });
        }
        // wheels turn for a while (whole turns, so the last frame is clean)
        function roll(tl, L, t, dur, turns = 2) { tl.fromTo(L.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360 * turns, duration: dur, ease: 'none', immediateRender: false }, t); }
        return { loco, wagon, track, box, puffs, roll };
      })();
      const c = (w, n) => KIT.cue('l02', w, n), d = (w, n) => KIT.cue('l03', w, n), D = KIT.sceneDur('fork'), S = KIT.svgEl;
      KIT.bind('#fork-cam');
      const tl = gsap.timeline({ paused: true });
      const pulse = (t, o = 0.2) => tl.fromTo('#fork-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);
      const W = document.getElementById('fork-wsvg'), T = document.getElementById('fork-tsvg');

      // top-down track: sleepers, two rails (a white stroke with a dark core). One trunk, three junctions.
      const rail = (dd, id) => {
        const g = S('g', { id }, W);
        S('path', { d: dd, fill: 'none', stroke: '#3d78a6', 'stroke-width': 66, 'stroke-dasharray': '12 24' }, g);
        S('path', { d: dd, fill: 'none', stroke: '#f2f8ff', 'stroke-width': 36 }, g);
        S('path', { d: dd, fill: 'none', stroke: '#0b2a4a', 'stroke-width': 22 }, g);
        return g;
      };
      rail('M540 4400 V300', 'fork-trunk');
      const J = [3200, 2000, 800], br = J.map((y, k) => [
        rail(`M540 ${y} C 540 ${y - 220}, 280 ${y - 260}, 280 ${y - 500}`, `fork-bl${k}`),
        rail(`M540 ${y} C 540 ${y - 220}, 800 ${y - 260}, 800 ${y - 500}`, `fork-br${k}`)]);
      // buffer stop at the end of the "stop" branch (decoration)
      const buf = S('g', { id: 'fork-buf' }, W);
      S('rect', { x: 740, y: 262, width: 120, height: 34, rx: 6, fill: '#ffb454' }, buf);
      S('path', { d: 'M752 296 L800 330 M848 296 L800 330', stroke: '#ffb454', 'stroke-width': 10, 'stroke-linecap': 'round' }, buf);

      // the train, top-down, fixed on screen while the world rides under it
      const train = S('g', { id: 'fork-train' }, T);
      S('rect', { x: 500, y: 1180, width: 80, height: 170, rx: 30, fill: '#0a2340', stroke: '#f2f8ff', 'stroke-width': 6 }, train);
      S('rect', { x: 512, y: 1270, width: 56, height: 70, rx: 6, fill: '#a8dcf2' }, train);
      S('circle', { cx: 540, cy: 1214, r: 16, fill: '#f2f8ff' }, train);
      const wag = [0, 1, 2, 3].map((k) => { const r = S('rect', { x: 504, y: 1368 + k * 150, width: 72, height: 136, rx: 8, fill: '#a8dcf2', stroke: '#f2f8ff', 'stroke-width': 5, id: `fork-wg${k}` }, T); return r; });

      // l02: ride up the trunk; "one decision" splits it; "again and again" passes two more junctions, fast
      tl.fromTo('#fork-world', { y: -2480 }, { y: -2280, duration: c('decision'), ease: 'none' }, 0);
      tl.fromTo(train, { y: 0 }, { y: -12, duration: 0.25, yoyo: true, repeat: 7, ease: 'sine.inOut' }, 0.1);
      const ty = (k) => -J[k] + 800;
      br[0].forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.6, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, c('decision') + i * 0.06));
      pulse(c('decision'));
      tl.to('#fork-world', { y: ty(1), duration: 0.45, ease: 'power3.inOut' }, c('again') - 0.2);
      br[1].forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.6, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, c('again') + i * 0.05));
      tl.to('#fork-world', { y: 0, duration: 0.45, ease: 'power3.inOut' }, c('again', 1) - 0.2);
      br[2].forEach((g, i) => tl.fromTo(g, { opacity: 0, scale: 0.6, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, c('again', 1) + i * 0.05));
      pulse(c('again', 1), 0.12);
      KIT.pop(tl, '#fork-k1', c('keep')); KIT.pop(tl, '#fork-k2', c('restart')); KIT.pop(tl, '#fork-k3', c('stop'));
      tl.fromTo(buf, { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.2, ease: 'power4.in' }, c('stop') + 0.1);
      KIT.shake(tl, '#fork-cam', c('stop') + 0.3, { amp: 12, dur: 0.3 });
      pulse(c('stop'), 0.25);

      // l03: "grow longer" couples wagon after wagon; the camera pulls back to show the length
      wag.forEach((r, k) => tl.fromTo(r, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: 'power3.out' }, d('grow') + k * 0.16));
      tl.fromTo('#fork-cam', { x: 0, y: 0, scale: 1 }, { x: 205, y: 228, scale: 0.62, duration: 0.8, ease: 'power2.inOut', immediateRender: false }, d('grow'));
      pulse(d('longer'), 0.12);

      // "that decision": the paper's own sentence, read on camera (about 2 s)
      const tR = d('that') - 0.4;
      tl.fromTo('#fork-dim', { opacity: 0 }, { opacity: 0.86, duration: 0.3 }, tR);
      const R = KIT.read(tl, { cam: '#fork-rcam', parent: '#fork-rstage', hud: '#fork-hud', tagY: 620, id: 'conclusion', t: tR, label: KIT.data('l03').receipt,
        x: 40, y: 900, width: 1000, zoom: 2.3, fx: 90, fy: 800, follow: 0,
        marks: [[d('that'), d('right') + 0.3]], circles: [{ word: 'becomes work', t: d('work') + 0.05 }] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      // "right": cut back to the junction; a signal box builds itself by the switch
      const tB = d('right') + 0.36;
      tl.set([R.el, '#fork-hud'], { opacity: 0 }, tB);
      tl.set('#fork-rcam', { x: 0, y: 0, scale: 1 }, tB);
      tl.set('#fork-dim', { opacity: 0 }, tB);
      tl.set('#fork-cam', { x: 0, y: 0, scale: 1 }, tB);
      const BX = RAIL.box(T, { id: 'fork-box', x: 620, y: 1000, s: 0.62 });
      tl.fromTo(BX.g, { opacity: 0, scale: 0.2, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, tB);
      tl.fromTo(BX.win, { opacity: 0.3 }, { opacity: 1, duration: 0.25, immediateRender: false }, tB + 0.25);
      pulse(tB, 0.25);
      // push toward the box window, so the zoom transition goes into it
      const wx = 620 + 0.62 * 110, wy = 1000 - 0.62 * 180, s = 1.5;
      tl.to('#fork-cam', { x: 540 - s * wx, y: 960 - s * wy, scale: s, duration: D - tB - 0.05, ease: 'power2.in' }, tB + 0.05);
      window.__timelines["fork"] = tl;
    })();
  </script>
</template>
