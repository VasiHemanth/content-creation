<template id="tank-template">
  <style>
    #root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
    #tk-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 900px; }
    #tk-svg { left: 0; top: 0; width: 1080px; height: 1920px; }
    #tk-a { left: 60px; top: 186px; font-size: 36px; }
    #tk-b { left: 540px; top: 186px; font-size: 32px; }
    .tk-eq { left: 380px; width: 320px; text-align: center; box-sizing: border-box; font-size: 36px; }
    #tk-e1 { top: 610px; } #tk-e2 { top: 700px; } #tk-e3 { top: 790px; }
    #tk-bench { left: 250px; top: 1196px; font-size: 32px; }
    .tk-mod { left: 560px; top: 1196px; font-size: 32px; }
    #tk-dc { left: 150px; top: 590px; width: 240px; text-align: center; font: 400 104px/1 "Marker", sans-serif; color: var(--amber); text-shadow: 6px 6px 0 var(--shadow); }
    #tk-used { left: 168px; top: 712px; font-size: 26px; }
    #tk-mr { left: 690px; top: 860px; font-size: 34px; }
    #tk-calls { left: 420px; top: 640px; font-size: 32px; }
    #tk-bud { left: 470px; top: 840px; font-size: 32px; }
    #tk-score { left: 700px; top: 800px; font-size: 32px; }
    #tk-dim { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #061a30; opacity: 0; }
    #tk-rcam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
    #tk-rstage, #tk-hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #tk-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #ffe2b0; opacity: 0; }
  </style>
  <div id="root" data-composition-id="tank" data-width="1080" data-height="1920">
    <div id="tk-cam">
      <svg id="tk-svg" class="ink" viewBox="0 0 1080 1920"></svg>
      <div id="tk-a" class="tag" data-bind="l08.a"></div>
      <div id="tk-b" class="tag cyan" data-bind="l08.b"></div>
      <div id="tk-e1" class="tag tk-eq" data-bind="l08.e1"></div>
      <div id="tk-e2" class="tag tk-eq" data-bind="l08.e2"></div>
      <div id="tk-e3" class="tag tk-eq" data-bind="l08.e3"></div>
      <div id="tk-bench" class="tag cyan" data-bind="l09.bench"></div>
      <div id="tk-m1" class="tag cyan tk-mod" data-bind="l09.model"></div>
      <div id="tk-m2" class="tag cyan tk-mod" data-bind="l10.model"></div>
      <div id="tk-dc" class="abs" data-bind="l09.dc"></div>
      <div id="tk-used" class="lbl amber" data-bind="l09.used"></div>
      <div id="tk-mr" class="tag cyan" data-bind="l09.mr"></div>
      <div id="tk-calls" class="tag" data-bind="l10.calls"></div>
      <div id="tk-bud" class="tag cyan" data-bind="l10.budget"></div>
      <div id="tk-score" class="tag cyan" data-bind="l10.score"></div>
    </div>
    <div id="tk-dim"></div>
    <div id="tk-rcam"><div id="tk-rstage"></div></div>
    <div id="tk-hud"></div>
    <div id="tk-flash"></div>
  </div>
  <script>
    (function () {
      // railway drawings shared by every scene of this episode (inlined per scene; the first scene to load defines it)
      window.RAIL = window.RAIL || (function () {
        const S = KIT.svgEl, INK = '#f2f8ff', DEEP = '#0a2340', CY = '#a8dcf2';
        const wrap = (parent, id, x, y, s) => { const g = S('g', { id }, parent); const ig = S('g', { transform: `translate(${x} ${y}) scale(${s})` }, g); return { g, ig }; };
        // side view, facing right; (x, y) = rail level under the cab; about 310 x 165 at s = 1
        function loco(parent, { id, x, y, s = 1, col = INK, body = DEEP, acc = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s), w = [];
          S('rect', { x: -6, y: -44, width: 300, height: 16, fill: col }, ig);
          S('rect', { x: 0, y: -150, width: 92, height: 108, rx: 8, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 16, y: -134, width: 46, height: 40, rx: 4, fill: acc, opacity: 0.85, id: `${id}-win` }, ig);
          S('path', { d: 'M-10 -152 H102', stroke: col, 'stroke-width': 9, 'stroke-linecap': 'round' }, ig);
          S('rect', { x: 92, y: -112, width: 190, height: 70, rx: 30, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('rect', { x: 150, y: -134, width: 36, height: 26, rx: 10, fill: body, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 226, y: -152, width: 30, height: 44, fill: body, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M282 -42 L314 -6 L282 -6 Z', fill: col }, ig);
          [[44, 27], [148, 31], [228, 31]].forEach(([cx, r], k) => {
            const wg = S('g', { id: `${id}-w${k}` }, ig);
            S('circle', { cx, cy: -r, r, fill: body, stroke: col, 'stroke-width': 6 }, wg);
            S('path', { d: `M${cx - r + 5} ${-r} H${cx + r - 5} M${cx} ${-2 * r + 5} V${-5}`, stroke: acc, 'stroke-width': 5 }, wg);
            w.push(wg);
          });
          S('path', { d: 'M44 -27 H228', stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, ig);
          return { g, ig, w, win };
        }
        // a wagon with a blank plate; (x, y) = rail level under its left end; 150 wide plus a coupler
        function wagon(parent, { id, x, y, s = 1, col = INK, fill = CY }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: -12, y: -48, width: 174, height: 10, fill: col }, ig);
          S('rect', { x: 0, y: -108, width: 150, height: 64, rx: 6, fill, stroke: col, 'stroke-width': 5 }, ig);
          S('rect', { x: 46, y: -92, width: 58, height: 30, rx: 3, fill: DEEP, opacity: 0.55 }, ig);
          [36, 114].forEach((cx) => S('circle', { cx, cy: -20, r: 19, fill: DEEP, stroke: col, 'stroke-width': 5 }, ig));
          return { g, ig };
        }
        // a straight rail with sleepers, side view
        function track(parent, { id, x0, x1, y, col = '#6aa9d0' }) {
          const g = S('g', { id }, parent);
          for (let x = x0 + 8; x < x1 - 10; x += 36) S('rect', { x, y: y + 4, width: 14, height: 16, fill: '#3d78a6' }, g);
          S('path', { d: `M${x0} ${y} H${x1}`, stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
          return g;
        }
        // signal box, side view; (x, y) = ground under its left wall; 280 x 300 at s = 1
        function box(parent, { id, x, y, s = 1, col = INK }) {
          const { g, ig } = wrap(parent, id, x, y, s);
          S('rect', { x: 0, y: -120, width: 220, height: 120, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          S('path', { d: 'M0 -80 H220 M0 -40 H220 M70 -120 V-80 M150 -80 V-40 M70 -40 V0', stroke: '#3d78a6', 'stroke-width': 4 }, ig);
          S('rect', { x: -12, y: -232, width: 244, height: 112, fill: DEEP, stroke: col, 'stroke-width': 6 }, ig);
          const win = S('rect', { x: 6, y: -216, width: 208, height: 72, fill: CY, opacity: 0.3, id: `${id}-win` }, ig);
          S('path', { d: 'M75 -216 V-144 M145 -216 V-144', stroke: col, 'stroke-width': 4 }, ig);
          S('path', { d: 'M-34 -232 L110 -304 L254 -232 Z', fill: DEEP, stroke: col, 'stroke-width': 6, 'stroke-linejoin': 'round' }, ig);
          const lev = S('g', { id: `${id}-lev` }, ig);
          S('path', { d: 'M110 -150 L110 -198', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round' }, lev);
          S('circle', { cx: 110, cy: -200, r: 9, fill: '#ffb454' }, lev);
          return { g, ig, win, lev };
        }
        // steam puffs from a locomotive chimney, one burst per time
        function puffs(tl, L, times, { n = 3 } = {}) {
          times.forEach((t) => { for (let i = 0; i < n; i++) {
            const c = S('circle', { cx: 241, cy: -170, r: 15 + i * 5, fill: INK, opacity: 0 }, L.ig);
            tl.fromTo(c, { opacity: 0, scale: 0.4, x: 0, y: 0, transformOrigin: '50% 50%' }, { opacity: 0.9, scale: 0.8, duration: 0.01, immediateRender: false }, t + i * 0.13);
            tl.to(c, { opacity: 0, scale: 2.3, y: -95 - i * 22, x: -40 - i * 30, duration: 0.9, ease: 'power2.out' }, t + i * 0.13 + 0.01);
          } });
        }
        // wheels turn for a while (whole turns, so the last frame is clean)
        function roll(tl, L, t, dur, turns = 2) { tl.fromTo(L.w, { rotation: 0, transformOrigin: '50% 50%' }, { rotation: 360 * turns, duration: dur, ease: 'none', immediateRender: false }, t); }
        return { loco, wagon, track, box, puffs, roll };
      })();
      const a = (w, n) => KIT.cue('l08', w, n), b = (w, n) => KIT.cue('l09', w, n), c = (w, n) => KIT.cue('l10', w, n), D = KIT.sceneDur('tank'), S = KIT.svgEl;
      KIT.bind('#tk-cam');
      const tl = gsap.timeline({ paused: true });
      const pulse = (t, o = 0.2) => tl.fromTo('#tk-flash', { opacity: o }, { opacity: 0, duration: 0.5, ease: 'none', immediateRender: false }, t);
      const V = document.getElementById('tk-svg'), d9 = KIT.data('l09'), d10 = KIT.data('l10');

      // l08: two lanes. Left: the driver who also throws the switch. Right: the signal box and its workers.
      const div = S('path', { d: 'M520 260 V1150', class: 'ln faint thick', id: 'tk-div' }, V);
      const icA = S('g', { id: 'tk-icA' }, V), icB = S('g', { id: 'tk-icB' }, V);
      RAIL.track(icA, { id: 'tk-ta', x0: 60, x1: 470, y: 520 });
      const LA = RAIL.loco(icA, { id: 'tk-la', x: 90, y: 520, s: 1.0 });
      S('path', { d: 'M64 -60 L96 -128', stroke: '#ffb454', 'stroke-width': 9, 'stroke-linecap': 'round' }, LA.ig);
      const BX = RAIL.box(icB, { id: 'tk-bx', x: 580, y: 540, s: 0.58 });
      [400, 470, 540].forEach((y, k) => { RAIL.track(icB, { id: `tk-tb${k}`, x0: 760, x1: 1030, y }); RAIL.loco(icB, { id: `tk-wb${k}`, x: 780, y, s: 0.3 }); });
      KIT.pop(tl, '#tk-a', a('comparison'), { from: 0.5 }); KIT.pop(tl, '#tk-b', a('comparison') + 0.1, { from: 0.5 });
      tl.fromTo(icA, { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, a('comparison'));
      tl.fromTo(icB, { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, a('comparison') + 0.08);
      RAIL.puffs(tl, LA, [a('direct')]);
      tl.fromTo('#tk-a', { backgroundColor: '#071d35' }, { backgroundColor: '#3a2a10', duration: 0.2, yoyo: true, repeat: 1, immediateRender: false }, a('direct'));
      [['#tk-e1', 'workers'], ['#tk-e2', 'model'], ['#tk-e3', 'budget']].forEach(([sel, w]) => { KIT.slam(tl, sel, a(w) - 0.12, { from: 2.2, shake: false }); KIT.shake(tl, '#tk-cam', a(w) + 0.08, { amp: 7, dur: 0.2 }); pulse(a(w), 0.14); });

      // l09: a full budget tank under each lane. "eighteen": the left one drains to 18% used; "almost all": the right one nearly empties
      tl.to(['#tk-e1', '#tk-e2', '#tk-e3'], { opacity: 0, y: -40, duration: 0.3, stagger: 0.05 }, b('With'));
      const T = [[150, '#ffb454', 'L'], [650, '#a8dcf2', 'R']].map(([x, col, k]) => {
        const g = S('g', { id: `tk-tank${k}` }, V);
        const f = S('rect', { x: x + 8, y: 708, width: 224, height: 424, fill: col, id: `tk-f${k}` }, g);
        S('rect', { x, y: 700, width: 240, height: 440, rx: 14, fill: 'none', stroke: '#f2f8ff', 'stroke-width': 7 }, g);
        [0.25, 0.5, 0.75].forEach((q) => S('path', { d: `M${x} ${700 + 440 * q} h26`, stroke: '#f2f8ff', 'stroke-width': 5 }, g));
        return { g, f };
      });
      T.forEach((tk, k) => { tl.fromTo(tk.g, { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, b('With') + 0.15 + k * 0.1); tl.fromTo(tk.f, { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: 1, duration: 0.5, ease: 'power2.out' }, b('With') + 0.3 + k * 0.1); });
      KIT.pop(tl, '#tk-bench', b('one')); KIT.pop(tl, '#tk-m1', b('model'));
      tl.to(T[0].f, { scaleY: 1 - d9._dcUsed, duration: 0.6, ease: 'power2.inOut' }, b('eighteen') - 0.2);
      tl.fromTo('#tk-dc', { opacity: 0 }, { opacity: 1, duration: 0.15 }, b('eighteen')); KIT.count(tl, '#tk-dc', b('eighteen'), 0.6);
      KIT.rise(tl, '#tk-used', b('percent'), { y: 12 });
      pulse(b('eighteen'), 0.25);
      tl.to(T[1].f, { scaleY: Math.max(0.02, 1 - d9._mrUsed), duration: 1.0, ease: 'power2.inOut' }, b('used', 1) - 0.2);
      KIT.pop(tl, '#tk-mr', b('almost'));
      pulse(b('almost'), 0.18);
      tl.fromTo('#tk-cam', { x: 40 }, { x: -40, duration: b('all') + 0.5 - b('With'), ease: 'sine.inOut', immediateRender: false }, b('With'));

      // l10: one absolute calls axis. The used-calls bar and the dashed budget marker share its scale.
      const Y0 = 1100, top = 380, cmax = d10._budgetHigh * 1.08, k = (Y0 - top) / cmax, yy = (v) => Y0 - v * k;
      const axis = S('path', { d: `M210 ${Y0} V${top} M194 ${top + 26} L210 ${top} L226 ${top + 26} M210 ${Y0} H500`, class: 'ln thick', id: 'tk-axis' }, V);
      const bar = S('rect', { x: 250, y: yy(d10._dcCallsHigh), width: 150, height: d10._dcCallsHigh * k, fill: '#ffb454', id: 'tk-bar' }, V);
      const mk = S('path', { d: `M220 ${yy(d10._budgetLow)} H470`, class: 'ln cyan heavy dash', id: 'tk-mk' }, V);
      const g0 = S('g', { id: 'tk-gauge' }, V), gx = 820, gy = 760, gr = 140;
      S('path', { d: `M${gx - gr} ${gy} A ${gr} ${gr} 0 0 1 ${gx + gr} ${gy}`, class: 'ln thick' }, g0);
      const needle = S('path', { d: `M${gx} ${gy} L${gx - gr + 24} ${gy}`, stroke: '#ffb454', 'stroke-width': 10, 'stroke-linecap': 'round', id: 'tk-needle' }, g0);
      S('circle', { cx: gx, cy: gy, r: 14, fill: '#f2f8ff' }, g0);
      const t0 = c('With');
      tl.to([T[0].g, T[1].g], { y: 700, opacity: 0, duration: 0.4, ease: 'power3.in', stagger: 0.06 }, t0);
      tl.to(['#tk-dc', '#tk-used', '#tk-mr', '#tk-b', icB], { opacity: 0, duration: 0.3 }, t0);
      tl.to([icA, div], { opacity: 0, duration: 0.3 }, t0);
      tl.to('#tk-cam', { x: 0, duration: 0.3 }, t0);
      KIT.draw(tl, axis, t0 + 0.2, 0.45);
      tl.to('#tk-m1', { rotationX: 90, opacity: 0, duration: 0.15 }, c('model'));
      tl.fromTo('#tk-m2', { rotationX: -90, opacity: 0 }, { rotationX: 0, opacity: 1, duration: 0.2 }, c('model') + 0.15);
      pulse(c('model'), 0.15);
      tl.fromTo(mk, { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.15 }, c('direct'));
      tl.fromTo(bar, { scaleY: 0, transformOrigin: '50% 100%' }, { scaleY: d10._dcCallsLow / d10._dcCallsHigh, duration: 0.45, ease: 'power3.out' }, c('direct') + 0.1);
      KIT.rise(tl, '#tk-bud', c('direct') + 0.15, { y: 10 });
      document.getElementById('tk-bud').style.top = `${yy(d10._budgetLow) - 30}px`;
      document.getElementById('tk-calls').style.top = `${yy(d10._dcCallsHigh) - 26}px`;
      // "doubled": the budget marker climbs first, the bar follows to twice its height
      const dy = yy(d10._budgetHigh) - yy(d10._budgetLow);
      tl.to(mk, { y: dy, duration: 0.5, ease: 'power3.inOut' }, c('doubled') - 0.1);
      tl.to('#tk-bud', { y: dy, duration: 0.5, ease: 'power3.inOut' }, c('doubled') - 0.1);
      tl.to(bar, { scaleY: 1, duration: 0.6, ease: 'power3.inOut' }, c('doubled') + 0.15);
      tl.fromTo('#tk-calls', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3 }, c('calls') + 0.2);
      pulse(c('doubled'), 0.2);
      // "score": a small gauge; on "little" its needle moves a hair
      const ang = (v) => (v / 100) * 180;
      tl.fromTo(g0, { opacity: 0, scale: 0.4, transformOrigin: '50% 100%' }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, c('score'));
      tl.fromTo(needle, { rotation: 0, svgOrigin: `${gx} ${gy}` }, { rotation: ang(d10._scoreLow), svgOrigin: `${gx} ${gy}`, duration: 0.4, ease: 'power2.out' }, c('score') + 0.1);
      tl.to(needle, { rotation: ang(d10._scoreHigh), svgOrigin: `${gx} ${gy}`, duration: 0.3, ease: 'power2.out' }, c('little'));
      KIT.pop(tl, '#tk-score', c('score') + 0.15, { from: 0.5 });
      pulse(c('little'), 0.12);
      // "Continuing": the paper's line, read on camera for about 2 s, then back to the axis
      const tR = c('Continuing') - 0.45;
      tl.fromTo('#tk-dim', { opacity: 0 }, { opacity: 0.86, duration: 0.3 }, tR);
      const R = KIT.read(tl, { cam: '#tk-rcam', parent: '#tk-rstage', hud: '#tk-hud', tagY: 520, id: 'enough', t: tR, label: d10.receipt,
        x: 40, y: 900, width: 1000, zoom: 3.0, fx: 90, fy: 800, follow: 0,
        marks: [[c('Continuing'), c('enough') + 0.35]], circles: [{ word: 'enough;', t: c('enough') + 0.05 }] });
      tl.set(R.el, { rotationZ: 0, rotationX: 0 }, tR + 0.6);
      const tB = c('enough') + 0.5;
      tl.set([R.el, '#tk-hud'], { opacity: 0 }, tB);
      tl.set('#tk-rcam', { x: 0, y: 0, scale: 1 }, tB);
      tl.set('#tk-dim', { opacity: 0 }, tB);
      tl.fromTo('#tk-cam', { scale: 1 }, { scale: 1.06, duration: D - tB, ease: 'power2.out', immediateRender: false }, tB);
      window.__timelines["tank"] = tl;
    })();
  </script>
</template>
