<template id="g03-template">
  <div id="root" data-composition-id="g03" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="g03.title"></h2>
      <div class="pk-compare">
        <div class="pk-x">
          <div class="pk-x-label" data-bind="g03.tag_before"></div>
          <p class="pk-x-text" data-bind="g03.x_before"></p>
        </div>
        <div class="pk-arrow"></div>
        <div class="pk-cmp is-good">
          <div class="pk-cmp-label" data-bind="g03.tag_after"></div>
          <p class="pk-cmp-text" data-bind="g03.after"></p>
        </div>
      </div>
      <div class="pk-callout is-cyan"><div class="pk-callout-text" data-bind="g03.note"></div></div>
    </div>
  </div>
</template>
