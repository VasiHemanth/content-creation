<template id="g05-template">
  <div id="root" data-composition-id="g05" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="g05.title"></h2>
      <ol class="pk-steps">
        <li><div><div class="pk-step-title" data-bind="g05.steps.0.title"></div><div class="pk-step-text" data-bind="g05.steps.0.text"></div></div></li>
        <li><div><div class="pk-step-title" data-bind="g05.steps.1.title"></div><div class="pk-step-text" data-bind="g05.steps.1.text"></div></div></li>
        <li><div><div class="pk-step-title" data-bind="g05.steps.2.title"></div><div class="pk-step-text" data-bind="g05.steps.2.text"></div></div></li>
        <li><div><div class="pk-step-title" data-bind="g05.steps.3.title"></div><div class="pk-step-text" data-bind="g05.steps.3.text"></div></div></li>
      </ol>
    </div>
  </div>
</template>
