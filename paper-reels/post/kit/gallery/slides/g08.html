<template id="g08-template">
  <div id="root" data-composition-id="g08" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="g08.title"></h2>
      <div class="pk-code"><div class="pk-code-bar"><span class="pk-code-label" data-bind="g08.prompt_label"></span></div><pre class="pk-code-body" data-bind="g08.prompt"></pre></div>
      <div class="pk-arrow is-amber"></div>
      <div class="pk-code is-good"><div class="pk-code-bar"><span class="pk-code-label" data-bind="g08.output_label"></span></div><pre class="pk-code-body" data-bind="g08.output"></pre></div>
    </div>
  </div>
</template>
