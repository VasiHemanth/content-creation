<template id="s02-template">
  <div id="root" data-composition-id="s02" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="s02.title"></h2>
      <div class="pk-compare">
        <div class="pk-cmp is-good">
          <div class="pk-cmp-label" data-bind="s02.you_label"></div>
          <p class="pk-cmp-text" data-bind="s02.you"></p>
        </div>
        <div class="pk-arrow"></div>
        <div class="pk-cmp">
          <div class="pk-cmp-label" data-bind="s02.under_label"></div>
          <p class="pk-cmp-text" data-bind="s02.under"></p>
        </div>
      </div>
      <div class="pk-x">
        <div class="pk-x-label" data-bind="s02.wrong_label"></div>
        <p class="pk-x-text" data-bind="s02.x_wrong"></p>
      </div>
    </div>
  </div>
</template>
