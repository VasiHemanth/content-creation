<template id="s05-template">
  <div id="root" data-composition-id="s05" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="s05.title"></h2>
      <div class="pk-panel is-mint">
        <div class="pk-body" data-bind="s05.rust1"></div>
        <div class="pk-body" data-bind="s05.rust2"></div>
      </div>
      <div class="pk-callout">
        <div class="pk-callout-text" data-bind="s05.gil"></div>
      </div>
      <div class="pk-stack is-tight">
        <div class="pk-body" data-bind="s05.cuda"></div>
        <div class="pk-body" data-bind="s05.cpu"></div>
        <div class="pk-body" data-bind="s05.io"></div>
      </div>
    </div>
  </div>
</template>
