<template id="s06-template">
  <div id="root" data-composition-id="s06" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="s06.title"></h2>
      <div class="pk-stack is-tight">
        <div class="pk-panel is-cyan"><div class="pk-body" data-bind="s06.numpy"></div></div>
        <div class="pk-panel is-amber"><div class="pk-body" data-bind="s06.torch"></div></div>
      </div>
      <div class="pk-stack is-tight">
        <div class="pk-body" data-bind="s06.took"></div>
        <div class="pk-body" data-bind="s06.notake"></div>
      </div>
      <div class="pk-x">
        <div class="pk-x-label" data-bind="s06.wrong_label"></div>
        <p class="pk-x-text" data-bind="s06.x_wrong"></p>
      </div>
    </div>
  </div>
</template>
