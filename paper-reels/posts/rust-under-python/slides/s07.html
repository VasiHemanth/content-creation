<template id="s07-template">
  <div id="root" data-composition-id="s07" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="s07.title"></h2>
      <div class="pk-stack is-tight">
        <div class="pk-panel is-mint">
          <div class="pk-body" data-bind="s07.qdrant"></div>
          <div class="pk-body" data-bind="s07.qclient"></div>
        </div>
        <div class="pk-panel is-cyan">
          <div class="pk-body" data-bind="s07.lance"></div>
        </div>
      </div>
      <div class="pk-callout">
        <div>
          <div class="pk-callout-text" data-bind="s07.candle"></div>
          <div class="pk-callout-text" data-bind="s07.notorch"></div>
        </div>
      </div>
    </div>
  </div>
</template>
