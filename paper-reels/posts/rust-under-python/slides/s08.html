<template id="s08-template">
  <style>
    .s08-list { flex: 1 1 auto; justify-content: space-between; }
  </style>
  <div id="root" data-composition-id="s08" data-width="1080" data-height="1350">
    <div class="pk-page">
      <h2 class="pk-h2" data-bind="s08.title"></h2>
      <div class="pk-stack s08-list">
        <div class="pk-callout"><div class="pk-callout-text" data-bind="s08.gil"></div></div>
        <div class="pk-callout is-cyan"><div class="pk-callout-text" data-bind="s08.free"></div></div>
        <div class="pk-callout is-coral"><div class="pk-callout-text" data-bind="s08.vendor"></div></div>
        <div class="pk-callout is-mint"><div class="pk-callout-text" data-bind="s08.norewrite"></div></div>
      </div>
    </div>
  </div>
</template>
