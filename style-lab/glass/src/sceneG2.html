#root{position:absolute;inset:0;overflow:hidden;background:#050507}

<script>
(function () {
  var root = document.getElementById("root"), SC = TIMING.scenes.G2, W = TIMING.lines[1].words, L = function (g) { return g - SC.start; };

    tl.fromTo(win.backG, { opacity: 0 }, { opacity: .8, duration: .9, ease: "power1.inOut" }, L(W[4].start));
