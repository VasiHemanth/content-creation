#root{position:absolute;inset:0;overflow:hidden;background:#050507}

<div id="root" data-composition-id="G3" data-width="1080" data-height="1920"></div>
<script>
(function () {
  var root = document.getElementById("root"), SC = TIMING.scenes.G3, W = TIMING.lines[2].words, L = function (g) { return g - SC.start; };
  Glass.ready("G3", function () { return Glass.fontsReady().then(function () { Glass.compute(); return Glass.assets([2]); }).then(function (A) {
    var S = Glass.stage(root, A, { key: "G3", pane: 2, floodIn: Glass.SEAM[1], floodOut: Glass.SEAM[2], prev: [1] }), win = S.win, tl = gsap.timeline({ paused: true });

    Glass.common(tl, S, SC, { s0: 1.1, s1: 1.03 });

    tl.to(win.castG, { opacity: .1, duration: 1.0, ease: "power2.inOut" }, L(W[3].start));

        var t = t0 + span * i / Math.max(1, arr.length);

    light(by("curve"), L(W[7].start), 1, .5);

  }); });
