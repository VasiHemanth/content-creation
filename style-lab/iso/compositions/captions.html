<template>
<style>
@font-face{font-family:"Space Grotesk";font-weight:500;src:url("assets/fonts/space-grotesk-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Space Grotesk";font-weight:700;src:url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2")}
#root{position:absolute;inset:0;overflow:visible;pointer-events:none}
.pill{position:absolute;left:0;top:0;width:1080px;height:1920px;visibility:hidden}
.bar{position:absolute;left:0;height:116px;top:1636px;display:flex;align-items:center;justify-content:center;gap:16px;white-space:nowrap}
.w{display:inline-block;padding:10px 22px 14px;border-radius:22px;background:#1f2740;color:#f4f7fc;font:700 62px/1 "Space Grotesk",sans-serif;box-shadow:0 5px 0 #0f1424;opacity:0}
</style>
<div id="root" data-composition-id="captions" data-width="1080" data-height="1920"></div>
<script>
(function () {
  var root = document.getElementById("root");
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["captions"] = document.fonts.load("700 62px 'Space Grotesk'", "Aa").then(function () {
    var m = document.createElement("canvas").getContext("2d"); m.font = "700 62px 'Space Grotesk'";
    var wdt = function (t) { return m.measureText(t).width + 44 + 16; };
    var groups = [], cur = [], cw = 0;
    TIMING.words.forEach(function (w) {
      var ww = wdt(w.text);
      if (cur.length && (cw + ww > 1000 || cur.length >= 4)) { groups.push(cur); cur = []; cw = 0; }
      cur.push(w); cw += ww;
      if (/[.?!:]$/.test(w.text)) { groups.push(cur); cur = []; cw = 0; }
    });
    if (cur.length) groups.push(cur);
    var items = groups.map(function (g) {
      var el = document.createElement("div"); el.className = "pill"; var bar = document.createElement("div"); bar.className = "bar"; el.appendChild(bar);
      var ws = g.map(function (w) { var s = document.createElement("span"); s.className = "w"; s.textContent = w.text; bar.appendChild(s); return s; });
      root.appendChild(el); return { el: el, ws: ws, g: g, s: g[0].start, e: g[g.length - 1].end };
    });
    var tl = gsap.timeline({ paused: true });
    items.forEach(function (G, gi) {
      var nx = items[gi + 1], hide = Math.min(G.e + 0.3, nx ? nx.s - 0.03 : 999);
      tl.set(G.el, { visibility: "visible" }, Math.max(0, G.s - 0.03));
      G.g.forEach(function (w, k) {
        var ts = Math.max(0, w.start - 0.03), te = k < G.g.length - 1 ? G.g[k + 1].start - 0.03 : Math.min(G.e + 0.12, hide);
        tl.fromTo(G.ws[k], { opacity: 0, y: 14, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "power2.out" }, ts);
        tl.to(G.ws[k], { color: "#ffb347", duration: 0.001 }, ts + 0.02).to(G.ws[k], { color: "#f4f7fc", duration: 0.001 }, te);
      });
      tl.set(G.el, { visibility: "hidden" }, hide);
    });
    window.__timelines["captions"] = tl;
  });
})();
</script>
</template>
