</div>
<script>
(function () {
  window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
  window.__hf.buildReady["world"] = Promise.resolve().then(function () {
    var S = ISO.world.build(document.getElementById("cv"));
    var tl = gsap.timeline({ paused: true });
    var an = { p: 0 };
    // one anchor tween: the diorama is drawn from tl.time() alone, so every frame is a pure function of time

  });
