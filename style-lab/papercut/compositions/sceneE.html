<template>
<style>

    });

    var LQ = JH - 70 - 14;
    var liqImg = bake({ w: JW - 44, h: LQ, S: 2, seed: 3131, cut: 1.2, edge: false, shape: '<rect width="' + (JW - 44) + '" height="' + LQ + '" rx="16" fill="' + MIX + '"/>' });

    var padImg = bake({ w: 150, h: 20, S: 2, seed: 3232, cut: 1.6, shape: '<path d="' + cutRect(150, 20, 8, rngOf("pad"), 1) + '" fill="' + PAL.cream + '"/>' });

    var shaftImg = bake({ w: 14, h: 120, S: 2, seed: 3233, cut: 1.2, shape: '<rect width="14" height="120" fill="' + PAL.cream + '"/>' });

    var spImg = bake({ w: 70, h: 34, S: 2, seed: 3636, cut: 1.6, shape: '<path d="M0 0 L70 6 L52 34 L0 24Z" fill="' + PAL.cream + '"/>' });

    // stream onto "it" + the "it" tag + its coat of mixed colour
    var itW = 134, itH = 118, itX = 659 - itW / 2, itY = 1388;
    var iimg = bake({ w: itW, h: itH, S: 2, seed: 4040, shape: '<path d="' + cutRect(itW, itH, 18, rngOf("itE"), 1.6) + '" fill="' + PAL.coral + '"/>' });
    var itp = piece({ x: itX, y: itY, w: itW, h: itH, img: iimg, lift: .5, blur: 8, parent: par, ox: "50%", oy: "100%" });
    var coatImg = bake({ w: itW, h: itH, S: 2, seed: 4041, cut: 2.4, shape: '<path d="' + cutRect(itW, itH, 18, rngOf("itE"), 1.6) + '" fill="' + MIX + '"/>' });
    coatImg.style.clipPath = "inset(0 0 100% 0)"; itp.mv.appendChild(coatImg);
    var itt = divEl("", itp.mv, "mt"); itt.textContent = "it"; itt.style.cssText += ";font-size:70px;color:#f6e8c8";
    var stImg = bake({ w: 26, h: 190, S: 2, seed: 4242, cut: 1.6, shape: '<path d="M2 0 L24 0 L22 190 L4 190Z" fill="' + MIX + '"/>' });
    var stream = piece({ x: 646, y: JY + JH - 48, w: 26, h: 190, img: stImg, lift: .1, blur: 0, parent: par });
    stream.sh.style.left = (JX + JW + 34 - 13) + "px";
    var shelfImg = bake({ w: 300, h: 26, S: 2, seed: 4343, cut: 2, shape: '<path d="' + cutRect(300, 26, 8, rngOf("eshelf"), 1.2) + '" fill="' + PAL.cream + '"/>' });
    var eshelf = piece({ x: 659 - 150, y: itY + itH - 4, w: 300, h: 26, img: shelfImg, lift: .4, blur: 6, parent: par });
    // drops
    var dimg = function () { return bake({ key: "drop", w: 22, h: 30, S: 3, seed: 5050, cut: 1, shape: '<path d="M11 0 C16 10 22 16 22 21 A11 11 0 0 1 0 21 C0 16 6 10 11 0Z" fill="' + PAL.saffron + '"/>' }); };
    var order = [PS.ANIMAL, 0, 2, 3, 4, 5, 6, 7, 9, 10, 11], rr = rngOf("drops");
    var allDrops = [];
    order.forEach(function (wi) {
      var n = wi == PS.ANIMAL ? 12 : wi == PS.STREET ? 3 : 1;
      for (var q = 0; q < n; q++) { var img = dimg(); img.style.cssText += ";left:-11px;top:-15px;width:22px;height:30px"; dropWrap.appendChild(img); allDrops.push({ wi: wi, el: img, k: q, n: n, jx: (rr() - .5) * 10 }); }
    });
    return bakeAll().then(function () {
      var R = {}; Object.keys(strips).forEach(function (k) { R[k] = strips[k].mount(); });
      var tl = gsap.timeline({ paused: true });
      var lay = H.layers.map(function (l) { return { el: l.el, d: l.d }; });
      var key = function (t, s, P, e) { return { t: t, s: s, x: s * (P.x - 540), y: s * (P.y - 960), ease: e }; };
      var tp = L(W[14].start);
      cameraTween(tl, lay, [key(0, 1.0, { x: 540, y: 960 }), key(L(W[7].start), 1.08, { x: 540, y: 1000 }, "sine.inOut"), key(tp - .3, 1.2, { x: 600, y: 1180 }, "power2.inOut"), key(SC.dur, 1.28, { x: 640, y: 1250 }, "sine.inOut")], 540, 960);
      var hop = function (T, t, h) { tl.to(T.mv, { y: -h, duration: .15, ease: PE.stepped("power2.out", .15) }, t).to(T.mv, { y: 0, duration: .26, ease: PE.stepped(PE.card, .26) }, t + .15); };

      Object.keys(tags).forEach(function (k, i) { var T = tags[k], t0 = .4 + i * .05; tl.fromTo(T.mv, { scaleY: .05, opacity: 0, y: 20 }, { scaleY: 1, opacity: 1, y: 0, duration: .4, ease: PE.stepped(PE.spring(6, 1.2), .4) }, snap12(t0)); });

        tl.fromTo(P.mv, { scale: .1, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: PE.stepped(PE.spring(5.5, 1.3), .35) }, t);

      });
      Object.keys(strips).forEach(function (k, i) {
        var t = snap12(ts + i * .08), pr = { p: 0 };

        tl.to(pr, { p: 1, duration: .6, ease: PE.stepped(PE.paper, .6), onUpdate: (function (rr2, q) { return function () { rr2.apply(q.p); }; })(R[k], pr) }, t);
      });
      // ---- drops, paddle, liquid, pour: all pure functions of time ----
      var d0 = L(W[7].start), d1 = L(W[11].end) + .5, FL = .38, total = allDrops.length, fall = 150;
      var byWord = {}; allDrops.forEach(function (d) { (byWord[d.wi] = byWord[d.wi] || []).push(d); });
      var sched = []; allDrops.forEach(function (d, i) { d.t0 = d0 + (d1 - d0) * ((d.k + .5) / d.n * .6 + order.indexOf(d.wi) / order.length * .4); d.dur = 1.05; });
      allDrops.sort(function (a, b) { return a.t0 - b.t0; });
      var pour0 = L(W[14].start) + .1;
      function levelAt(tq) { var c = 0; allDrops.forEach(function (d) { if (tq > d.t0 + d.dur + FL) c++; }); return c / total; }
      function render(t) {
        var tq = Math.floor(t * 12 + 1e-6) / 12;
        allDrops.forEach(function (d) {
          var u = (tq - d.t0) / d.dur, a = strips[d.wi], on = u >= 0 && u < 1 + FL / d.dur;
          if (!on) { d.el.style.opacity = 0; return; }
          var x, y, rot;
          if (u < 1) { var e = u * u * (3 - 2 * u), pt = PS.quadAt(a.a, a.c, a.b, e); x = pt.x + d.jx * Math.sin(u * 3); y = pt.y - 6; rot = Math.sin(u * 8 + d.k) * 14; }
          else { var f = (u - 1) * d.dur / FL; x = a.b.x; y = a.b.y + 30 + (fall) * f * f; rot = 0; }
          d.el.style.opacity = 1; gsap.set(d.el, { x: x, y: y, rotation: rot, scale: .85 + (d.wi == PS.ANIMAL ? .15 : 0) });
        });
        var lv = levelAt(tq), mixed = tq > L(W[12].start) ? Math.min(1, (tq - L(W[12].start)) / 1.2) : 0;
        gsap.set(liquid.mv, { scaleY: .05 + lv * .95 * Math.min(1, 1) });
        liquid.mv.style.opacity = lv > 0 ? 1 : 0;
        if (tq >= L(W[12].start)) {                              // "blends": the paddle spins; seen edge-on it narrows and widens

        coatImg.style.clipPath = "inset(0 0 " + (100 - coat * 100) + "% 0)";
        if (tq > pour0 + 1.2) stream.mv.style.clipPath = "inset(" + Math.min(100, (tq - pour0 - 1.2) / .35 * 100) + "% 0 0 0)";
      }

    });
  }); });
})();
</script>
