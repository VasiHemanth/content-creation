<template>
<style>

.mt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 74px/1 Fredoka,sans-serif;color:#1a1a2e;padding-bottom:6px}
</style>
<div id="root" data-composition-id="sceneG" data-width="1080" data-height="1920"></div>

</template>
