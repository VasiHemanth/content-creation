<template>
<style>

@font-face{font-family:"Space Mono";font-weight:400;src:url("assets/fonts/space-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url("assets/fonts/space-mono-latin-700-normal.woff2") format("woff2")}

</style>
<div id="root" data-composition-id="S6" data-width="1080" data-height="1920"></div>
<script>
(function () {
  var root = document.getElementById("root"), SC = TIMING.scenes.S6, LN = TIMING.lines, D = RisoData, P = RisoPlots, B = P.BOX;

  }); });

</script>
