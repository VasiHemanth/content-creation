<template>
<style>
/*@FONTS*/
#root{position:absolute;inset:0;overflow:visible;pointer-events:none}
</style>
<div id="root" data-composition-id="captions" data-width="1080" data-height="1920"></div>
<script>
(function () {
  var root = document.getElementById("root"), FS = 44, Y = 1720;
  G.ready("captions", function () { return G.fontsReady().then(function () {
    var svg = G.root(root);
    G.rect(svg, 60, 1648, 960, 4, G.C.k);
    var sp = G.tw(" ", FS, 500, 0), groups = [], cur = [], curW = 0;
    TIMING.words.forEach(function (w) {
      var ww = G.tw(w.text, FS, 500, 0);
      if (cur.length && (curW + sp + ww > 960 || cur.length >= 6)) { groups.push(cur); cur = []; curW = 0; }
      cur.push(w); curW += (cur.length > 1 ? sp : 0) + ww;
      if (/[.?!]$/.test(w.text)) { groups.push(cur); cur = []; curW = 0; }
    });
    if (cur.length) groups.push(cur);
    var tl = gsap.timeline({ paused: true }), items = [];
    groups.forEach(function (g, gi) {
      var x = 60, gel = G.svg("g", { visibility: "hidden" }, svg), rows = [];
      g.forEach(function (w) { var t = G.text(gel, w.text, { x: x, y: Y, size: FS, weight: 500, fill: G.C.k }); rows.push({ w: w, t: t }); x += G.tw(w.text, FS, 500, 0) + sp; });
      items.push({ gel: gel, rows: rows, s: g[0].start, e: g[g.length - 1].end });
    });
    items.forEach(function (Gp, gi) {
      var nxt = items[gi + 1], hide = Math.min(Gp.e + .3, nxt ? nxt.s - .02 : 999);
      tl.set(Gp.gel, { visibility: "visible" }, Math.max(0, Gp.s - .02));
      Gp.rows.forEach(function (R, k) {
        var ts = Math.max(0, R.w.start - .02), te = k < Gp.rows.length - 1 ? Gp.rows[k + 1].w.start - .02 : Math.min(Gp.e + .1, hide);
        tl.set(R.t, { fill: G.C.r }, ts).set(R.t, { fill: G.C.k }, te);
      });
      tl.set(Gp.gel, { visibility: "hidden" }, hide);
    });
    window.__timelines["captions"] = tl;
  }); });
})();
</script>
</template>
