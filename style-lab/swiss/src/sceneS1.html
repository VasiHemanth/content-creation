<template>
<style>

#root{position:absolute;inset:0;overflow:hidden}
</style>
<div id="root" data-composition-id="sceneS1" data-width="1080" data-height="1920"></div>
<script>
(function () {
  var root = document.getElementById("root"), SC = TIMING.scenes.S1, W = TIMING.lines[0].words, L = function (g) { return g - SC.start; };
  G.ready("sceneS1", function () { return G.fontsReady().then(function () {
    var svg = G.root(root); G.bgRect(svg);
    // 1,000,000 set huge, flush left, clipped by the frame on purpose
    var big = G.text(svg, "1,000,000", { x: 60, y: 520, size: G.fit("1,000,000", 1090, 800), weight: 800 });
    G.label(svg, "names, sorted", 60, 600);
    var fld = G.field(root, 720);
    var lab = G.label(svg, "1 square = 1,000 names  /  1,000 squares", 60, 1380, G.C.k, 24);
    var tgt = G.label(svg, "red square = the name to find", 60, 1440, G.C.r, 24);
    var grid = G.gridLines(svg);
    var tl = gsap.timeline({ paused: true });
    var tR = L(W[4].start);                         // "Find one"

    window.__timelines["sceneS1"] = tl;
  }); });
