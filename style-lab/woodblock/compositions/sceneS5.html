<script>
(function () {
  var SC = TIMING.scenes.S5, root = document.getElementById("root"), w5 = document.getElementById("w5");
  var KAN = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十"];

    var eng = Print.engine(document.getElementById("s5c")), pg = document.getElementById("s5p").getContext("2d");

    var stepAt = function (k) { return T0 + (k - 1) * DT; };
    var kOf = function (t) { return t < T0 ? 0 : Math.min(20, Math.floor((t - T0) / DT + 1e-6) + 1); };
    // thin progress line along the border (clockwise from the top left)
    var X0 = 24, Y0 = 24, X1 = 1056, Y1 = 1896, PER = 2 * (X1 - X0) + 2 * (Y1 - Y0);
    function border(g, frac) {

      g.strokeStyle = "#c8402a"; g.lineWidth = 6; g.lineCap = "round"; g.beginPath();
      for (var i = 0; i < 4 && len > 0; i++) { var s = segs[i], L = Math.hypot(s[2] - s[0], s[3] - s[1]), u = Math.min(1, len / L); g.moveTo(s[0], s[1]); g.lineTo(s[0] + (s[2] - s[0]) * u, s[1] + (s[3] - s[1]) * u); len -= L; }
      g.stroke();
    }
    function render(t) { var k = kOf(t), v = k / 20; eng.draw({ mode: "rev", t: v, bank: Math.floor(t * 12) % 4 }); border(pg, v); }

    seals.forEach(function (s, k) {
      var t = stepAt(k + 1);
      if (k) tl.set(seals[k - 1], { visibility: "hidden" }, t);
      tl.set(s, { visibility: "visible" }, t);
      tl.fromTo(s, { scale: 1.55, opacity: 0, rotation: -4 + (k % 5) }, { scale: 1, opacity: 1, rotation: -2 + (k % 3), duration: .16, ease: "power4.in" }, t);

    });

  });
